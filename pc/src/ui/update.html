<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'" />
<title>更新 ChisaBot</title>
<link rel="stylesheet" href="skyglass-tokens.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="chrome.css" />
<link rel="stylesheet" href="update.css" />
<script src="chrome.js"></script>
</head>
<body class="update-page">
  <main class="update-stage" id="stage">
    <div class="update-stack">
      <div class="update-mark" aria-hidden="true">
        <img src="logo.png" alt="ChisaBot" width="68" height="68" draggable="false" />
      </div>
      <h1 class="update-title" id="title">
        <span class="update-title-action" id="title-action">正在更新</span>
        <span class="update-title-brand" id="title-brand">ChisaBot</span>
      </h1>
      <p class="update-subtitle" id="subtitle">你的机器人全程继续运行</p>
      <div
        class="update-progress"
        id="progress"
        role="progressbar"
        aria-label="更新进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="update-progress-fill" id="progress-fill"></div>
      </div>
      <p class="update-percent" id="percent" aria-live="polite">0%</p>
      <div class="update-actions-wrap" id="actions-wrap" data-open="false" aria-hidden="true">
        <div class="update-actions" id="actions">
          <button id="later" class="btn outline hidden" type="button">稍后</button>
          <button id="restart" class="btn hidden" type="button">立即重启</button>
          <button id="retry" class="btn hidden" type="button">重新检查</button>
          <button id="close-ok" class="btn hidden" type="button">知道了</button>
        </div>
      </div>
      <button id="download-latest" class="update-download-link" type="button">下载最新版本</button>
    </div>
  </main>
  <div class="win-bar">
    <section class="win-ctrls" aria-label="窗口">
      <button class="win-ctrl" data-win="minimize" type="button" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.5h8" stroke="currentColor" stroke-linecap="round" stroke-width="1.25"/></svg>
      </button>
      <button class="win-ctrl" data-win="toggle-maximize" type="button" aria-label="最大化" title="最大化">
        <svg class="ico-max" viewBox="0 0 10 10" fill="none" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.25"/></svg>
        <svg class="ico-restore" viewBox="0 0 10 10" fill="none" aria-hidden="true"><rect x="1" y="3" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.25"/><path d="M3.2 1.2h4.4c.7 0 1.2.5 1.2 1.2v4.4" stroke="currentColor" stroke-width="1.25"/></svg>
      </button>
      <button class="win-ctrl is-close" data-win="close" type="button" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="1.25"/></svg>
      </button>
    </section>
  </div>
<script src="sky.js"></script>
<script src="ui.js"></script>
<script src="update.js"></script>
</body>
</html>
