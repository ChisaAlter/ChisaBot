# Magpie (ghcr.io/yetone/magpie), the model gateway every Bot's model goes through.
#
# THE TAG IS A VARIABLE, NOT A PINNED DIGEST. 管理后台 → 模型平台 Magpie 可以一键更新这个网关
# （deploy/updater/magpie.sh），所以写死摘要只会被第一次更新覆盖掉。要自己钉住一个验证过的版本，
# 把 MAGPIE_IMAGE 设成一个摘要即可（deploy/.env 或 compose 的 environment），见 docs/magpie.md。
services:
  magpie:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:latest}
    container_name: magpie
    command: [web, --addr, "0.0.0.0:3430", --no-open]
    restart: unless-stopped
    env_file: ./private/magpie.env
    environment:
      MAGPIE_ADDR: "0.0.0.0:3425"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:3425:3425"
      - "127.0.0.1:3430:3430"
    volumes:
      - ./magpie-data:/config
    networks:
      - magpie
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  magpie:
    external: true
    name: ${MAGPIE_NETWORK:-chisabot_magpie}
