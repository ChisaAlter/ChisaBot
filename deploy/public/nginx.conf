user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Omit queries, referrers and Authorization from gateway logs.
    log_format openbot '$remote_addr "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';
    access_log /dev/stdout openbot;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 128m;
    keepalive_timeout 65s;

    # Compress responses after HTML session-guard injection. Upstream HTML
    # stays uncompressed below so sub_filter can still install the guard.
    # Keep event streams out of gzip so chat tokens are delivered immediately.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css application/json
               application/wasm image/svg+xml;

    # 带哈希的前端资源（文件名含内容哈希，永不变）：成功响应让浏览器长期缓存；错误不缓存。
    map $status $asset_cache_control {
        200 "private, max-age=31536000, immutable";
        default "no-store";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Validate the external Origin before replacing any upstream headers.
    map $http_origin $origin_allowed {
        default 0;
        "" 1;
        "https://chisabot.example.com:8443" 1;
    }

    # Cross-site links may open the app, but cross-site writes, fetches and
    # sockets may not use the site's session cookies.
    # 例外：/p/ 公开页面（DESIGN.md §54）在沙箱里打开（CSP sandbox = 不透明的源），它自己的图片 / 样式
    # 请求在浏览器看来是 cross-site；这些 GET 不带也用不到会话（下面 /p/ 不转发 Cookie）。
    map "$http_sec_fetch_site:$request_method:$http_sec_fetch_mode:$server_port$uri" $fetch_allowed {
        default 1;
        ~^cross-site:(GET|HEAD):navigate: 1;
        ~^cross-site:(GET|HEAD):[a-z-]*:8443/p/ 1;
        ~^cross-site: 0;
    }

    # Browser WebSocket upgrades always carry Origin. Do not admit a missing one.
    # 例外：IM 接入的 OneBot 反向 WebSocket（NapCat 等协议端不是浏览器，不带 Origin；只认连接自己的 token，不带 Cookie）。
    map "$http_upgrade:$http_origin:$server_port$uri" $socket_origin_allowed {
        default 1;
        ~*^websocket::8443/api/im/onebot/ 1;
        ~*^websocket:: 0;
    }

    map $http_origin $upstream_origin {
        default "";
        "https://chisabot.example.com:8443" "http://localhost:3001";
    }


    # Magpie is a distinct browser origin. Check it before adapting the
    # request to OpenBot's existing loopback authentication service.
    map $http_origin $magpie_origin_allowed {
        default 0;
        "" 1;
        "https://chisabot.example.com:2053" 1;
    }
    map $http_origin $magpie_auth_origin {
        default "";
        "https://chisabot.example.com:2053" "https://chisabot.example.com:8443";
    }

    server {
        listen 8443 ssl;
        server_name chisabot.example.com;

        ssl_certificate /etc/letsencrypt/live/chisabot.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chisabot.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OpenBotTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        if ($host != chisabot.example.com) { return 444; }
        if ($origin_allowed = 0) { return 403; }
        if ($fetch_allowed = 0) { return 403; }
        if ($socket_origin_allowed = 0) { return 403; }

        include /public/security-headers.conf;

        location = /login {
            alias /public/auth-web/login.html;
            default_type text/html;
            include /public/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        }
        location = /login/ { return 302 /login; }
        location = /sign { return 302 /login; }
        location = /auth/login.css { alias /public/auth-web/login.css; }
        location = /auth/login.js { alias /public/auth-web/login.js; }
        location = /auth/workspace.js { alias /public/auth-web/workspace.js; charset utf-8; }
        # 部署 / 重启时（后端连不上）的中文等待页，自动探活后回到原页面（DESIGN.md 成熟度一节）。
        location = /auth/updating.html { alias /public/auth-web/updating.html; default_type text/html; charset utf-8; include /public/security-headers.conf; }
        location = /auth/updating.css { alias /public/auth-web/updating.css; }
        location = /auth/updating.js { alias /public/auth-web/updating.js; charset utf-8; }
        # 品牌头像与 favicon（登录前也要能显示）：只读静态文件，不经过登录服务。
        location ^~ /auth/brand/ {
            alias /public/auth-web/brand/;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /_internal/ { return 404; }
        location = /_openbot/auth-check {
            internal;
            proxy_pass http://127.0.0.1:3002/_internal/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization "";
        }
        location @openbot_login_required {
            rewrite ^ /_internal/unauthorized break;
            proxy_pass http://127.0.0.1:3002;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header Accept $http_accept;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
        location ^~ /_openbot/ { return 404; }
        location ^~ /auth/ {
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-OpenBot-Client $remote_addr;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
        }
        # Preserve the app's existing account-menu logout action.
        location = /api/auth/sign-out {
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:3002/auth/logout;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization "";
            proxy_set_header X-OpenBot-Client $remote_addr;
        }

        # ChisaBot PC 客户端节点与手机扫码绑定：只用设备令牌（X-Device-Token）或一次性绑定码认证，不经网关会话。
        # 令牌校验与失败限速在后端 /api/devices/agent/*（docs/pc-node.md）。X-Forwarded-For 必须设置：
        # 后端据此拒绝公网请求访问只给本机网关用的 /api/devices/agent/state/*。
        location ^~ /api/devices/agent/ {
            client_max_body_size 1m;
            proxy_pass http://127.0.0.1:3001;
            # Local-Caller is host-scrape only (updater / smoke); never accept from public clients.
            proxy_set_header X-ChisaBot-Local-Caller "";
            proxy_set_header X-ChisaBot-Identity "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host "localhost:3001";
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # IM 接入：QQ 个人号协议端（NapCat 等 OneBot 11）的反向 WebSocket。不经网关会话，只认连接自己的
        # access token（Authorization: Bearer 或 ?access_token=），校验与失败限速在后端（docs/im.md）。
        location ^~ /api/im/onebot/ {
            client_max_body_size 4m;
            proxy_pass http://127.0.0.1:3001;
            # Local-Caller is host-scrape only (updater / smoke); never accept from public clients.
            proxy_set_header X-ChisaBot-Local-Caller "";
            proxy_set_header X-ChisaBot-Identity "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host "localhost:3001";
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 带哈希的 /assets/*：仍要登录，但浏览器长期缓存（private：只在浏览器里；CDN 不缓存）。
        # 以前所有资源都是 no-store，每次打开都要重新下载全部脚本（docs/online-update.md）。
        # /p/ 公开页面：机器人做的网页，不用登录（不经 auth_request）。后端给每个响应加
        # Content-Security-Policy: sandbox …（没有 allow-same-origin），页面读不到本站 Cookie、连不了接口。
        # 这里不转发 Cookie / Authorization；X-Frame-Options 用 SAMEORIGIN（应用里的缩略图要嵌它）。
        location ^~ /p/ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:3001;
            # Local-Caller is host-scrape only (updater / smoke); never accept from public clients.
            proxy_set_header X-ChisaBot-Local-Caller "";
            proxy_set_header X-ChisaBot-Identity "";
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3001";
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location ^~ /assets/ {
            auth_request /_openbot/auth-check;
            error_page 401 = @openbot_login_required;
            proxy_pass http://127.0.0.1:3001;
            # Local-Caller is host-scrape only (updater / smoke); never accept from public clients.
            proxy_set_header X-ChisaBot-Local-Caller "";
            # 多账号（CB-040）：登录服务签名的身份（X-ChisaBot-Identity）原样转给应用；客户端自带的同名头被这里覆盖。
            auth_request_set $cb_identity $upstream_http_x_chisabot_identity;
            proxy_set_header X-ChisaBot-Identity $cb_identity;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:3001";
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_hide_header X-Content-Type-Options;
            add_header Cache-Control $asset_cache_control always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location / {
            auth_request /_openbot/auth-check;
            error_page 401 = @openbot_login_required;
            error_page 502 503 504 /auth/updating.html;
            proxy_pass http://127.0.0.1:3001;
            # Local-Caller is host-scrape only (updater / smoke); never accept from public clients.
            proxy_set_header X-ChisaBot-Local-Caller "";
            # 多账号（CB-040）：登录服务签名的身份（X-ChisaBot-Identity）原样转给应用；客户端自带的同名头被这里覆盖。
            auth_request_set $cb_identity $upstream_http_x_chisabot_identity;
            proxy_set_header X-ChisaBot-Identity $cb_identity;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # The loopback backend remains single-user. The gateway owns its
            # authentication and external Origin checks, including WS upgrades.
            proxy_set_header Host "localhost:3001";
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "http";
            proxy_set_header X-Forwarded-For $remote_addr;

            # Install the session guard before the app's module scripts run.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/auth/workspace.js"></script>';

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 2053 ssl;
        server_name chisabot.example.com;

        ssl_certificate /etc/letsencrypt/live/chisabot.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chisabot.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OpenBotTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        if ($host != chisabot.example.com) { return 444; }
        if ($magpie_origin_allowed = 0) { return 403; }
        if ($fetch_allowed = 0) { return 403; }
        if ($socket_origin_allowed = 0) { return 403; }

        include /public/security-headers.conf;

        location = /login {
            alias /public/auth-web/magpie-login.html;
            default_type text/html;
            include /public/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
        }
        location = /login/ { return 302 /login; }
        location = /sign { return 302 /login; }
        location = /auth/login.css { alias /public/auth-web/login.css; }
        location = /auth/login.js { alias /public/auth-web/login.js; }
        location = /auth/workspace.js { alias /public/auth-web/workspace.js; }

        # Model traffic is restricted to the Docker network, even for a
        # signed-in browser. The public port serves management only.
        location = /v1 { return 404; }
        location ^~ /v1/ { return 404; }
        location = /v1beta { return 404; }
        location ^~ /v1beta/ { return 404; }
        location ^~ /_internal/ { return 404; }
        location = /_openbot/auth-check {
            internal;
            proxy_pass http://127.0.0.1:3002/_internal/check;
            # 多账号（CB-040）：Magpie 管理台只给管理员，朋友账号这里得到 403。
            proxy_set_header X-ChisaBot-Require-Role admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host "chisabot.example.com:8443";
            proxy_set_header Origin $magpie_auth_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization "";
        }
        location @magpie_login_required {
            rewrite ^ /_internal/unauthorized break;
            proxy_pass http://127.0.0.1:3002;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host "chisabot.example.com:8443";
            proxy_set_header Origin $magpie_auth_origin;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header Accept $http_accept;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
        location ^~ /_openbot/ { return 404; }
        location ^~ /auth/ {
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host "chisabot.example.com:8443";
            proxy_set_header Origin $magpie_auth_origin;
            proxy_set_header X-OpenBot-Client $remote_addr;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
        }
        location = /api/auth/sign-out {
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:3002/auth/logout;
            proxy_set_header Host "chisabot.example.com:8443";
            proxy_set_header Origin $magpie_auth_origin;
            proxy_set_header Authorization "";
            proxy_set_header X-OpenBot-Client $remote_addr;
        }

        location / {
            auth_request /_openbot/auth-check;
            error_page 401 = @magpie_login_required;
            proxy_pass http://127.0.0.1:3430;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host "localhost:3430";
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "https";
            proxy_set_header X-Forwarded-For $remote_addr;

            # This file contains only the upstream MAGPIE_WEB_KEY cookie.
            # Browser cookies and credentials never reach Magpie directly.
            include /public/magpie-private.conf;
            proxy_hide_header Set-Cookie;

            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/auth/workspace.js"></script>';

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
