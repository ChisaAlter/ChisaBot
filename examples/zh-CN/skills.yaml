  - slug: pstack-pb-investigation
    title: "PB·调查"
    summary: "调查类任务 playbook：只读，产出带引用的讲解或建议，不改代码。问题排查定位阶段也走这个。"
    instructions: |-
      # 调查（playbook）
      
      **你拥有答案。计划、路由、撰写。**
      
      调查是只读工作：产出一份带引用的讲解或一条建议，不产出代码改动。
      
      1. 机制问题走 **how** 技能；动机/历史问题同时走 **why** 技能。
      2. 吞吐检查点一行：`throughput checkpoint: n/a, read-only investigation`。
      3. 产出 **how** 形状的结果（Overview / Key Concepts / How It Works / Where Things Live / Gotchas）；如果问题是方案取舍，产出建议 + 取舍对照表。
      4. 回复过一遍 **unslop**。
      
      不出 PR，不派工，不跑 **architect**——除非这个调查是为后续改动做铺垫，是就把结论交给用户并说明下一步该路由到 Bug 修复或新功能。
      
      **回复**：调查产出。"我们确定吗"类问题要给真实判断加理由；前提是错的就指出（自主权条款，见 poteto-mode）。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: pstack-pb-bug-fix
    title: "PB·Bug 修复"
    summary: "Bug 修复 playbook：自己先复现，用运行时证据排除假设，修根因，在同一表面验证，失败复现先于修复入库。"
    instructions: |-
      # Bug 修复（playbook）
      
      **你拥有这个 bug。复现、定位、验证。** 实现可以自己做，也可以委托给另一个 BOT，但验证纪律不外包。
      
      1. **先复现。** 在真实表面上跑出 bug（云端工作区跑代码/测试，或照用户给的确切步骤）。复现不出来就先解决复现，不许直接猜改。
      2. **二分假设。** 列出候选根因，用运行时证据逐个排除：加日志、跑最小复现脚本、git bisect、`git log` 回归区间。每个被排除的假设写明排除它的证据。改的是根因不是症状（principle-fix-root-causes）；两个修复死在同一道闸就攻击前提本身（principle-attack-the-premise）。
      3. **计划。** 修复跨函数边界就先跑 **architect** 出形状，再动手。
      4. **实现。** 自己改或 message_bot 委托另一个 BOT，brief 写清：要改的文件、根因结论、成功标准（复现从红变绿）、不许动的范围。"也许有用"的防御性代码是未验证假设，不许顺手加。
      5. **同一表面验证。** 在第 1 步复现 bug 的同一表面、同一步骤上确认消失；再跑邻近路径防回归（principle-prove-it-works）。换表面验证不算数。
      6. **提交顺序。** 有测试设施就先入库一个会因该 bug 失败的回归测试/复现脚本（tdd 技能），再入库修复——git 历史要能看出"先红后绿"。
      
      **回复**：根因（含排除掉的假设及证据）、改动内容、复现前→修复后的证据对照。每条标 measured / inferred / guess。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: pstack-pb-feature
    title: "PB·新功能"
    summary: "新功能 playbook：先摸透子系统再设计，吞吐检查点定并行，实现可委托，按匹配表面验证，开 PR。"
    instructions: |-
      # 新功能（playbook）
      
      **你拥有设计。计划、评审、验证。** 实现可委托给别的 BOT，你保持主导。
      
      1. 跑 **how** 覆盖受影响的子系统。
      2. 跑 **architect** 做并行设计探索，产出草图 + 合成决策。
      3. 写吞吐检查点，四项各一行，不适用就标 `n/a: <原因>`：
         - **先做阻塞步骤**：有依赖关系的先跑。
         - **独立工作流**：不相交的文件/服务/层可并行，共享写串行。
         - **共享可变状态**：默认拆目标隔离写（principle-separate-before-serializing），只有真不变量才串行。
         - **最小安全拆分**：单执行者最优时说明理由。
      4. **实现。** 自己写或委托：brief 给确切范围——文件路径、具名数据形状与其组织方式（principle-model-the-domain：状态机优先于散落布尔、表/注册表优先于分支、类型化模型优先于重复的性状假设——在写逻辑前定）、成功标准。实现存在多种合法形状（错误处理、抽象层、测试结构）时，让多个 BOT 各出一版再择优嫁接，而不是直接收第一版——评审分离是目的，不许以"省事"跳过。注释纪律：代码要自解释，不写复述代码的注释。
      5. **匹配表面验证。** 功能在 UI 就开到 UI 上验，在 API 就打真请求验；"不确定"或用错表面不算通过（principle-prove-it-works）。
      6. **提交切分。** 按 principle-sequence-verifiable-units 切成小的有序提交，每个单元独立构建、验证、入库。
      7. 设计有争议就在交付前跑 **pstack-adversarial-review** 工作流对抗一遍。
      8. 开 PR / 评论 PR 走 `github_*` 工具；PR 正文按 technical-writing：一分钟能读完的简报，链接证据而不是糊表格。
      
      代码强耦合的活儿（一个功能一条迁移）归一个 owner，检查点内联在它的范围里；parent 级并行只留给产出独立制品的切片（审计、跨子系统调查、对比实验）。阶段边界重写检查点。
      
      **回复**：建了什么、选了什么及为什么、吞吐检查点、待决项。设计候选用对照表。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: unslop
    title: "反 AI 腔"
    summary: "Cut AI tells from any writing."
    instructions: |-
      # Unslop
      
      Edit text to remove AI patterns. Scan for the patterns below, then rewrite. Preserve meaning and match the intended tone.
      
      ## Patterns to detect and fix
      
      Rule numbers are stable ids that other skills cite. A removed rule leaves a gap.
      
      ### Content
      
      3. **Superficial -ing phrases.** "highlighting...", "ensuring...", "reflecting...", "showcasing...", "fostering...". Delete or expand with real sources.
      5. **Vague attributions.** "Experts believe", "Industry reports suggest", "Some critics argue". Name the source or delete.
      
      ### Language
      
      7. **AI vocabulary.** Additionally, crucial, delve, enduring, enhance, fostering, garner, interplay, intricate, landscape (abstract), pivotal, showcase, tapestry (abstract), testament, underscore, vibrant. Replace with plain words.
      8. **Fancy ways to say "is".** "serves as", "stands as", "boasts", "features". Say "is" or "has".
      9. **"Not just X, but Y."** State the point directly instead.
      10. **Rule of three.** Don't force ideas into groups of three. Use the natural number.
      11. **Synonym cycling.** Protagonist, main character, central figure, hero all in one paragraph. Pick one, repeat it.
      12. **False ranges.** "from X to Y" where X and Y aren't on a meaningful scale. List topics directly.
      
      ### Style
      
      13. **Em dash overuse.** Avoid em dashes entirely. Use periods or commas only (no parentheses, no en dashes, no hyphen-as-dash substitutes). If a thought needs separation, end the sentence or use a comma.
      14. **Colon overuse.** Colons are fine before a list or example, not as mid-sentence connectors. "If you're coming from traditional automation: instead of registering event handlers, you describe conditions" adds nothing with the colon. Rewrite to let the point stand on its own without comparison framing. "Describing when the scheduler should fire works best as plain English." Same meaning, no crutch punctuation.
      15. **Boldface overuse.** Don't bold every proper noun or acronym.
      16. **Inline-header lists.** The tell is a bold label and colon that restates the line: "**Performance:** Performance improved...". Convert those to prose. A bold lead-in that ends in a period, names the item, and is followed by genuinely new detail ("**Schema in TypeScript.** Tables live in one file.") is fine, not a tell.
      17. **Title case headings.** Use sentence case.
      18. **Decorative emojis.** Remove from headings and bullets.
      19. **Curly quotes.** Use straight quotes.
      
      ### Communication artifacts
      
      20. **Chatbot phrases.** "I hope this helps!", "Let me know if...", "Of course!", "Certainly!", "Found the smoking gun!" Remove.
      22. **Sycophantic tone.** "Great question! You're absolutely right!" Respond directly.
      
      ### Filler
      
      23. **Filler phrases.** "In order to" becomes "To". "Due to the fact that" becomes "Because". Delete "It is important to note that".
      24. **Excessive hedging.** "could potentially possibly be argued that it might" becomes "may".
      25. **Generic conclusions.** "The future looks bright." State specific plans or facts.
      
      ### Jargon
      
      26. **Abstract metaphor nouns.** Substrate (base), wedge, wedge in (add), vector (way, method), locus, vantage, nexus, primitive as a noun, harness as a metaphor, surface as in "API surface", bedrock, scaffolding as a metaphor, modality, paradigm, gold-plating (more than the job needs), ratchet as a metaphor (the mechanism's real name, or a limit that only tightens), evacuate for moving code (move out), endgame (the last phase), north star, flywheel. These read as technical but usually have a plainer concrete word. Pick the concrete word.
      
      ### Plain speech
      
      27. **Say what it does, not how it feels.** "the database stays close at hand", "SQL you can read", "types that follow your schema" name a feeling. The fix names the mechanism or a number: "`.toSQL()` returns the exact string sent to the database", "a column rename fails the build". Ask what the sentence tells the reader to do or know, then write that. If you can't restate it as a concrete instruction, fact, or number, cut it. One more check: if the sentence could appear unchanged in another project's docs, it says nothing about this one. Cut it.
      28. **Shorten or split dense sentences.** If the reader has to backtrack to parse a sentence, break it in two or drop clauses. One idea per sentence.
      29. **Active voice.** Prefer it. Catch "is/are/was/were + past participle" and name the actor: "queries are validated" becomes "the compiler validates queries", "the file is parsed by the loader" becomes "the loader parses the file". Passive is fine only when the actor is unknown or genuinely doesn't matter.
      30. **Cut adverbs, or use a stronger verb.** "runs quickly" becomes "is fast" or the number, and "significantly improves" becomes the measured delta. An adverb propping up a weak verb means the verb is wrong.
      31. **Prefer the plain word.** "utilize" and "leverage" become "use", "facilitate" becomes "help", "numerous" becomes "many", "in the event that" becomes "if". The fancier synonym is rarely clearer.
      32. **Mannered prose.** Metaphor or flourish where a literal phrase exists: aphorisms ("wire it or delete it"), rhetorical fragments for effect, personified code ("the plan holds it"), figurative verbs ("rides along", "stands on"), stock framing phrases. "A dial worth turning" becomes "a parameter worth varying". Say what you mean. Rule 26 covers the metaphor nouns.
      33. **Over-compression.** Dropped articles, verbless fragments, symbol-speak, and abbreviations that make the reader decode instead of read. "Parser rejects bad date → exit 2, no write" becomes "The parser rejects a bad date, exits with code 2, and writes nothing." Write whole sentences with their articles and verbs, and spell out arrows and abbreviations.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: technical-writing
    title: "技术写作规范"
    summary: "Layered technical-writing standard: Diátaxis structure, Google developer style sentences, STE instruction rules, Global English syntax. Use for /technical-writing or when writing or reviewing docs,..."
    instructions: |-
      # Technical writing
      
      Write so a tired engineer understands on the first read. Apply all four layers.
      
      Three rules sit above the layers:
      
      - **Cut every word that does no work.** If the sentence survives without a word, the word goes. "In order to" is "to". "It is important to note that" is nothing.
      - **Use the short, everyday word.** "Use", not "utilize". "Help", not "facilitate". "Do", not "perform". A long word has to buy its length with precision.
      - **When a rule makes a sentence worse, fix the sentence another way or leave it alone.** A sentence that follows every rule and sounds like a machine wrote it has failed.
      
      The codebase is the word list. Write the real symbol, file, flag, or command name, not a synonym or a description of it.
      
      Don't invent jargon. Use the words a developer would say out loud: "move", "delete", "a budget that only decreases", not "evacuate", "ratchet", or "endgame". A named pattern is fine when the doc says what it means the first time. Propose a new offender and its replacement as an addition to `unslop`'s abstract-metaphor rule in your reply, with the diff. Don't edit that skill.
      
      ## Vary the rhythm
      
      A doc can obey every layer and still read machine-written: every sentence clipped short, no view anywhere, nothing specific.
      
      - Mix sentence lengths on purpose. Short sentences land a point. Longer ones carry a fact with its condition or consequence.
      - One thought per sentence does not mean one length per sentence. Split the sentence that carries two thoughts. Keep the long sentence that carries one.
      - Have a view where the mode allows it. Explanation weighs trade-offs, so say what you make of them instead of listing pros and cons. Reference stays dry.
      - Be specific over sterile. Not "schema changes can cause issues" but "a column rename fails the build".
      
      ## Pick the mode first (Diátaxis)
      
      One document, one mode. Two questions pick it: does the content inform action (doing) or understanding (thinking), and does it serve learning or work?
      
      - Action + learning: **tutorial**.
      - Action + work: **how-to**.
      - Understanding + work: **reference**.
      - Understanding + learning: **explanation**.
      
      Use the compass on a whole document or on one sentence.
      
      **Tutorial: learning by doing.** The learner's success is your job, not theirs. Open by saying what the learner will build, not what they will "learn". Every step produces a visible result, early and often. Tell them what they should see: the expected output, the prompt change, the log line. Cut explanation to one clause and a link. Stay concrete. Write as "we", in commands: "First, do x. Now, do y."
      
      **How-to: steps to a goal.** Solve a problem a person has, not an operation the machine can perform. Assume competence and skip teaching. Action only: no digressions, no background, no completeness for its own sake. Link those instead. Allow forks and judgment: "If you want x, do y." Name the guide by the task: "How to calibrate the radar array", not "Radar array calibration".
      
      **Reference: facts for lookup.** Only describe. No instruction, no persuasion, no opinion. Be dry, complete, and sure. State facts, options, limits, and errors with no hedging. Mirror the structure of the thing described, so code and docs can be navigated together. Put material where readers expect it. Generate from code where possible.
      
      **Explanation: understanding and why.** One bounded topic, readable away from the product. Each title should tolerate an implicit "About..." in front. Anchor on a real why question. Give context: design decisions, history, constraints, alternatives. Opinion is allowed here and nowhere else.
      
      Don't mix modes: no reference tables inside a tutorial, no tutorial hand-holding inside reference, no arguing inside a how-to. Split and link instead.
      
      ## Write sentences to the reader (Google developer style)
      
      - Talk to the reader as "you", in the present tense. "Will" only for things that genuinely happen later.
      - Say who does what: "the compiler checks", not "is checked". Passive is fine only when the actor is unknown or beside the point.
      - Write instructions as commands: "Click Submit." State facts plainly. Never "should be done".
      - Put the condition before the instruction: "To delete the document, click Delete."
      - Put the common case first. Exceptions after.
      - Sound like a knowledgeable friend. No buzzwords, no figurative language, no "please" in instructions, and never "simply", "easy", or "quickly" in a procedure. If it were simple, the reader would not be here.
      - Don't pre-announce ("we will soon support...") and don't start consecutive sentences with the same phrase.
      - Link with words that say where the link goes: the page title or a short description. Never "click here". Prefer a sentence of context on the page over a link off it.
      - Headings carry the point, not just the topic ("Pick the mode first", not "Modes"). Sentence case. A task heading is a bare verb phrase ("Create an instance"). A concept heading is a noun phrase. One h1 per page, no skipped levels.
      - Numbered lists for sequences, bullets for everything else. Introduce a list with a complete sentence. Keep items parallel.
      - Code goes in code font. UI elements go in bold. Use serial commas. Drop "etc." and say up front that a list is partial.
      
      ## Make statements load one at a time (STE rules)
      
      - One instruction per sentence. One thought per sentence everywhere else.
      - Split instructions longer than about 20 words and other sentences longer than about 25.
      - Put the warning or condition before the step it guards: "If hot oil touches your skin, injuries can occur."
      - Keep "the" and "a": "Remove backup file" reads two ways. "Remove the backup file" reads one.
      - Give each word one meaning and one job, then keep it. If "check" means inspect, don't also use it for restrain.
      - Pick one word per action and stick to it: "start", not "start" here and "initiate" there.
      - Write procedures as direct commands, never as narration and never in the passive: "Install the component", not "the component must be installed".
      - Avoid "-ing" words where you can.
      
      ## Leave no sentence open to two readings (Global English)
      
      - Keep words like "only" and "not" next to the word they change: "only fails on growth" and "fails only on growth" say different things.
      - Break up long noun strings: "the proto import budget check script" becomes "the script that checks the proto-import budget".
      - Make every "it", "they", and "this" point at one obvious thing. Repeat the noun when in doubt. Never use "this" or "which" to point at a whole clause.
      - Don't drop verbs: "Phase 1 moves the converters and Phase 2 the runtime" leaves Phase 2 without one. Give it one.
      - Keep the small words that show structure, such as "that" in "Ensure that the switch is off". Never trade clarity for word count.
      - Repeat the article in a series when it prevents a misread: "the client and the host", not "the client and host", when they are two things.
      - Say which parts "and" or "or" joins when a sentence can group two ways. "Both...and", "either...or", and "if...then" are free disambiguators.
      - Use periods, not semicolons. Replace an em dash with a new sentence.
      - Make text in parentheses a full grammatical unit or its own sentence. Never form plurals with "(s)".
      - No slashes: write "a, b, or both" instead of "a/b" or "and/or".
      - Call each thing by one name, everywhere. A doc that says "the gate", "the ratchet", and "the budget check" for one thing teaches three things. Don't churn what didn't change.
      - Skip idioms, colloquialisms, Latin abbreviations, and metaphors.
      
      ## Voice and repo specifics
      
      - Apply the **unslop** skill to every doc this skill touches. That skill owns the slop-pattern catalog: AI vocabulary, filler, hedging, formatting tells.
      - PR descriptions and commit messages are writing too. Every layer except Diátaxis applies to them. A PR body is a briefing that a reviewer can read in under a minute. Do not paste swarm logs, SHA lists, or metric tables. Link them.
      - Product UI strings are not documentation. Use your product's copy guidelines for those.
      - Indent code snippets with tabs. Write real paths. Make every count or tree claim true at the commit that lands it, and include the command that regenerates it.
      
      ## Worked example
      
      Before:
      
      > Configuration of the proto import ratchet budget script parameters is performed via budget.json. Note that it's important to remember that running with --write, which updates the committed budget to reflect the current count, should only be done when lowering it. If exceeded, CI fails.
      
      After:
      
      > `budget.mjs` reads the committed budget from `budget.json` and counts the files that import protos. If the count exceeds the budget, CI fails. Run `budget.mjs --write` only to lower the budget.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: tdd
    title: "TDD 修复"
    summary: "Use only when the user explicitly asks for TDD, a failing test, or a regression test, OR when the bug has an obvious cheap local test target. Skip when the test path is unclear, expensive, integrat..."
    instructions: |-
      # TDD Bug Fix
      
      When fixing a bug with a clear, cheap test path, make the broken behavior executable before changing production code. The goal is a focused regression test that fails before the fix and passes after it.
      
      Do not force a test when it would be impractical. If the available test would require broad harness setup, brittle mocks, slow end-to-end infrastructure, production-only state, vague reproduction steps, or large unrelated fixture churn, skip adding a new test and use the closest useful verification instead.
      
      ## Workflow
      
      1. **Understand the bug.** Identify the intended behavior, current behavior, affected path, and smallest observable reproduction.
      2. **Choose the narrowest executable check.** Prefer the closest unit, component, integration, or regression test already used for that codepath. If no practical test path is obvious, do not create one from scratch just to satisfy the workflow.
      3. **Write the failing test first.** Add the smallest focused test that would have caught the bug. The test should encode intended behavior, not mirror the current implementation.
      4. **Run the new test before fixing.** Confirm it fails for the intended reason. If it passes or fails for an unrelated reason, correct the test or reproduction before editing the implementation.
      5. **Fix the bug.** Make the smallest production change that satisfies the intended behavior while preserving nearby contracts.
      6. **Rerun the regression test.** Confirm the test now passes.
      
      ## If a Failing Test Is Impractical
      
      Use the closest executable regression check instead: a targeted script, manual reproduction command, browser automation, snapshot comparison, log assertion, or focused integration check.
      
      Prefer no new test over a bad test. A bad test is one that mostly tests mocks, encodes current implementation details, depends on timing or unrelated global state, needs expensive infrastructure for a small fix, or would be deleted immediately after proving the fix.
      
      ## Guardrails
      
      - Do not change tests merely to match a wrong implementation.
      - Do not weaken existing assertions unless the expected behavior has genuinely changed and the reason is clear.
      - Keep the regression test focused on the bug. Avoid broad fixture churn or unrelated coverage expansion.
      - If the bug is flaky, make the test deterministic where possible and document the signal being locked down.
      - If the bug exposes a broader class of failures, first land the focused regression path, then consider additional sibling coverage.
      
      ## Final Response
      
      Report the evidence, not just the outcome:
      
      - Name the failing-before test or executable check and the failure it produced.
      - Name the passing-after test run and any nearby validation performed.
      - If failing-before evidence could not be demonstrated, state why and describe the closest regression check used instead.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: benchmark-checklist
    title: "基准测量清单"
    summary: "Vet a perf measurement (limiter, tuning, limits, errors, repeatability, relevance, and whether the work happened) before you report or act on it. Use when you run a benchmark or report a speedup or..."
    instructions: |-
      # Benchmark checklist
      
      Use this when you produce a performance number: a PR's before and after, a regression claim, a hillclimb harness, or a library or config choice. Answer each question with evidence from a run, not a guess about the code.
      
      For a quick ballpark the user asked for, one run is enough. Still check questions 4 and 7, and say that it is one run. Skip the rest unless that run looks wrong. A choice between options is never a ballpark.
      
      ## Before you run anything
      
      - Write down the claim you expect to make, in the words you would ship ("export is 30% faster at p50 on the 60k-row dataset"). The questions test that sentence.
      - Read the measurement script. Note what it times, counts, and ignores.
      - Check the load average with `uptime` and the core count with `nproc`. If the machine is busy, find out what is running. If you cannot stop it, interleave the sides so both see the same noise, and say so in the report.
      
      ## The questions
      
      1. **Why not double?** Name the limiter. Profile in a run you do not report, because profilers and tracers slow the work down. Use CPU per process (`top`, `pidstat`), a runtime profiler (`node --cpu-prof`, `py-spy`, `perf`), I/O wait, and syscall counts (`strace -c` on Linux), then map the hot spot to source. Watch the load generator too: if it saturates first, you measured the load generator. If a change did not move the number, the limiter explains why, so find it before you call the change useless.
      2. **Was it tuned?** Run every side the way production runs it: release builds, production flags and env, batching and transaction settings, connection pools, caches as warm or cold as production sees them, and the same versions and data. If one side runs on defaults, you compared configurations, not implementations. A limiter that is a setting (a commit per row, a debug build, a missing index) means that side is untuned. Tune it and measure again before you pick a winner. If you cannot tune it, do not pick a winner from that run. When the user is choosing what to adopt, narrowing the claim to the code as it ships today does not fix this, because they adopt the option, not today's settings.
      3. **Did it break limits?** Do the arithmetic. Compare bytes per second with disk and network bandwidth, operations per second times cost per operation with your cores, and the time saved with the time the changed piece took. Removing a piece that takes 10% of the run can make the run at most about 11% faster. A result past a limit measured something other than the work, such as a cache, a no-op, or a bug.
      4. **Did it error?** Count failures and non-success responses, and check that outputs are correct, not just present. Rejections are often fast, and timeouts and retries are slow. If the script does not count errors, add the count.
      5. **Does it reproduce?** Run each side at least 5 times, alternating (A, B, A, B, and so on) so warmup, lazy initialization, caches, and drift favor neither. Report the median and range. A gap smaller than the run-to-run variation is no measurable difference. When the call is close, use a rank-sum test or the harness's own statistics.
      6. **Does it matter?** Next to any micro result, measure the end-to-end path a user waits on, with realistic data sizes and concurrency, and report the micro result as a share of the whole. A helper that takes 1% of a request can make the request at most 1% faster, however fast the helper gets.
      7. **Did it even happen?** Confirm the work ran inside the timed region: the request reached the server, the rows were written, the bytes were read, and the code used the result. Lazy code (generators nobody iterates, promises nobody awaits, results the JIT can discard) and timeouts produce numbers for work that never happened.
      
      ## Report
      
      - Lead with the verdict: faster, slower, no measurable difference, or inconclusive.
      - Give the number with its unit, the run count, the range, and the limiter. For example, "p50 41 ms → 33 ms, median of 7 runs per side, range 32 to 35 ms after, bound by JSON parsing on one core."
      - Call the verdict inconclusive when you claim a difference but cannot name the limiter, when a side ran untuned, or when you could not check questions 4 and 7. Name the gap.
      - Keep a PR body to one primary number, per the **Opening a PR** playbook. Put the runs, range, and limiter evidence in a linked artifact or notes file.
      
      ## Other perf material
      
      - Vet the **Perf issue** playbook's baseline before the playbook plans from it, and every number after that.
      - Vet the **Hillclimb** playbook's harness before it is frozen. The frozen harness then prints error and work counts, so each keep-or-revert checks questions 4 and 7 for free.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: typescript-best-practices
    title: "TypeScript 最佳实践"
    summary: "TypeScript best practices. Use when reading or editing any .ts or .tsx file."
    instructions: |-
      # TypeScript best practices
      
      Apply the **type-system-discipline** principle skill first.
      
      | Rule | Summary |
      |------|---------|
      | Discriminated unions | Model variants with a `kind` literal discriminant so impossible states can't be represented. No optional-field bags. |
      | Branded types | Brand primitives with `& { readonly __brand: "X" }` so they can't be mixed up. Validate once at the boundary. A brand comes from a verifying type guard (`input is AgentId`), never from `as`. |
      | Constructive modeling | Build the shape so the illegal value can't be constructed. `[T, ...T[]]` for non-empty, `[T, T][]` for even length, `start` plus `duration` for a range. Not a runtime guard, not a wish for refinement types. |
      | Simplest total type | Keep `T[]` while every operation on it stays total. Strengthen to `NonEmpty<T>` only where the loose type forces `!`, a cast, or a "should never happen" throw. |
      | `unknown` over `any` | External data is `unknown`. |
      | Schemas before guards | Before hand-writing a property-by-property type guard, use the repository's runtime schema library and infer the type from the schema, such as `z.infer`. |
      | No `as` casts | Every `as` is a runtime crash waiting. Cast only after validation. |
      | Narrowing hierarchy | Discriminant switch > `in` operator > `typeof`/`instanceof` > user-defined type guard > `as`. |
      | Type guards | Must verify the claim. A lying guard is worse than `as` because the bug hides behind a name that says it's safe. Name them `isX` or `hasX`. |
      | Exhaustiveness | Inline `const _exhaustive: never = x;` in default arms so the compiler errors when a new variant is added. |
      | `satisfies` over `as` | Validates the value without widening literal types. |
      | Boundary validation | Parse where data crosses in, into a named domain type. `Record<string, unknown>` (however spelled) stops at that parse. Trust types inside. See the **boundary-discipline** principle skill. |
      | Schema-derived types | Reach for `Pick`/`Omit`/`Parameters`/`ReturnType`/`Awaited`/`typeof` before declaring a new interface. |
      | Object args | Pass objects, not positional, so argument order is self-documenting. Skip on hot paths (per-frame render, tokenizers, parsers). |
      | Real tests | Don't mock what you can run. Prefer the framework's real test primitives with leak/disposable checks, and verify UI in a running build. Mock only what you can't run locally. |
      | Structured telemetry | Prefer structured logger diagnostics with enough context to debug from an id. No `console.log` in shipped code. |
      
      Examples: 内附示例.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: blast-radius
    title: "爆炸半径"
    summary: "Find what a change could break somewhere else before it ships, beyond the diff, and prove the one fact it's safe because of by running real code instead of writing it up. Use for 'blast radius of X..."
    instructions: |-
      # Blast radius
      
      Find what a change breaks somewhere else, before it ships. Use for "blast radius of X", "what could this break", or reviewing a small diff you don't trust yet.
      
      Companion to `how` and `why`. `how` tells you what the code does. `why` tells you why it's shaped that way. Blast radius tells you what it breaks somewhere else.
      
      Listing the callers is not the job. The agent can grep those in a second. The job is the breakage grep won't show you.
      
      ## Don't trust your own writeup
      
      A blast-radius writeup that sounds right is worthless. It reads as convincing whether or not it's true. So don't hand back the writeup. Find the one or two facts the whole thing depends on and prove them by running code.
      
      ### How sure are you
      
      For each fact the change's safety depends on, get it as far down this list as is cheap, and say where it stopped.
      
      1. You said so. Worthless on its own.
      2. You pointed at the line. A real `file:line`, or the library's own source.
      3. You showed the bad case can't happen. You walked the failure step by step and it doesn't reach.
      4. You ran it. A script or test that calls the real code and fails loud if you're wrong.
      5. You reproduced it in the running app.
      
      Step 4 is usually one small script that imports the same library the app ships and calls the exact function you're worried about.
      
      ## Steps
      
      1. Read the change. The diff, the symbols it adds, changes, and deletes, and what it now does differently, including the part the diff doesn't spell out. Use `why` step 2 to pull the PR and commits.
      2. Find the one fact it's safe because of. Most changes that look risky are safe because of a single fact, like "this call only drops already-dead cache entries and does nothing else". Find that fact. If it holds, most risky cases are cleared at once. Spend your time here, not on a long list of maybes.
      3. Look where grep stops. Read the source of the library you call, and check its pinned version and any local patch. Work out when things run: microtasks, unmount and teardown, Solid versus React. Follow what a symbol search misses: the JSON an API returns, a DB column, a wire format, another language reading the same bytes, a feature flag, code three hops downstream.
      4. Be honest about each risk. Give it a real chance of happening and a real cost if it does. Keep the risks you confirmed. List the ones you checked and cleared separately. Same rules as `why`. Cite a real `file:line`, a search that finds nothing is still an answer, and never make up a caller or an API.
      5. Prove the one fact. Write a script or test that runs the real code, run it, and paste what happened.
      6. For a big or wide change, run it as an `arena`. Ask more than one model the same question and merge the answers. Different models catch different real bugs.
      
      ## What to hand back
      
      - **What it does.** What changed, including the part that isn't obvious.
      - **The one fact it's safe because of.** State it, say which step you got it to, and show the proof. If you couldn't prove it, write unproven.
      - **Risks.** Each names how it breaks, the `file:line`, how likely and how bad, and how to check. Paste the proof for the ones that matter.
      - **Cleared.** What you checked and why it's fine.
      - **Before you merge.** The cheapest test or repro that catches the real bug, including the script you wrote.
      
      Write it through `unslop`, cite real code, and strip anything private before it goes anywhere public.
      
      **Reply:** the writeup above, with the one safety fact either proven or marked unproven.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: correct
    title: "纠错改仓"
    summary: "Find the mistakes agents keep repeating in this repo and make each one impossible. Try architecture first, then types, then a lint whose error names the fix, then a test, and write docs last. Prove..."
    instructions: |-
      # Correct
      
      The operator keeps correcting agents in this repo for the same mistakes. Change the repo so the next agent can't make them.
      
      Assume every contributor is an agent that sees only the files it opened, copies the nearest example, and takes the shortest path that compiles. Design the repo so a change that looks right from one file is right for the whole repo.
      
      ## Find the mistake classes
      
      First, read recent commits, reverts, review comments, agent instruction files, and comments that explain workarounds. Group the mistakes into classes. A class counts once it has happened twice.
      
      ## Fix each class at the highest level that works
      
      1. **Eliminate it with architecture.** Give each piece of state one owner and each task one supported way. Hide internals so the wrong import fails. Replace hand-synced lists with one source of truth. Delete old ways and dead code an agent would copy.
      2. **Enforce it with types so the bad state can't be written.** If bad code still compiles, add a lint or CI check whose error names the file, type, or function to use instead. If the pattern is already common, fail only when a change adds more.
      3. **Test the behavior.** Fix or delete any test that still passes when the behavior it checks breaks, or that fails when only the internals change.
      4. **Write docs or agent rules last, only for judgment calls.** Nothing fails when an agent skips them.
      
      ## Fix and prove
      
      Then fix the most frequent classes now, one commit each. Prove each new check fails on a real past mistake. Run the same command locally and in CI. Exceptions go on the offending line with a reason, an expiry date, and a human's approval.
      
      ## Keep the rule table
      
      Last, keep a table in the agent instruction file that pairs each rule with what enforces it. When the operator corrects you, fix the mistake and add the rule. If the rule was already there and nothing enforces it, that's a repeat, so fix it at the highest level in the same change. Drop a rule once its mistake can't happen.
      
      **Reply:** each class with its evidence, the level you picked, and why a higher level didn't work.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
