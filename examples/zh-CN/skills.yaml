  - slug: principle-experience-first
    title: "体验优先"
    summary: "Apply when product, UX, or feature-scope tradeoffs come up. Choose user delight over implementation convenience; ship fewer polished features over more rough ones."
    instructions: |-
      # Experience First
      
      When implementation convenience conflicts with user delight, choose delight.
      
      - Every feature, control, and option must be justified
      - Ship less, ship better (polished experience with three features beats rough one with ten)
      - Prototype before committing (design decisions are cheaper in throwaway HTML than production code)
      - Get the details right (transitions, alignment, spacing, feedback, error states)
      - Tighten the core loop (every feature should serve the central workflow or get out of the way)
      
      The user is whoever consumes the work. For a UI that is the end user. For a library or an internal API it is the colleague who imports it. The engineer who maintains the code next is a user too. Weigh their experience the same way, and explain impact from their perspective.
      
      Foundations should serve the experience. Foundational thinking governs the *sequence* of work. This principle governs the *target*.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-explain-the-number
    title: "解释数字"
    summary: "Apply before you measure, and before you trust, report, or act on a number you measured: a speedup, a regression, a throughput, a latency, or an eval result. Find what limits it, and rule out that ..."
    instructions: |-
      # Explain the Number
      
      - **Write the decision before you run.** Name the result that would change a decision, and the noise floor. Stop when the run-to-run spread is larger than the effect.
      - **Ask "why not double?"** Name the resource or code path that bounds the result, such as a core, a lock, the disk, the network, or the load generator itself. Get it from a profile or from system counters taken during a run, then map it to source. A guess from reading the code is not a limiter. If you cannot say why the number is not twice as good, you do not know what you measured.
      - **List what else the number could be measuring, and rule out each one with evidence.** The usual suspects are errors, skipped or cached work, code that never ran, an untuned side (one left on default settings), noise, and a piece too small to matter end to end.
      - **Keep the evidence with the number.** Put the run count, the spread, and the limiter in the notes or a linked artifact.
      
      For a performance number, run the full procedure with the benchmark-checklist（/benchmark-checklist） skill. For an eval result, ask the same of the trials: did every run do the task, does the gap hold across trials and models, and does the scenario matter.
      
      You skipped this when a run started without the result that would change a decision, when the evidence behind a number has no run count, no spread, or no named limiter, or when the time saved is larger than the time the changed piece took.
      
      Distinct from Prove It Works（/principle-prove-it-works）, which checks that an output is real.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-fix-root-causes
    title: "修复根因"
    summary: "Apply when debugging. Trace each symptom back to the first place the system went wrong and fix it there. A guard is a fix only when the state it handles is legitimate."
    instructions: |-
      # Fix Root Causes
      
      When debugging, fix the fault, not the place where it surfaced. The symptom is where a wrong state became visible. The root cause is the first place the system did something it should not do, or failed to handle a state it should handle.
      
      **Why:** A symptom fix hides the evidence and leaves the fault free to surface somewhere else. Each one makes the system harder to reason about, because the code now carries a workaround for a bug that nobody named.
      
      **Pattern:**
      - Reproduce first.
      - Ask "why" at each step until the answer is a wrong decision in the code, not a consequence of an earlier one.
      - When stuck, instrument. Read the actual error and the actual state. Do not guess.
      - Ask whether the state that triggered the symptom is legitimate. If the system may be in that state, the code that broke on it is the root cause, and handling the state there is the fix. If the state should never exist, a check where it broke hides the bug. Find what produced the state. Guards, retries, swallowed errors, clamped values, and discarded state are the usual ways to hide a bug.
      - When something fails only after a restart, suspect persisted state first: config files, caches, lock files, serialized state.
      - Check for the pattern, not just the instance. Find every place with the same fault and fix them all.
      - If a workaround needs a paragraph-long comment to justify it, the code is wrong. Fix the code, not the comment.
      - If the deciding fact took a deep dig to find, propose the cheap, always-on signal that would have shown it at first look.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-foundational-thinking
    title: "地基思维"
    summary: "Apply before writing logic: choosing core types and data structures, sequencing scaffold-vs-feature work, asking what concurrent actors share. Get the data structures right so downstream code becom..."
    instructions: |-
      # Foundational Thinking
      
      **Structural decisions** protect option value. **Code-level decisions** protect simplicity.
      
      **Data structures first.** Get the data shape right before writing logic. Define core types early, trace every access pattern, and choose structures that match the dominant paths.
      
      At code level, DRY the structure, not every line. Types and data models should converge. Three similar statements still beat a premature abstraction. Prefer explicit over clever. Test behavior and edge cases, not line counts.
      
      **Concurrency corollary.** Before sharing state between actors, ask "what happens if another actor modifies this concurrently?" If not "nothing", isolate.
      
      **Scaffold first.** If something helps every later phase, do it first. Ask "does every subsequent phase benefit from this existing?" CI, linting, test infrastructure, and shared types are scaffold. Sequence for option value: setup before features, tests before fixes. Keep commits small and single-purpose.
      
      Each increment should land a coherent abstraction or deepen one that exists. Do not spread a new capability across callers as special-case coordination.
      
      Subtraction comes before scaffolding. Remove dead code first, then lay foundations.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-guard-the-context-window
    title: "守护上下文窗口"
    summary: "Apply when context is filling up: large outputs, long files, repeated reads, fan-out planning. Route bulk to subagents; keep summaries in the main thread, not raw payloads."
    instructions: |-
      # Guard the Context Window
      
      **Why:** Context overflow degrades reasoning quality, creates compression artifacts, and halts progress.
      
      **Pattern:**
      - **Size phases and cap scope.** Limit files per phase, set turn budgets, account for mechanism costs.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-laziness-protocol
    title: "懒惰协议"
    summary: "Apply when refactoring, evaluating diff size, or tempted to add abstractions, layers, or signal threading. Bias toward deletion and the smallest change that solves the problem."
    instructions: |-
      # Laziness Protocol
      
      - **Consolidate decisions.** Do not repeat the same choice in several places. Put it behind one source of truth and pass the result as a simple flag.
      - **Minimize the diff.** Make the smallest change that solves the problem. Fewer lines beat "elegant" boilerplate.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-make-operations-idempotent
    title: "幂等操作"
    summary: "Apply when designing commands, lifecycle steps, or processing loops that run amid crashes, restarts, and retries. Converge to the same end state regardless of partial prior runs."
    instructions: |-
      # Make Operations Idempotent
      
      Design operations so they converge to the correct state regardless of how many times they run or where the previous run stopped. Every state-mutating operation should answer: "What happens if this runs twice? What happens if the previous run crashed halfway?"
      
      **Why:** Commands, lifecycle operations, and processing loops run where crashes, restarts, and retries are normal. If partial state changes the next run's outcome, every restart becomes a debugging session.
      
      **The idea:** derive each step from the state that exists, not from what the previous run meant to do. Read the current state, compare it to the goal, and apply only the difference. A step written this way is safe to repeat, because a repeat finds nothing left to do.
      
      Anything a run leaves behind, such as a lock, a temporary file, a half-written record, or a claimed job, must be recognizable as stale by the next run. Judge staleness by evidence that stays true wherever the previous run could have stopped, not only in the common case. A marker that the next run cannot judge turns every crash into manual cleanup. For example, write to a temporary path and rename it into place, or compare artifacts by content instead of by creation order.
      
      **The test:**
      1. What happens if this runs twice in a row?
      2. What happens if the previous run crashed at every possible point?
      3. Does re-execution converge to the same end state?
      
      If any answer is "it depends on what state was left behind," the operation needs a reconciliation step.
      
      ---
      来源：Cursor 官方插件 pstack（MIT License），移植版见 docs/pstack-port.md。
  - slug: principle-migrate-then-delete
    title: "先迁移调用方再删旧 API"
    summary: "Apply when introducing a new internal API while old callers still exist. Migrate callers and delete the old API in the same wave instead of preserving compatibility layers."
    instructions: |-
      # Migrate Callers Then Delete Legacy APIs
      
      - Update tests to assert the new contract, and delete tests that only protect pre-refactor implementation details
      
      **When this applies:**
      - No external users depend on backward compatibility
      - The project can absorb coordinated breaking changes
      - The new API is part of a simplification or refactor initiative
      
      ---
