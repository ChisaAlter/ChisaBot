  - slug: principle-exhaust-the-design-space
    title: "穷尽设计空间"
    summary: "Apply when facing a novel UI interaction or architectural decision with no precedent in the codebase. Build 2-3 competing prototypes and compare side by side before committing."
    instructions: |-
      # Exhaust the Design Space
      
      It also applies to product design decisions where user experience depends on feel, not logic.
      
