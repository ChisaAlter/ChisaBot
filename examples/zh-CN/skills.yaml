# 部署共享技能（所有人的机器人都能按需加载，也能在聊天框里 /名字 调用）。只留两个与具体连接器无关的。
skills:
  - slug: research-public-web
    title: 公开信息研究
    summary: 上网查公开资料，整理成带来源链接的简报。
    instructions: >-
      先用 web_search 找到几个靠谱的来源，再用 web_fetch 读原文，不要只看搜索摘要就下结论。
      搜索词具体、简短；同一个问题换两三种说法搜。回答时：先给结论，再分点列出依据，每条依据后面附来源链接；
      来源之间说法不一致时写明分歧；查不到或网站打不开时如实说明，不要用自己的记忆冒充来源。
      只把必要的问题和关键词发出去，不要把整段对话或用户的私人资料贴进搜索。
  - slug: check-a-claim
    title: 核实说法
    summary: 对照原始资料，判断某个说法有没有依据。
    instructions: >-
      你在核实一个说法，不是回答一个问题。先找到能判定它的原始来源（官方页面、原始文件、当事方公告），读原文，
      然后只给三种结论之一：来源支持这个说法 / 来源与它矛盾 / 来源没有提到。引用你依据的那一句原文并附链接。
      来源里没写的部分不要用自己的知识补；「来源没有提到」本身就是完整的答案。

# >>> pstack-port — generated by scripts/pstack-port.mjs，请勿手改
  - slug: poteto-mode
    title: "工程模式（pstack 主入口）"
    summary: "工程模式总入口：把任务路由到对应 playbook，按需加载原则，强制实证交付。任何非琐碎的代码改动、调查、性能或设计工作都从这里进。"
    instructions: |-
      # Poteto Mode
      
      改写自 Cursor pstack 的主路由技能，适配 ChisaBot。适用面：写代码、改代码、查代码、评设计的任务。闲聊、纯问答、写作类任务不用它。
      
      ## 第一条回复
      
      先用自己的话复述用户的目标、问题和最小预期改动（in-your-own-words 技能的方式）。意图不明就问，不问清楚不动手。
      
      ## 任务路由
      
      把任务匹配到一个 playbook，匹配不到就按「调查」处理：
      
      | 任务 | playbook |
      |---|---|
      | 解释原理、查证、给建议（不改代码） | **pstack-pb-investigation** |
      | 修 bug | **pstack-pb-bug-fix** |
      | 新功能、结构性新代码 | **pstack-pb-feature** |
      
      以下上游 playbook 暂未移植；遇到对应任务时把其精神内联执行：
      - 重构（只改结构不改行为）：先固定行为契约（写特征测试或快照），再小步迁移，每步保持契约绿。
      - 性能问题：先测基线、找瓶颈（benchmark-checklist 技能审每个数字），改完测后值，只报实测差值。
      - 原型/一次性草稿：明确说明是抛弃式代码，不进主分支。
      
      ## Playbook 执行协议
      
      1. 把 playbook 的步骤逐条抄进待办清单，逐条执行。
      2. 跳过的步骤留在清单里，标 `skip: <原因>`，不许静默省略。
      3. 多步任务必须有吞吐检查点：四个维度各一行——先做阻塞步骤、独立工作流可并行、共享可变状态先分离再串行、最小安全拆分。某维确实不适用就写 `n/a: <原因>`，不删行。
      4. 每条结论带证据标签：`measured`（实测过）/`inferred`（从代码或证据推断）/`guess`（猜测）。报告里不许混。
      
      ## 原则索引
      
      用到哪条就 skill_load 对应技能全文，并在回复里点名引用了哪条、它改变了什么决定：
      
      - **/principle-laziness-protocol**：想加抽象层、扩散 diff 时——偏向删除和最小改动。
      - **/principle-foundational-thinking**：写逻辑前——先定核心类型和数据结构。
      - **/principle-redesign-from-first-principles**：设计处处别扭时——按今天的约束重画，不打补丁。
      - **/principle-attack-the-premise**：同一前提的两个修复都失败时——写下前提并直接检验它。
      - **/principle-subtract-before-you-add**：加新结构前——先删死代码和单调用方包装。
      - **/principle-minimize-reader-load**：代码难追时——压层数、缩状态范围。
      - **/principle-outcome-oriented-execution**：范围蔓延或返工时——回到"用户要什么结果"。
      - **/principle-experience-first**：实现方便 vs 用户体验冲突时——选体验。
      - **/principle-exhaust-the-design-space**：无先例的交互或架构决策——先做 2-3 个原型再定。
      - **/principle-build-the-lever**：非琐碎的重复工作——写脚本/codemod/生成器，产物可重跑。
      - **/principle-model-the-domain**：代码里散落布尔、分支、隐式约定时——给领域一个具名模型。
      - **/principle-boundary-discipline**：接校验、错误处理、框架适配时——边界防御，内部信任类型。
      - **/principle-type-system-discipline**：写类型时——让非法状态不可表示。
      - **/principle-make-operations-idempotent**：会中断重跑的操作——收敛到同一终态。
      - **/principle-migrate-then-delete**：换内部 API 时——迁移全部调用方并同波删旧 API。
      - **/principle-separate-before-serializing**：多个执行者要写共享状态时——先隔离各自的，再合并。
      - **/principle-prove-it-works**：宣布完成前——对真实产物验证，不接受"编译过了"。
      - **/principle-fix-root-causes**：调试时——在系统最早出错的位置修，不在症状处补。
      - **/principle-sequence-verifiable-units**：拆工作时——每个单元可独立验证、独立提交。
      - **/principle-test-behavior**：写测试时——测行为和边界，不测实现细节。
      - **/principle-explain-the-number**：报任何测量数字前——说出限流项，排除测量对象错误。
      - **/principle-guard-the-context-window**：上下文要爆时——批量活交给别的 BOT 或工作流，主线只留摘要。
      - **/principle-never-block-on-the-human**：可逆的决定——自己做并记录，不停车等人。
      - **/principle-encode-lessons-in-structure**：同一条指令写第二遍——固化成 lint/检查/脚本。
      
      ## 非协商项
      
      - 非琐碎改动或架构决策：先跑 **how** 摸清子系统；改归属/分层时同时跑 **why** 把历史原因变成约束。
      - 跨函数边界的设计：跑 **architect** 出至少两个结构不同的候选，再合成。
      - 多模型对抗评审（合并前重要 diff、设计稿）：跑 **pstack-adversarial-review** 工作流；不同攻方绑不同模型的 BOT，只有实证成立的发现保留。
      - 并行覆盖（多文件审计、多方案竞速）：交给别的 BOT 并行做（message_bot），或写成一个工作流让角色绑不同模型跑 `group` 并行。每个委托给完整独立 brief：目标、范围、如何验证、报告什么。
      - 报告与文档写作：过一遍 **unslop**；正式文档按 **technical-writing**。
      - 性能数字：每个数都过 **benchmark-checklist**。
      - 验证：对真实产物验证——跑功能、读真实值、看真实 diff。"应该没问题"、编译通过、代理指标都不算数。
      - PR 类操作走 `github_*` 工具（查 PR、评论、创建）。本地仓库操作走 computer 的云端工作区（clone 后在里面跑 git/测试/复现脚本）。
      
      ## 委托语义（替代上游 Task 子代理）
      
      - 要并行或分工：用 message_bot 把完整 brief 交给另一个 BOT；要正式编排（多模型、预算、审批）就写/跑工作流。
      - 追加修复、追加任务一律开新会话/BOT + 合并后的完整范围，不续聊（续聊会静默丢指令）。只有状态迁移成本太高（本地未提交改动、跑着的 dev server）才续。
      - 委托的验证要分离：写代码的不当评审，评审的拿到的是 diff 和 brief，不是作者的总结。
      
      ## 自主权
      
      - "No" 是可接受的回答。前提错了就指出来，附上依据，给替代方向。
      - 可逆决定不等人；不可逆决定（删数据、发外部消息、推送到远端）先问。
      - 没证据支撑的话说没证据，别补故事。
      
      ## 文风
      
      - 回复过 **unslop**：短陈述句，不用破折号和句中冒号，不用 AI 词汇，去掉谄媚和填充。
      - 先讲对使用者和维护者的影响，再讲实现。
      - 伪造引用、链接、命令输出是红线。每条关键 claim 标 measured / inferred / guess。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: how
    title: "它怎么工作"
    summary: "回答“它是怎么工作的”：代码走查、子系统架构、放置/归属/分层问题（“该放哪”“哪个包拥有它”“是不是正确的层”）。给动机问题用 why。"
    instructions: |-
      # How
      
      探索代码回答"X 是怎么工作的"，产出相当于资深工程师上手一个子系统所需的架构讲解——够搭起工作心智模型，不到逐行注释源码的程度。
      
      读代码的工具：仓库在本机就用本机文件夹/云端工作区 clone；在 GitHub 上就用 `github_*` 工具读文件、历史、PR。复杂子系统可以 message_bot 并行分头探索，每个委托带明确的角度和返回格式。
      
      ## 1. 评估复杂度
      
      范围模糊就先给出你的解读再探索，用户可以纠偏。
      
      - **简单**（单模块、小工具、"函数 X 怎么工作"这类窄问题）：自己探索并讲解，一次完成，直接进第 4 步。
      - **复杂**（跨多文件/服务的子系统、横切功能、整体架构）：进第 2 步。
      
      拿不准就走简单路径。
      
      ## 2. 探索（仅复杂问题）
      
      把问题拆成 2–4 个角度，各是子系统的一个独立切片。可以并行委托给多个 BOT（message_bot），每个 brief 写清：角度、要看的文件/模块范围、要带回什么（调用链、数据流、关键类型、边界）。也可以自己按角度顺序探索。
      
      ## 3. 综合（仅复杂问题）
      
      汇总各角度的发现成一份讲解。互相矛盾的说法要指出来并给出你更信的判断及理由。
      
      ## 4. 呈现
      
      输出结构（不适用的节直接略去）：
      
      - **Overview**：这段代码在系统里的位置，一段话。
      - **Key Concepts**：理解它必须先知道的类型/术语/约定。
      - **How It Works**：主流程的调用链或数据流，配 `file:line` 引用。
      - **Where Things Live**：主要文件/目录/包的归属地图。
      - **Gotchas**：非显然的坑、隐藏不变量、看起来像 bug 的故意设计。
      
      引用一律给真实 `file:line` 或符号名，不许凭印象造位置。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: why
    title: "为什么是这样"
    summary: "回答“为什么是这样”：设计动机、取舍理由、回归溯源、事后分析、数字阈值的来历。沿证据类别逐一调查（源码历史、issue、文档、聊天、观测、错误追踪、数仓），给带引用的判断。运行时用 how。"
    instructions: |-
      # Why
      
      调查代码背后的动机和意图。`how` 回答代码做什么、怎么跑；`why` 回答什么力量把它塑造成这样。
      
      **姿态**：谨慎、精确的调查者。诚实区分"我知道的"和"我推断的"：每条结论标 measured / inferred / guess。文档化的证据 > 提交记录 > 代码形状推断 > 猜测。
      
      ## 1. 明确目标和问题
      
      目标是代码块、模式、功能或某个具名设计决策；问题是设计理由、取舍、触发边界、外部约束、死代码成因或历史全貌。
      
      目标模糊时按对话上下文给最佳猜测，一句话说明你的解读让用户纠偏，然后继续。
      
      ## 2. 建代码锚点
      
      先内联收集种子上下文：文件路径与行号范围、关键符号、最近改动它的提交、merge 提交里的 PR 号（`( #1234 )`）、关联工单号。
      
      有云端工作区/本机文件夹就跑 `git blame`、`git log --follow`、`git log --format=%B`；在 GitHub 上就用 `github_*` 读文件历史、PR 正文与讨论。这个锚点后面每个调查方向都要用到。
      
      ## 3. 按证据类别逐一调查
      
      七类证据，每类都可能独有地解答一种"why"。ChisaBot 里对应的工具面：
      
      1. **源码历史**（必查）：git 历史、`github_*` 的 PR/讨论、代码注释、测试。最强于"实现时在评审里留下的理由"。
      2. **工单系统**（Linear/Jira/GitHub Issues 等，走 apps 插件或 `github_*`）：最强于产品和业务驱动力。
      3. **长文文档**（Notion/Confluence/语雀等，走 apps 插件）：设计落定前的长文理由。
      4. **团队聊天**（IM/Slack，走 apps 插件）：从没写进文档的实时讨论。
      5. **基础设施观测**（监控/日志平台，走 apps 插件）：超时、重试、限流、熔断类代码的动机。
      6. **错误追踪**（Sentry 类，走 apps 插件）：防御性代码背后的具体异常轨迹。
      7. **产品数仓**：实验开关、数据迁移、"这个数是哪来的"的动机。
      
      对每个类别：有对应工具/插件就去查；查不到任何东西也是有效答案（如实记录"查了，没有"）。
      
      **跳过的合法理由**只有两个，且必须写进最终的"已查来源"里：
      
      - 环境里没有该类工具——标成缺口而非选择："团队聊天跳过：没有接入 IM 插件，对话记录不可检索。"
      - 该类对目标可证地无关——高门槛："错误追踪跳过：目标是构建期脚本，无运行时代码路径。"
      
      ## 4. 综合
      
      把所有类别的发现（含空结果和跳过理由）加上代码锚点综合成判断。特别要求：
      
      - 区分直接证据（写在文档/PR 里的理由）与推断（从代码形状倒推），分别放在不同小节。
      - 列竞争假说：能解释同一形状的多个动机并列给出，各标置信度。
      - 引用抽样复核：综合时抽查引用的 PR/commit 确实存在且说的是这件事。
      
      ## 5. 呈现
      
      输出结构（按需裁剪，但置信度分层和来源清单必须保留）：
      
      - **The Question**、**The Code in Question**
      - **What We Found**（直接证据）、**What We Can Reasonably Infer**（推断）、**Competing Hypotheses**
      - **What We Don't Know**
      - **Sources Consulted**：每个调查方向一行，包括返回空的和被跳过的（附理由）
      - **Confidence Summary**
      
      如果用户的 why 是要改这段代码的前奏，把溯源发现转成一组约束交给他：**Preserve / Change / Avoid / Risk** 四栏，供改动计划用。
      
      ## 常见翻车
      
      - **近因偏差**：把最近的提交当成权威——现在的形状多是多次决策的沉积，往回追。
      - **把推断当证据**：分开写，别混。
      
      ---
      来源：改写自 Cursor 官方插件 pstack（MIT License），适配说明见 docs/pstack-port.md。
  - slug: architect
    title: "设计草图"
    summary: "写代码前先画类型、签名和模块结构草图，再在实现中对照履行。用于 /architect、'设计一下'，或直接开写会锁错形状的非琐碎工作。"
    instructions: |-
      # Architect
      
      先画草图：类型、函数签名、类形状、模块边界，函数体写 `not implemented` + 伪代码。至少两个结构不同的候选，合成后照图施工。
      
      ## 阶段
      
      1. Ground　2. Sketch　3. Agree（可选）　4. Implement　5. Scrap
      
      ## A：Ground 问题
      
      对每块新代码要碰的系统建立真实心智模型：跑 **how** 技能拿到子系统架构讲解。只说出文件名不算 grounded。设计若要重定义归属或分层，再跑 **why** 把历史理由变成约束而非猜测。
      
      仅当真是没有周边系统可接入的绿地才跳过本阶段。
      
      ## B：Sketch
      
      - 先写调用方用法，再从用法反推类型草图。
      - **至少两个结构不同的候选**——整体形状的差异，不是同一形状内的点修（principle-exhaust-the-design-space）。可以自己做两版，也可以 message_bot 让另一个 BOT（建议不同模型）独立出一版再比较。
      - 每个候选按这张红旗表过筛：假设下一个贡献者是只看了几个文件、抄最近例子、走最短路径的 agent——选"从单个文件看正确的改法对整个仓库也正确"的设计。
      - 比较接口深度：选把更多复杂度藏在更小公共面后面的设计。
      - 写合成决策：选哪个为基础、嫁接落选者的哪部分、为什么。
      
      ## C：Agree（可选）
      
      默认不等人，直接进入实现。只有调用方明确要求检查点（"先给我看看再实现"）才停下签字。
      
      设计被推翻时，把反馈当 A 阶段证据，重新 ground 后回 B。
      
      ## D：照图实现
      
      把 `not implemented` 换成真代码，伪代码换成真逻辑。草图是契约：实现中任何偏离都是要显式上报的信号，不是默默吸收的摩擦。函数需要草图没预料的参数时，先问是草图错了、需求漏了还是实现越界。
      
      ## E：图错了就撕
      
      实现持续产生草图吸收不了的摩擦时，扔掉草图，别给错设计打补丁（principle-redesign-from-first-principles、principle-fix-root-causes）。信号是**模式**而非个案：
      
      - 同一种 workaround 在不相干代码里反复出现
      - 多个不相关边界情形都要特例分支
      - 类型要靠 `any`/断言/实际必设的可选字段才能编译
      - 草图说状态不共享，代码却在要锁
      - 调用方必须知道抽象内部规则才用得对
      - 两处以上同形状的 D 阶段偏离
      
      撕图流程：对已建成部分重跑 **how** → 按今天的约束重设计 → 新草图先比旧的小（principle-subtract-before-you-add）→ 回 B。
      
      ## 产出
      
      调用方用法先行 + 类型/签名草图 + 合成决策理由。小改动一份文件；大改动模块地图加类型定义。
      
      ---
