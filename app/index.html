<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：刘海 / 圆角屏下铺满，安全区由样式表的 env(safe-area-inset-*) 让开；
         interactive-widget=resizes-content：安卓 Chrome 弹出键盘时缩小布局视口，输入框贴在键盘上沿（DESIGN.md §40）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ChisaBot · 中文版</title>
    <!-- 品牌图标：同一张头像（assets/brand/，python3 assets/brand/generate.py 生成），16–48px 用更紧的脸部裁切。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- 安装成应用（DESIGN.md §40）：iOS 主屏幕 / 安卓 / 桌面。 -->
    <meta name="application-name" content="ChisaBot" />
    <meta name="description" content="ChisaBot：你的中文 AI 机器人工作台。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChisaBot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#9dbddc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1626" media="(prefers-color-scheme: dark)" />
    <style>
      /* Pre-JS shell: the same sky and glass skeleton the app draws while routes load, so the first
         paint is never a white page. Kept small and self-contained; styles.css takes over after. */
      html, body { margin: 0; min-height: 100%; }
      /* The sky reads the same --sky-* vars as styles.css (DESIGN.md §7); the boot script at the top of
         <body> sets them for the current time before this paints. Fallbacks = the fixed blue sky. */
      body { --sky-1: #6f9bc7; --sky-2: #9dbddc; --sky-3: #c9dbeb; --sky-4: #e4ecf3; --sky-cloud: rgba(255,255,255,.75); --sky-glow: rgba(255,255,255,0); --sky-glow-x: 50%; --sky-glow-y: 20%; background-color: var(--sky-2); background: radial-gradient(560px 560px at var(--sky-glow-x) var(--sky-glow-y), var(--sky-glow), transparent 62%), radial-gradient(900px 380px at 18% 22%, var(--sky-cloud), transparent 70%), radial-gradient(700px 300px at 72% 12%, color-mix(in srgb, var(--sky-cloud) 73%, transparent), transparent 70%), radial-gradient(1100px 420px at 60% 78%, color-mix(in srgb, var(--sky-cloud) 93%, transparent), transparent 70%), linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 68%, var(--sky-4) 100%); background-attachment: fixed; font-family: "Inter Variable", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      html.dark body { --sky-1: #0c1626; --sky-2: #12203a; --sky-3: #172a46; --sky-4: #1b304d; --sky-cloud: rgba(110,150,215,.18); }
      .boot { position: fixed; inset: 0; overflow: hidden; --g: rgba(255,255,255,calc(.34 + var(--sky-lift, 0))); --gl: rgba(255,255,255,.35); --s1: rgba(255,255,255,.25); --s2: rgba(255,255,255,.75); }
      html.dark .boot { --g: rgba(255,255,255,.07); --gl: rgba(255,255,255,.05); --s1: rgba(255,255,255,.03); --s2: rgba(255,255,255,.09); }
      .boot i { display: block; font-style: normal; }
      .boot .sh { background: linear-gradient(90deg, var(--s1) 0%, var(--s2) 50%, var(--s1) 100%); background-size: 200% 100%; animation: boot-sh 1.6s ease-in-out infinite; border-radius: 999px; }
      .boot .gl { background: var(--g); border: 1px solid var(--gl); -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px); }
      .boot-top { position: absolute; inset: 14px 16px auto 16px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
      .boot-dot { width: 48px; height: 48px; border-radius: 50% !important; }
      .boot-seg { position: absolute; left: 50%; transform: translateX(-50%); width: 260px; height: 46px; border-radius: 999px; }
      .boot-right { display: flex; gap: 10px; }
      .boot-search { width: 190px; height: 44px; border-radius: 999px; }
      .boot-cols { position: absolute; inset: 76px 16px 16px 16px; display: grid; grid-template-columns: 260px minmax(0,1fr) 356px; gap: 16px; }
      .boot-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .boot-card { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .boot-bar { height: 12px; }
      .boot-main { align-items: center; justify-content: flex-end; gap: 16px; padding: 24px 6% 0; }
      .boot-note { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 999px; background: rgba(255,255,255,.8); box-shadow: 0 10px 30px rgba(40,70,110,.12); color: #3b3f48; font-size: 13px; white-space: nowrap; }
      html.dark .boot-note { background: rgba(30,42,60,.82); color: #c7cedb; }
      .boot-note[hidden] { display: none; }
      .boot-loading { padding: 8px 16px; opacity: 0; animation: boot-in .3s ease-out .25s forwards; }
      #chisabot-startup-note:not([hidden]) ~ .boot-loading { display: none; }
      .boot-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(59,63,72,.25); border-top-color: currentColor; animation: boot-spin .9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-in { to { opacity: 1; } }
      .boot-note button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: #16181d; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
      html.dark .boot-note button { background: #e8ecf3; color: #10161f; }
      .boot-note button[hidden] { display: none; }
      @keyframes boot-sh { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
      @media (max-width: 1100px) { .boot-cols { grid-template-columns: 240px minmax(0,1fr); } .boot-cols > :nth-child(3) { display: none; } }
      @media (max-width: 760px) { .boot-cols { grid-template-columns: minmax(0,1fr); } .boot-cols > :first-child, .boot-seg, .boot-search { display: none; } }
      html[data-phone] .boot-cols { grid-template-columns: minmax(0,1fr); }
      html[data-phone] .boot-cols > :first-child, html[data-phone] .boot-cols > :nth-child(3), html[data-phone] .boot-seg, html[data-phone] .boot-search { display: none; }
      html[data-phone] .boot-top { top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right)); }
      html[data-phone] .boot-cols { top: calc(76px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); }
      @media (prefers-reduced-motion: reduce) { .boot .sh, .boot-spin { animation: none; } .boot-loading { animation: none; opacity: 1; } }
    </style>
    <!-- Sets the theme before the first paint. Must stay inline and classic: `defer` or `type="module"` runs too late. -->
    <script>
      // localStorage throws in some privacy modes; a theme is not worth taking the app down for.
      try {
        // 0.1.75 renamed every `openbot…` storage key to `chisabot…`. Copy the old values once so
        // theme, language, layout and drafts survive the update; the old keys stay for older clients.
        const store = window.localStorage;
        for (let i = 0; i < store.length; i++) {
          const key = store.key(i);
          if (!key || key.indexOf("openbot") === -1) continue;
          const renamed = key.split("openbot").join("chisabot");
          if (store.getItem(renamed) === null) store.setItem(renamed, store.getItem(key));
        }
      } catch {}
      try {
        const dark = window.localStorage.getItem("chisabot-theme") === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <!-- 设备形态，第一帧之前写到 <html> 上（DESIGN.md §40，app/src/lib/device.ts 有完整说明）：
         手机 = 主要指针是触屏且屏幕短边 < 600，或浏览器明确说是手机（UA-CH）；横屏手机也是手机，平板按宽度。 -->
    <script>
      try {
        (function () {
          var d = document.documentElement;
          var ua = navigator.userAgent || "";
          var mm = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
          var force = null;
          try { force = window.localStorage.getItem("chisabot-layout"); } catch (e) {}
          var uad = navigator.userAgentData;
          var shortSide = Math.min(screen.width || 9999, screen.height || 9999);
          var touch = mm("(pointer: coarse)") && mm("(hover: none)");
          var phone = force === "phone" ? true : force === "wide" ? false : (uad && uad.mobile === true) || (touch && shortSide < 600);
          if (phone) d.setAttribute("data-phone", "");
          if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) d.setAttribute("data-ios", "");
          if (mm("(display-mode: standalone)") || mm("(display-mode: fullscreen)") || mm("(display-mode: window-controls-overlay)") || navigator.standalone === true) d.setAttribute("data-standalone", "");
          if (/ChisaBotAndroid\//.test(ua)) d.setAttribute("data-android-app", "");
          // 浏览器「可以安装」的事件可能比应用脚本先到：先接住，app/src/lib/pwa.ts 再接手。
          window.addEventListener("beforeinstallprompt", function (event) { event.preventDefault(); window.__chisabotInstallPrompt = event; });
        })();
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- chisabot-sky-boot: replaced by the time-of-day sky boot script (vite.config.ts → src/lib/sky.ts). -->
    <!-- Present before the gateway's workspace.js runs its DOMContentLoaded mount, which tells it the
         app draws its own account control (sign-out lives in the avatar menu), so it adds no
         floating "退出登录" button of its own. -->
    <div id="chisabot-account-control" hidden></div>
    <!-- CB-100c：公网网关（deploy/public）不随应用镜像更新。v0.1.75 之前的 workspace.js 只认这个旧 id，
         少了它就会在右下角浮出一个「退出 OpenBot 登录」按钮，盖住右侧抽屉。两个标记都要留。 -->
    <div id="openbot-account-control" hidden></div>
    <div id="root">
      <div id="chisabot-startup" class="boot" role="status" aria-label="正在加载 ChisaBot">
        <div class="boot-top">
          <i class="boot-dot sh"></i>
          <i class="boot-seg gl"></i>
          <span class="boot-right"><i class="boot-search gl"></i><i class="boot-dot gl"></i></span>
        </div>
        <div class="boot-cols">
          <div class="boot-col">
            <i class="sh" style="height:46px"></i>
            <div class="boot-card gl"><i class="boot-bar sh" style="width:40%;height:10px"></i><i class="boot-bar sh" style="width:85%"></i><i class="boot-bar sh" style="width:70%"></i><i class="boot-bar sh" style="width:78%"></i></div>
            <div class="boot-card gl" style="flex:1"><i class="boot-bar sh" style="width:30%;height:10px"></i><i class="boot-bar sh" style="width:90%"></i><i class="boot-bar sh" style="width:65%"></i><i class="boot-bar sh" style="width:80%"></i><i class="boot-bar sh" style="width:55%"></i></div>
          </div>
          <div class="boot-col boot-main">
            <i class="boot-bar sh" style="width:34%"></i>
            <i class="boot-bar sh" style="width:52%"></i>
            <i class="gl sh" style="width:min(640px,100%);height:96px;border-radius:22px"></i>
          </div>
          <div class="boot-col">
            <i class="sh" style="width:40%;height:14px;margin-top:14px"></i>
            <div class="boot-card gl"><i class="boot-bar sh" style="width:50%"></i><i class="sh" style="height:64px;border-radius:16px"></i><i class="boot-bar sh" style="width:35%"></i></div>
          </div>
        </div>
        <div id="chisabot-startup-note" class="boot-note" hidden>
          <span id="chisabot-startup-title">加载时间比平时长一些…</span>
          <span id="chisabot-startup-detail" hidden></span>
          <button id="chisabot-reload" type="button">重新加载</button>
        </div>
        <noscript><div class="boot-note"><span>请启用浏览器的 JavaScript 后重新加载。</span></div></noscript>
        <!-- CB-100c：骨架很淡，慢网下看起来像白屏；先给一句看得见的「正在加载」，变慢或出错后由上面的提示接替。 -->
        <div id="chisabot-startup-loading" class="boot-note boot-loading" aria-hidden="true"><i class="boot-spin"></i><span>正在加载 ChisaBot…</span></div>
      </div>
    </div>
    <script id="chisabot-startup-script">
      // biome-ignore-all lint/complexity/useArrowFunction: Keep the pre-module recovery script compatible with older browsers.
      // biome-ignore-all lint/complexity/useOptionalChain: This must work even when newer module syntax fails to load.
      (function () {
        var startup = document.getElementById("chisabot-startup");
        var title = document.getElementById("chisabot-startup-title");
        var detail = document.getElementById("chisabot-startup-detail");
        var reload = document.getElementById("chisabot-reload");
        var note = document.getElementById("chisabot-startup-note");
        var failed = false;
        var mounted = false;
        var stage = "shell";
        var id;
        try {
          var random = window.crypto.getRandomValues(new Uint32Array(3));
          id = "boot_" + random[0].toString(16) + "_" + random[1].toString(16) + "_" + random[2].toString(16);
        } catch {
          id = "boot_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 12);
        }
        function resourceName(value) {
          try {
            if (typeof value !== "string" || !value) return;
            var url = new window.URL(value, window.location.href);
            if (url.origin !== window.location.origin || !/^\/(assets|auth|src)\//.test(url.pathname)) return;
            var name = url.pathname.slice(url.pathname.lastIndexOf("/") + 1);
            if (/^[A-Za-z0-9._-]{1,120}$/.test(name)) return name;
          } catch {}
        }
        function sameOrigin(value) {
          try {
            return typeof value === "string" && value.length > 0 && new window.URL(value, window.location.href).origin === window.location.origin;
          } catch { return false; }
        }
        function errorName(value) {
          if (["Error", "TypeError", "ReferenceError", "SyntaxError", "RangeError", "SecurityError", "AbortError"].indexOf(value) !== -1) return value;
        }
        function coordinate(value) {
          if (typeof value === "number" && value >= 0 && value <= 10000000 && Math.floor(value) === value) return value;
        }
        function report(event, resource, category, info) {
          if (mounted || typeof window.fetch !== "function") return;
          try {
            var payload = { id: id, event: event, stage: stage };
            if (resource) payload.resource = resource;
            if (category) payload.category = category;
            if (info) {
              if (info.name) payload.name = info.name;
              if (typeof info.line === "number") payload.line = info.line;
              if (typeof info.column === "number") payload.column = info.column;
            }
            window.fetch("/auth/startup-report", {
              method: "POST",
              credentials: "same-origin",
              keepalive: true,
              cache: "no-store",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(function () {});
          } catch {}
        }
        function showFailure(event) {
          if (mounted || failed || !startup || !startup.isConnected) return;
          var target = event.target;
          var resource;
          var category;
          var info;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
            if ((target.tagName === "SCRIPT" && target.type !== "module") || (target.tagName === "LINK" && target.rel !== "stylesheet")) return;
            resource = resourceName(target.src || target.href);
            if (!resource) return;
            category = "resource";
          } else if (event.type === "unhandledrejection") {
            // A blocked third-party beacon must not be mistaken for a failed app.
            var reason = event.reason;
            if (!reason || typeof reason.stack !== "string" || reason.stack.indexOf(window.location.origin + "/assets/") === -1) return;
            category = "promise";
            info = { name: errorName(reason.name) };
          } else {
            if (!sameOrigin(event.filename) || !event.error || typeof event.error.name !== "string") return;
            resource = resourceName(event.filename);
            category = event.error.name === "SyntaxError" ? "syntax" : "runtime";
            info = { name: errorName(event.error.name), line: coordinate(event.lineno), column: coordinate(event.colno) };
          }
          failed = true;
          startup.setAttribute("role", "alert");
          title.textContent = "无法加载 ChisaBot，请检查网络连接";
          note.hidden = false;
          report("error", resource, category, info);
        }
        report("shell");
        reload.addEventListener("click", function () { window.location.reload(); });
        window.addEventListener("error", showFailure, true);
        window.addEventListener("unhandledrejection", showFailure);
        document.addEventListener("load", function (event) {
          var target = event.target;
          if (mounted || failed || !target || target.tagName !== "SCRIPT" || target.type !== "module") return;
          var resource = resourceName(target.src);
          if (!resource) return;
          if (stage === "shell") stage = "entry-loaded";
          report("entry-loaded", resource);
        }, true);
        window.addEventListener("chisabot-boot-stage", function (event) {
          if (mounted || (event.detail !== "entry-executing" && event.detail !== "react-mounted")) return;
          stage = event.detail;
          report(stage);
          if (stage === "react-mounted") {
            mounted = true;
            window.clearTimeout(deadline);
            window.clearTimeout(hint);
          }
        });
        // A gentle hint once the load is clearly slow; the diagnostic report still waits for 30s.
        var hint = setTimeout(function () {
          if (mounted || failed || !startup || !startup.isConnected) return;
          note.hidden = false;
        }, 10000);
        var deadline = setTimeout(function () {
          if (mounted || failed || !startup || !startup.isConnected) return;
          title.textContent = "加载时间较长，请检查网络连接";
          note.hidden = false;
          report("timeout");
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
