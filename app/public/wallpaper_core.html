            aureole: 0.6, aureoleWidth: 10,   // owner-tuned 2026-09-22: strength dial, base half-width in degrees (pristine air)

  cloudLit: { thin: 0.75, back: 1.0, hiTint: 0.5, airlight: 0.8, red: 1.0 },   // owner-tuned 2026-09-22

  /* CORONAE (L&L §4.13): diffraction rings around the sun or moon seen
     through thin altocumulus — a bluish-white aureole and one pale rust
     ring a few degrees out. radius = the ring's angular radius (deg, the

     force = bypass the cloud gates. Mostly the moon's; the sun's glare
     leaves only a faint aureole by day. */
  corona: { strength: 0.1, radius: 6, purity: 0.6, force: false },   // owner-tuned 2026-09-22
  skyglow: null,          // measured city light 0–1 (Black Marble sample), snapshot-persisted
  skyglowStrength: 0.3,   // the dial: how much realism eats the dark night canvas
  haveWx: false, updated: null,
  live: true, hourOverride: 12,
  wTime: 1.0, wCond: 1.0, wTemp: 0.8,     // influence weights (fixed in code)
  density: 0.9, flow: 1.7, speed: 2.5, grain: 0.018,
  shaftStr: 1.1, shaftCov: 0.5, shaftReach: 1.0
};
const useF = true;   // imperial units throughout, per user preference
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass = d => COMPASS[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];

/* ---------- shaders ---------- */
const VERT = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';

const FRAG = `
#ifdef GL_ES
precision highp float;
#endif
uniform vec2  uRes;
uniform float uDet;      // detail unit in device px = min(height, width / aspect): the size of one 'height unit' for the details
uniform float uTime;     // slow, accumulated time (drives drift)
uniform vec3  uC0;       // zenith
uniform vec3  uC1;
uniform vec3  uC2;
uniform vec3  uC3;       // horizon
uniform vec2  uGlowPos;
uniform vec3  uGlowCol;
uniform float uGlow;
uniform float uGlowSize; // body footprint: >1 near the horizon, 1 high up
uniform float uDensity;
uniform float uWarp;
uniform float uGrain;
uniform vec2  uDrift;    // wind: direction (screen space) x strength
uniform vec3  uPrecip;   // x rain, y snow/hail, z fall-speed multiplier
uniform vec3  uShaft;    // x strength, y coverage, z reach (how far down)
uniform float uFog;      // clumpy fog amount
uniform vec3  uMilk;     // fog color (ambient-light aware)
uniform float uDeck;     // overcast lid amount: drives cloud-base mottle
uniform float uPuff;     // cumulus amount: defined bright clumps (partly regime)
uniform float uNight;    // additive night-cloud veil (dark skies only)
uniform float uHaze;     // atmospheric perspective: textured white low band (day)
uniform float uSquash;   // gradient height compression: <1 squeezes the low stops' span
uniform vec3  uTint;     // low-sun cloud tint: chromatic multiply on bright field material
uniform float uRays;     // godrays: beam-fan strength (rides the glow's visibility)
uniform vec2  uRayLook;  // godrays look: x beam scale, y radial falloff (live-tuned)
uniform float uHalo;     // 22° solar halo amount (frame param, crossfaded)
uniform vec3  uHaloLook; // halo look: x ring radius, y dispersion, z softness (live-tuned)
uniform sampler2D uLut;  // owner color LUT: 33³ as a 1089×33 slice strip
uniform float uLutAmt;   // LUT mix strength (0 = ungraded)
uniform float uTexV;    // global texture vibrancy (grade-shipped)
uniform vec4  uCirA;     // cirrus: base angle (rad), angle variance (rad), fiber density x, opacity
uniform vec4  uCirB;     // cirrus: coverage bias, evolve speed, break depth, grain scale
uniform vec3  uSun;      // THE SUN for sky geometry, whatever body the glow shows: x,y screen position (compositional sweep + bodyY), z TRUE altitude (deg)
uniform float uPolar;    // polarizer band strength (frame param: dial × daylight × clarity × no deck)
uniform vec2  uAureole;  // aureole: x strength (frame param), y half-width in degrees (grows with turbidity)
uniform float uWhiten;   // horizon whitening: aerosol optical depth per air mass (frame param: dial × turbidity × gates)
uniform vec3  uPurple;   // purple light: x strength (frame param), y lobe center altitude (deg), z lobe σ (deg)
uniform vec2  uCrep;     // crepuscular shadow fan: x strength (frame param), y angular noise scale
uniform vec3  uLit;      // cloud lighting: x thin-cloud darkening, y back-light strength, z low-sun airlight bias (frame params)
uniform vec3  uTintHi;   // low-sun tint for the HIGH cloud (cirrus): stays lit ~2° longer than uTint's deck
uniform vec3  uFloorZ;   // night floor at the zenith (display sRGB, already × the night gate; 0 by day)
uniform vec3  uFloorH;   // night floor at the horizon
uniform vec3  uDogs;     // sundogs: x strength (frame param), y separation from the sun (detail units), z tail length (detail units)
uniform vec3  uCorona;   // corona: x strength (frame param), y ring radius (detail units), z purity 0–1
uniform float uAlpha;    // crossfade opacity of this pass

float hash(vec2 p){
  // precision-safe hash (Dave Hoskins): no giant intermediate products,
  // so it stays pattern-free even at large gl_FragCoord values
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);   // quintic: silkier gradients
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.52;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 4; i++){       // fewer octaves = big soft masses, no wisps
    v += a * vnoise(p);
    p = rot * p * 1.9;
    a *= 0.5;
  }
  return v;
}
// ---- sky geometry (phenomena plan, step 0) ----
// The page's projection (CPU bodyY): the horizon line sits at SCENE y
// 0.10 and 90° of altitude spans 0.80 of the reference height, so ONE
// reference-height unit is 112.5°. Horizontal offsets are measured in
// the same units (kS.x), so the same scale applies. scatterAngle() is the angle
// between this pixel's view ray and the sun, in radians, from the sun's
// TRUE altitude (uSun.z) — the body's screen y is compressed below the
// horizon, so twilight geometry must not read it. uSun is the SUN even
// after the glow body has handed over to the moon (−5°): twilight
// geometry never jumps to the moon's azimuth. Every sun-relative sky
// layer (polarizer band, aureole, purple light) reads this one function.
float scatterAngle(vec2 uv, vec2 sunPos, float sunAltDeg, vec2 kS){
  // altitude: exact (uv.y − 0.10)·112.5° when the detail unit is the height
  // (kS.y = 1); on a narrower window the sky is measured in detail units
  // around the SUN's true altitude, so the angle stays isotropic with the
  // horizontal axis and the halo, aureole and arc keep their shapes
  float a1 = (sunAltDeg + ((uv.y - 0.10) * 112.5 - sunAltDeg) * kS.y) * 0.017453292;
  float a2 = sunAltDeg * 0.017453292;                                  // sun altitude
  float daz = (uv.x - sunPos.x) * kS.x * 112.5 * 0.017453292;          // azimuth offset
  float c = sin(a1) * sin(a2) + cos(a1) * cos(a2) * cos(daz);
  return acos(clamp(c, -1.0, 1.0));
}
// Rayleigh degree of polarization = the sky's PURITY map: 0 at the sun,
// 1 at 90° from it (L&L §2.2: bluest at 90°, flattest near the sun)
float purity(float theta){
  float s = sin(theta), c = cos(theta);
  return (s * s) / (1.0 + c * c);
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  // SCENE SCALE (owner, 2026-09-22): the SKY fits the height — uv.y is the
  // sky coordinate everywhere (0.10 horizon, 0.90 zenith), so the whole
  // sky is always in frame and horizon layers ride the bottom edge. The
  // DETAILS live in uDet, the tighter of height and width/aspect: p is the
  // field frame in detail units (centered), kS converts a window-fraction
  // offset into detail units on each axis. On a landscape window uDet is
  // the height and kS = (W/H, 1): the tuned look, unchanged. On a phone
  // uDet is the width/aspect, so the sun's halo, aureole and arc shrink
  // to fit instead of running off the sides.
  vec2 p  = (gl_FragCoord.xy - 0.5 * uRes) / uDet;
  vec2 kS = uRes / uDet;
  float t = uTime;
  vec2 pw = p - uDrift * t * 0.018;   // advect the whole field downwind

  // one gentle layer of domain warping -> haze that breathes, not smoke that swirls
  vec2 q = vec2(
    fbm(pw * 1.0 + t * vec2(0.010, 0.006)),
    fbm(pw * 1.0 + vec2(5.2, 1.3) - t * vec2(0.007, 0.009))
  );
  vec2 r = vec2(
    fbm(pw * 1.4 + 1.1 * uWarp * q + vec2(1.7, 9.2) + t * vec2(0.0035, -0.0025)),
    fbm(pw * 1.4 + 1.1 * uWarp * q + vec2(8.3, 2.8) - t * vec2(0.0025, 0.0035))
  );
  float f = fbm(pw * 1.1 + 0.8 * uWarp * r);
  f = mix(f, 0.5, 0.35);             // flatten the field: diffuse, defocused

  // vertical 4-stop gradient, gently perturbed by the cloud field
  float g = clamp(uv.y + (f - 0.5) * (0.18 + 0.6 * uDensity) * (0.88 + 0.3 * uv.y), 0.0, 1.0);
  // height compression: an exponent < 1 pushes the sample point up, so
  // the lower stops' colors get squeezed into a SHORTER band — the
  // sunset glow physically sinks with the sun instead of thinning tall
  float gm = pow(g, uSquash);
  vec3 col = mix(uC3, uC2, smoothstep(0.0, 0.45, gm));
  col = mix(col, uC1, smoothstep(0.32, 0.78, gm));
  col = mix(col, uC0, smoothstep(0.62, 1.0, gm));

  // POLARIZER BAND (phenomena plan step 0/1 — L&L §2.2): skylight is
  // ~85% polarized 90° from the sun and unpolarized near it. Invisible
  // to the eye; a polarizing filter removes that component and the sky
  // deepens along a great arc 90° from the sun — the cobalt band of
  // landscape photography. The arc sweeps with the sun through the day;
  // haze depolarizes it (the CPU folds turbidity, deck and the daylight
  // gate into uPolar). Acts on the SKY between clouds: the field's bright
  // material is excluded the way uTint selects it. Darkens and pushes
  // chroma along the arc; never lightens.
  float skyM = 1.0 - smoothstep(0.47, 0.78, f);   // open sky between the field's bright material
  float th = scatterAngle(uv, uSun.xy, uSun.z, kS);   // this pixel's angle from the sun (sky + cloud lighting)
  if (uPolar + uAureole.x > 0.001){
    if (uPolar > 0.001){
      float pk = purity(th) * uPolar * skyM;
      float pl = dot(col, vec3(0.299, 0.587, 0.114));
      col = max(mix(col, (col - pl) * 1.25 + pl, pk), 0.0);   // chroma up along the arc
      col *= 1.0 - 0.45 * pk;                                 // and darker: ~0.9 stop at full
    }
    // AUREOLE (phenomena plan step 1 — L&L §2.2 Fig. 2.2A): the sky near
    // the sun is BRIGHTER and WHITER — 10° from the sun the spectrum is
    // nearly flat, 90° away it is bluest. Two lobes: the broad Rayleigh
    // rise (1+cos²θ: twice as bright at the sun as at 90°) that every
    // clear sky has, and the aerosol forward-scatter lobe whose width
    // the CPU grows with turbidity (crisp day: small hard sun on deep
    // blue; humid day: broad soft aureole on a paler sky). Flattens the
    // spectrum toward the sun's transmitted color and lifts it, screened
    // so it never clips. Sky only; the glow body stays what it is.
    if (uAureole.x > 0.001){
      float cth = cos(th);
      float lobeR = cth * cth * step(0.0, cth);                      // 1 at the sun, 0 at 90°, none behind
      float lobeM = exp(-(th * 57.29578) / max(uAureole.y, 1.0));    // forward lobe, half-width in degrees
      float au = uAureole.x * (0.35 * lobeR + 0.65 * lobeM) * skyM;
      vec3 illum = mix(vec3(1.0), uGlowCol, 0.5);
      float lumA = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, illum * lumA, au * 0.7);          // whiter: the spectrum flattens toward the sun
      col += au * 0.55 * illum * (1.0 - col);          // brighter: screened lift toward the illuminant
    }
  }

  // PURPLE LIGHT + CREPUSCULAR SHADOW FAN (phenomena plan step 2 —
  // L&L §2.14, Minnaert §221). Twenty to thirty minutes after sunset the
  // lower air is in the earth's shadow while dust at 20–25 km is still
  // lit: reddened direct light off that dust plus blue skylight = a
  // diffuse PURPLE glow ~40–45° above the sunset point, 10–20° across.
  // Screen-space lobe anchored to the sun's azimuth (uSun.x — the body
  // itself is below the bottom edge by now, and the glow may already be
  // the moon's), Gaussian, 1.6σ wide
  // and σ tall, none below the horizon line; a screened lift of a
  // magenta leaning toward the sun's transmitted color. The CPU owns the
  // timing (real sun −3…−8°, peak −5°) and the dust (day seed).
  // CREPUSCULAR RAYS are shadows IN this light: clouds hidden below the
  // western horizon cast dark strips that fan up from the sub-horizon
  // sun point (angular value-noise on a circle around it, godray-style,
  // no seam), most visible near their vanishing point and blue-green —
  // the shadowed sky. Structural pairing (Minnaert: no purple light, no
  // rays): the strips REMOVE purple light and cool the low sky under it.
  if (uPurple.x > 0.001){
    vec2 gpd = (uv - uSun.xy) * kS;   // from the sun point, detail units (the fan stays round)
    float altP = (uv.y - 0.10) * 112.5;   // lobe height: sky coordinate, horizon-anchored
    float dxD = gpd.x * 112.5;
    float dyD = altP - uPurple.y;
    float sigP = max(uPurple.z, 1.0);
    float lobe = exp(-0.5 * (dxD * dxD / (2.56 * sigP * sigP) + dyD * dyD / (sigP * sigP)))
               * smoothstep(-2.0, 6.0, altP);
    float shadow = 0.0;
    if (uCrep.x > 0.001){
      float drP = max(length(gpd), 1e-4);
      vec2 dirP = gpd / drP;
      float crA = 0.7 * vnoise(dirP * uCrep.y + vec2(3.1, 8.7) + t * 0.004)
                + 0.3 * vnoise(dirP * uCrep.y * 2.1 + vec2(6.4, 1.9) - t * 0.003);
      float strips = smoothstep(0.58, 0.82, crA);
      shadow = uCrep.x * strips * exp(-drP * 1.6) * skyM;
    }
    vec3 pcol = vec3(0.64, 0.25, 0.60);   // reddened dust light + blue skylight (the glow color may be the moon's by now)
    col += uPurple.x * lobe * skyM * (1.0 - shadow) * pcol * (1.0 - col);
    col = mix(col, col * vec3(0.80, 0.86, 0.94), shadow * 0.6 * (1.0 - smoothstep(5.0, 60.0, altP)));
  }

  // luminance modulation + a soft bright "sheet". Under an overcast lid
  // the color gradient goes near-uniform and displacement stops carrying
  // the clouds, so the DECK MOTTLE takes over: uDeck (how much lid the
  // CPU composed) drives strong cloud-base luminance structure — dark
  // bases, bright thin spots — the way a real deck reads.
  col *= 1.0 + (f - 0.5) * (0.05 + 0.13 * min(uDensity, 1.7) + 0.7 * uDeck) * (0.85 + 0.45 * uv.y) * uTexV;

  // low-sun cloud tint: clouds are neutral projection screens — at low
  // sun they show the TRANSMITTED, Rayleigh-reddened beam while the sky
  // between them keeps showing scattered blue. A luminance-preserving
  // chromatic multiply on the field's bright material (uTint carries
  // the sun's transmitted disk color, amount folded in on the CPU).
  col *= mix(vec3(1.0), uTint, smoothstep(0.47, 0.78, f));

  // CLOUD LIGHTING (phenomena plan — L&L §4.18–4.19): clouds are white
  // because drops scatter every color and absorb none; a cloud is dark
  // for two reasons only — SHADOW (its own bulk, when lit from behind) or
  // THINNESS (it transmits the sky behind it and loses direct light to
  // scattering). Thickness here = the field above the material threshold.
  // uLit.x THIN: thin material darkens toward a bluer sky instead of
  // adding white. uLit.y BACK-LIGHT by the scattering angle: on the sun's
  // side thick clumps get a dark core and a bright rim, thin cloud a
  // forward-scatter glare; away from the sun (front-lit) thick cloud reads
  // brilliantly white. Day only, needs cloud — the CPU gates both.
  if (uLit.x + uLit.y > 0.001){
    float thick = smoothstep(0.58, 0.80, f);
    float thin  = smoothstep(0.47, 0.60, f) * (1.0 - smoothstep(0.60, 0.74, f));
    float rim   = smoothstep(0.56, 0.66, f) * (1.0 - smoothstep(0.66, 0.78, f));
    float thd   = th * 57.29578;
    float back  = 1.0 - smoothstep(15.0, 60.0, thd);
    float front = smoothstep(70.0, 120.0, thd);
    vec3 illumC = mix(vec3(1.0), uGlowCol, 0.6);
    col = mix(col, col * vec3(0.90, 0.95, 1.04) * 0.88, uLit.x * thin);          // thin: the sky shows through
    col *= 1.0 - uLit.y * back * thick * 0.28;                                   // back-lit thick: self-shadowed core
    col += uLit.y * back * (rim * 0.35 + thin * 0.45) * illumC * (1.0 - col);    // bright rim, glare through thin cloud
    col += uLit.y * front * thick * 0.14 * illumC * (1.0 - col);                 // front-lit thick: white
  }

  // cirrus fibratus (reference: the owner's photo): LONG semi-
  // transparent strands at a gentle angle, feathered soft — rendered
  // the way the deck blends (smooth proportional mix, NO hard
  // thresholds; thresholding read as blocky altostratus). A rotated
  // anisotropic frame gives strands their sweep, a fine cross-axis
  // striation gives the silk grain, and a slow bank field varies
  // density across the sky and dissolves patches as they drift.
  if (uPuff > 0.001){
    // the sweep angle varies like a CURRENT: the deviation field is
    // cubed, so most of the sky runs straight and then takes a smooth
    // bend before straightening again — never a continuous twist
    vec2 pa = p - uDrift * (t * 0.007);
    float dv = vnoise(pa * 0.4 + vec2(19.3, 4.7)) - 0.5;
    float ang = uCirA.x + (8.0 * dv * dv * dv) * uCirA.y;
    float ca = cos(ang), sa = sin(ang);
    vec2 pr = vec2(ca * p.x + sa * p.y, -sa * p.x + ca * p.y)
            - uDrift * (t * 0.007);
    // evolve: the fiber fields crawl along the cross axis, so strands
    // continuously REFORM (the gentle dissolve the other clouds have)
    float ev = t * uCirB.y;
    // brushy turbulence: a soft warp breaks the ruled striping into
    // stroke-like filaments inside the white gradients
    float wob = vnoise(vec2(pr.x * 2.6, pr.y * 4.0) + vec2(11.1, 6.3)) - 0.5;
    float strands = vnoise(vec2(pr.x * 0.7, pr.y * 12.0 * uCirA.z + wob * 1.5) + vec2(7.7, 2.2 + ev));
    float fine    = vnoise(vec2(pr.x * 1.6, pr.y * 26.0 * uCirA.z + wob * 3.2) + vec2(3.3, 9.1 - ev * 1.7));
    float bank    = vnoise(vec2(pr.x * 0.35, pr.y * 1.5) + vec2(3.1, 8.4)
                         + t * vec2(0.008, 0.005));
    float veil = smoothstep(0.35, 0.95, strands * 0.65 + fine * 0.35)
               * smoothstep(0.25 - uCirB.x, 0.85 - uCirB.x, bank)
               * smoothstep(0.10, 0.30, uv.y);   // gone by the lower band
    // internal texture: an ISOTROPIC cellular field breaks the smooth
    // stroke into soft flocks along its length (torn-cotton interior,
    // per the owner's reference) — a soft mask, never a hard cut
    vec2 cp = pr * (6.0 * uCirB.w);
    float cell = 0.55 * vnoise(cp + wob * 0.9 + vec2(4.2, 1.9 + ev * 0.6))
               + 0.30 * vnoise(vec2(0.8 * cp.x - 0.6 * cp.y, 0.6 * cp.x + 0.8 * cp.y) * 2.1
                               + vec2(9.4, 3.3 - ev))
               + 0.15 * vnoise(cp * 3.7 + vec2(1.3, 7.9));
    veil *= (1.0 - uCirB.z) + uCirB.z * smoothstep(0.32, 0.75, cell);
    // OVERLAY-style blend: pops on a bright sky, melts into a dark one —
    // one opacity, and the day/night behavior falls out of the math
    vec3 cw = min(uMilk * 1.22 * uTintHi, vec3(1.0));   // high cloud wears its own low-sun tint (stays lit after the deck)
    vec3 ov = mix(2.0 * col * cw,
                  1.0 - 2.0 * (1.0 - col) * (1.0 - cw),
                  step(vec3(0.5), col));
    col = mix(col, ov, uPuff * veil * uCirA.w);
    // the overlay melts into a dark base by design — at night a dim
    // ADDITIVE lift (moon/skyglow-lit fibers) keeps the strands present
    col += uMilk * veil * (uPuff * uNight * 0.9);   // night cirrus as present as the night deck clouds
  }

  // night clouds: on a dark sky the multiplicative mottle has nothing to
  // multiply — visible night clouds are LIT (moon, skyglow), i.e. an
  // ADDITIVE dim veil where the field peaks. uNight gates this to night
  // (CPU-driven, V2 only), and the ambient-aware milk keeps it navy-dim.
  if (uNight > 0.001){
    col += uMilk * clamp(f - 0.46, 0.0, 0.40) * uNight * (0.8 + 0.4 * uv.y);
  }

  // HORIZON WHITENING (phenomena plan step 1 — L&L §2.3): along a long
  // path scattered light SATURATES, I = 1 − e^−τ, and multiple scattering
  // mixes every wavelength, so the horizon sky takes the color of the
  // light feeding it — white by day, the sun's color when it is low. τ is
  // the AEROSOL depth per air mass (the Rayleigh part is already in the
  // LUT's horizon stop) times the Kasten–Young air mass of this pixel's
  // altitude (~38 at the horizon, 1 overhead), so the whitening climbs
  // exactly as far as the haze does: NOTHING on a pristine day (the
  // owner's de-murk rule), a white band climbing high on a humid or
  // smoky one. Sits in front of the clouds like the veil it is; the
  // texture-only haze below still mottles it.
  if (uWhiten > 0.001){
    // soft horizon (owner: "a tad softer where it ends"): a smooth max
    // instead of a hard clamp at the horizon line (no crease), and the
    // air-mass curve read 1° higher, so the steep first degrees relax
    // into a longer shoulder. The CPU's τ is scaled so the strength AT
    // the horizon line is unchanged for a given dial.
    float altR = (uv.y - 0.10) * 112.5;
    float altW = 0.5 * (altR + sqrt(altR * altR + 4.0)) + 1.0;
    float amW = 1.0 / (sin(altW * 0.017453292) + 0.15 * pow(altW + 3.885, -1.253));
    float wh = 1.0 - exp(-uWhiten * amW);
    float lowSunW = 1.0 - smoothstep(5.0, 25.0, uSun.z);
    vec3 illumW = mix(vec3(1.0), uGlowCol, 0.6 * lowSunW);
    // §2.6 airlight: blue skylight scattered INTO the low-sun path sits over
    // the reddened light — the band leans violet ("purple mountain")
    illumW = mix(illumW, illumW * vec3(0.88, 0.93, 1.14), uLit.z);
    float lumW = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(col, illumW * mix(lumW, 0.92, 0.6), wh);
  }

  // horizon veil, TEXTURE-ONLY (owner de-murk fix): zero-mean patchy
  // modulation of the low band — soft cloudy structure that drifts
  // with the field, with NO net whitening wash (the old mix-toward-milk
  // drained the horizon's blue into warm gray; the physical LUT already
  // carries atmospheric perspective's real color). Multiplicative, so
  // chroma is untouched by construction.
  if (uHaze > 0.001){
    float hband = 1.0 - smoothstep(0.02, 0.52, uv.y);
    float htex = smoothstep(0.30, 0.72, f) - 0.5;   // zero-mean patches
    col *= 1.0 + htex * uHaze * hband * 0.9;
  }
  float sheet = smoothstep(0.45, 0.95, r.y) * uDensity;
  col = mix(col, col * 1.05 + 0.015, sheet * 0.22);

  // clumpy fog: distinct banks with ragged interiors; cores go thick,
  // gaps open to nearly clear sky — never a flat wash
  if (uFog > 0.001){
    float fogB = fbm(pw * 0.85 + vec2(4.1, 7.7));
    float bank = smoothstep(0.42, 0.60, 0.5 * f + 0.5 * fogB);
    float tatter = smoothstep(0.35, 0.75, fbm(pw * 2.3 + vec2(9.3, 1.2)));
    float fogd = bank * (0.55 + 0.45 * tatter);
    col = mix(col, uMilk, uFog * (0.10 + 0.90 * fogd));
  }

  // sun / moon glow: a DELIBERATE compact body — a bright core with a
  // tight bloom (the old half-screen halo diffused the whole sky).
  // uGlowSize breathes it larger near the horizon, tight when high.
  vec2 gp = (uv - uGlowPos) * kS;   // detail units: the body and its halo stay round and sized
  float d2 = dot(gp, gp) / (uGlowSize * uGlowSize);
  vec3 gt = uGlowCol * uGlow * (0.60 * exp(-d2 * 55.0) + 0.25 * exp(-d2 * 11.0));
  col += gt * (1.0 - col);   // screen blend: blooms on dark skies, melts into bright ones

  // 22° solar halo: ice-crystal refraction as a delicate, strictly
  // ADDITIVE ring — sharp inner edge, long soft outer falloff, and the
  // dispersion spread as per-channel radii (warm inner rim → neutral →
  // cool outer smear; a tint gradient, never a rainbow). The distance
  // is the RAW offset — a halo's angular radius must NOT breathe with
  // the body's uGlowSize. Tinted by uGlowCol, so low-sun halos go
  // ember for free. One bank-style noise sample keeps it patchy like
  // the ice haze it lives in. moon halo: later (skyGlow reports isMoon).
  if (uHalo > 0.001){
    // slight perspective shift: on a flat projection a sun-centered
    // circle reads as displaced toward the view center — nudge the ring's
    // center from the body toward screen middle (same lens-geometry
    // family as the shear below)
    vec2 hoff = (vec2(0.5) - uGlowPos) * 0.06;
    hoff *= kS;
    vec2 hgp = gp + hoff;
    float hd = length(hgp);
    float pat = 0.6 + 0.4 * vnoise(pw * 0.9 + vec2(12.7, 3.9));
    float hw = 0.070 * uHaloLook.z;   // z: outer-falloff softness (1 = designed width)
    // slight SHEAR (owner): the ring leans with the sun's screen height —
    // a low sun stretches the top lobe wider, a high sun the bottom one
    float dirY = hgp.y / max(hd, 1e-4);
    float R = uHaloLook.x * (1.0 + (0.5 - uGlowPos.y) * 0.15 * dirY);
    // envelope: sharp inner edge; the outer falloff is stretched so the
    // geometrically-widening bands have room to finish
    float env = smoothstep(R - 0.018, R, hd) * (1.0 - smoothstep(R, R + hw * 1.45, hd));
    // IRIDESCENCE (owner: "bubble veil"): thin-film hue cycling across
    // the ring's width — per-channel cosine phases 120° apart, swirled
    // by the same patch field so the bands shimmer like soap film.
    // GEOMETRIC band growth: the innermost color keeps its designed
    // width and each successive band runs ~10% longer than the one
    // inside it (log-warped phase; 0.286 = 3·ln 1.1 for 3 bands/cycle).
    // cos ∈ [−1,1] → irid ∈ [0,1]: strictly additive, never darkens.
    // xr clamped ≥ 0: the sharp inner ramp stays pure band-0 RED (the
    // physical order — red inner rim, blue outer); the swirl is capped
    // at ±0.12 cycles so hues shimmer but can never REORDER
    float xr = max((hd - R) / hw, 0.0);
    float ph = log(1.0 + 0.286 * (0.4 * uHaloLook.y) * xr) / 0.286
             + (pat - 0.8) * 0.6;
    vec3 irid = 0.5 + 0.5 * cos(6.2831 * ph + vec3(0.0, -2.094, -4.188));
    // pure bands (no white dilution), and only a soft pull toward the
    // sun's transmitted color so the film keeps its own hues at dusk
    vec3 tintG = mix(vec3(1.0), uGlowCol, 0.4);
    col += env * irid * tintG * (uHalo * 0.13) * pat * (1.0 - col);
  }

  // SUNDOGS (phenomena plan — L&L §5.8): plate crystals falling flat
  // confine the 22° refraction to the sun's altitude, so instead of a
  // faint ring the light piles into two bright patches beside the sun.
  // The look (owner, from his photo): NOT a spot with a core — an
  // iridescent, smudged, DIRECTIONAL glare: red at the sunward edge
  // running through orange and yellow into white and a pale blue tail
  // that smears away from the sun, and broken into soft filaments by the
  // ice fibers it lives in. The CPU places them (separation from the
  // plate-crystal formula, in the halo's own angular scale so they sit
  // ON the ring at a low sun) and fades them with altitude.
  if (uDogs.x > 0.001){
    float au = uHaloLook.x / 22.0;                                     // detail units per degree
    float patD = 0.6 + 0.4 * vnoise(pw * 0.9 + vec2(12.7, 3.9));
    vec2 hoffD = (vec2(0.5) - uGlowPos) * 0.06 * kS;                   // the ring's perspective nudge
    float sIn = 1.6 * au, sOut = max(uDogs.z, 1.5 * au), sy = 2.4 * au;
    vec3 dogs = vec3(0.0);
    for (int i = 0; i < 2; i++){
      float sgn = i == 0 ? -1.0 : 1.0;
      vec2 dp = gp + hoffD - vec2(sgn * uDogs.y, 0.0);
      float ex = sgn * dp.x;                                           // outward from the sun
      float sxv = ex < 0.0 ? sIn : sOut;                               // short toward the sun, long smear away
      float body = exp(-0.5 * ex * ex / (sxv * sxv)) * exp(-0.5 * dp.y * dp.y / (sy * sy));
      float tq = clamp((ex + sIn) / (sIn + 1.6 * sOut), 0.0, 1.0);     // position along the smear
      vec3 spec = tq < 0.25 ? mix(vec3(1.0, 0.35, 0.22), vec3(1.0, 0.62, 0.25), tq / 0.25)
                : tq < 0.5  ? mix(vec3(1.0, 0.62, 0.25), vec3(1.0, 0.92, 0.55), (tq - 0.25) / 0.25)
                : tq < 0.75 ? mix(vec3(1.0, 0.92, 0.55), vec3(1.0, 1.0, 0.98), (tq - 0.5) / 0.25)
                :             mix(vec3(1.0, 1.0, 0.98), vec3(0.82, 0.90, 1.0), (tq - 0.75) / 0.25);
      dogs += body * spec;
    }
    // smudged into the fibers: a horizontally stretched streak field
    // breaks the glare into soft filaments, drifting with the field
    float smear = 0.55 + 0.45 * vnoise(vec2(p.x * 2.2, p.y * 7.0) + vec2(3.3, 8.1) + t * vec2(0.010, 0.004));
    vec3 tintD = mix(vec3(1.0), uGlowCol, 0.5);
    col += dogs * tintD * (uDogs.x * 0.7) * patD * smear * (1.0 - col);
  }

  // CORONA (phenomena plan — L&L §4.13): diffraction around the drops of
  // a thin cloud in front of the body — a bluish-white aureole a degree
  // or two across and a pale rust-brown ring a few degrees out, red on
  // the outside; uniform drops give a purer, narrower ring with a faint
  // greenish band inside it. Lives where the thin cloud is (weighted by
  // the field), around the sun or the moon alike; the CPU gates it to
  // thin mid cloud and favors the moon.
  if (uCorona.x > 0.001){
    float dC = length(gp);
    float auC = uHaloLook.x / 22.0;
    float aur = exp(-0.5 * dC * dC / (1.4 * auC * 1.4 * auC));
    float rw = 0.9 * auC * mix(1.6, 0.8, uCorona.z);
    float ring = exp(-0.5 * pow((dC - uCorona.y) / rw, 2.0));
    float inner = exp(-0.5 * pow((dC - uCorona.y * 0.78) / rw, 2.0)) * uCorona.z;
    vec3 ringC = mix(vec3(0.85, 0.72, 0.60), vec3(0.95, 0.55, 0.35), uCorona.z);
    vec3 cC = aur * vec3(0.80, 0.86, 1.0) * 0.55
            + ring * ringC * (0.25 + 0.35 * uCorona.z)
            + inner * vec3(0.55, 0.80, 0.75) * 0.15;
    float cm = 0.5 + 0.5 * smoothstep(0.45, 0.70, f);                  // brightest where the thin cloud is
    col += uCorona.x * cC * cm * (1.0 - col);
  }

  // sun godrays (abstract, Minecraft-spirited): broad soft beams fan
  // out from the glow — angular value-noise sampled ON A CIRCLE (no
  // atan seam), two octaves for irregular beam widths, slowly rotating
  // and morphing. They wear the glow's own color and screen onto the
  // sky, so ember sunsets throw ember rays.
  if (uRays > 0.001){
    float dr = max(sqrt(d2), 1e-4);
    float rc = cos(t * 0.008), rs = sin(t * 0.008);       // slow fan rotation
    vec2 dirn = vec2(rc * gp.x - rs * gp.y, rs * gp.x + rc * gp.y) / dr;
    float raysA = 0.75 * vnoise(dirn * uRayLook.x + vec2(7.3, 2.1) + t * 0.012)
                + 0.25 * vnoise(dirn * uRayLook.x * 2.3 + vec2(1.7, 9.4) - t * 0.009);
    float beam = smoothstep(0.30, 0.95, raysA);
    // beams RESOLVE with distance: angular spokes all converge at the
    // body, joining into a busy knot — near it, melt the fan into its
    // smooth average and let the beams separate further out (scaled by
    // the body's breathing size so low suns keep a clean core too)
    beam = mix(0.45, beam, smoothstep(0.05 * uGlowSize, 0.22 * uGlowSize, dr));
    float k = uRays * beam * exp(-dr * uRayLook.y);
    col += uGlowCol * k * (1.0 - col);
  }

  // distant rain shafts: soft precipitation curtains hanging from the cloud
  // base at the top of the frame, dissolving as they fall. Three motions,
  // all whisper-slow: lateral drift with the wind, edge billow, and an
  // internal downward creep inside each curtain.
  if (uPrecip.x + uPrecip.y > 0.001){
    float fall = t * uPrecip.z;
    float drop = 1.0 - uv.y;                                  // 0 at cloud base
    float slant = uDrift.x * 0.22;
    float xs = p.x - drop * slant - fall * 0.010 * uDrift.x;

    // curtain envelope: coverage knob widens the columns
    float wob = (vnoise(vec2(xs * 2.2, drop * 1.4 + t * 0.02)) - 0.5) * 0.35;
    float env = vnoise(vec2((xs + wob) * 2.6, 3.7 + t * 0.006));
    float lo = 0.55 - uShaft.y * 0.28;
    float shaft = smoothstep(lo, lo + 0.32, env);

    // internal striation creeping downward
    float stria = vnoise(vec2(xs * 13.0, (uv.y + fall * 0.06) * 3.0));
    shaft *= 0.65 + 0.35 * smoothstep(0.25, 0.85, stria);

    // attached to the top; reach knob sets how far down before dissolving
    float fl = 0.75 - uShaft.z * 0.75;
    float vfade = smoothstep(fl, fl + 0.60, uv.y);

    // the curtain's contrast ADAPTS to the sky behind it: against a dark
    // rainy sky it's a touch brighter (the original tuning); against the
    // v2 bright deck it goes DARKER — real rain curtains read as dark
    // veils on a bright lid. Fixes shafts vanishing bright-on-bright.
    vec3 mid = mix(uC1, uC2, 0.5);
    float midL = dot(mid, vec3(0.299, 0.587, 0.114));
    float brightSky = smoothstep(0.50, 0.62, midL);
    vec3 mist = mix(mid, vec3(midL), 0.5) * mix(1.10, 0.76, brightSky)
              + vec3(0.04 * (1.0 - brightSky));
    vec3 mistR = min(mist * vec3(0.92, 0.96, 1.03), vec3(1.0));  // rain: cool gray
    vec3 mistS = min(mix(mist, vec3(0.94, 0.95, 0.97), 0.55), vec3(1.0));
    col = mix(col, mistR, clamp(shaft * vfade * 0.55 * uPrecip.x * uShaft.x, 0.0, 1.0));
    col = mix(col, mistS, clamp(shaft * vfade * 0.60 * uPrecip.y * uShaft.x, 0.0, 1.0));
  }

  // whisper of a vignette
  float vd = length((uv - 0.5) * vec2(uRes.x / uRes.y, 1.0));
  col *= 1.0 - 0.20 * smoothstep(0.6, 1.3, vd);

  // owner color LUT: the Lightroom grade, applied to the finished frame
  // BEFORE the grain/dither (grain rides on top; dither still fights
  // any banding the grade introduces). 33³ strip, two slice taps + mix.
  if (uLutAmt > 0.001){
    vec3 lc = clamp(col, 0.0, 1.0);
    float b33 = lc.b * 32.0;
    float sl0 = floor(b33);
    float sl1 = min(sl0 + 1.0, 32.0);
    vec2 luv0 = vec2((sl0 * 33.0 + lc.r * 32.0 + 0.5) / 1089.0, (lc.g * 32.0 + 0.5) / 33.0);
    vec2 luv1 = vec2((sl1 * 33.0 + lc.r * 32.0 + 0.5) / 1089.0, (lc.g * 32.0 + 0.5) / 33.0);
    vec3 graded = mix(texture2D(uLut, luv0).rgb, texture2D(uLut, luv1).rgb, b33 - sl0);
    col = mix(col, graded, uLutAmt);
  }

  // NIGHT FLOOR (owner, 2026-09-22): the deepest night never falls to
  // black. A screen-lift toward a very dark blue, zenith→horizon, applied
  // AFTER the vignette and the LUT (which push below the grade's own
  // linear floor) and before the grain. The CPU gates it to night, so by
  // day both colors are zero and this is a no-op.
  vec3 nf = mix(uFloorH, uFloorZ, clamp(uv.y, 0.0, 1.0));
  col = nf + col * (1.0 - nf);

  // static photographic grain: three decorrelated taps averaged toward a
  // gaussian, like Photoshop's monochromatic noise (x1.7 restores strength)
  float gn = (hash(gl_FragCoord.xy)
            + hash(gl_FragCoord.xy + 17.13)
            + hash(gl_FragCoord.xy + 41.77)) / 3.0;
  col += (gn - 0.5) * uGrain * 1.7;
  col += (hash(gl_FragCoord.xy * 1.7 + 31.0) - 0.5) * (1.6 / 255.0);

  gl_FragColor = vec4(col, uAlpha);
}
`;

/* ==== COLOR LUT (owner-graded in Lightroom) =========================
   The final taste layer: a 33³ lattice applied to the finished frame
   just before the film grain. The owner grades out/lut-tuning-sheet.png
   (real sky moments + an identity HALD tile) with GLOBAL adjustments;

/* ---------- WebGL setup ---------- */
const canvas = $('#gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' })
        || canvas.getContext('experimental-webgl');
let U = null;

function makeShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader error');
  return s;
}
function initGL(){
  const prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link error');
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  U = {};
  ['uRes','uDet','uTime','uC0','uC1','uC2','uC3','uGlowPos','uGlowCol','uGlow','uGlowSize','uDensity','uWarp','uGrain','uDrift','uPrecip','uShaft','uFog','uMilk','uDeck','uPuff','uNight','uHaze','uSquash','uTint','uRays','uRayLook','uHalo','uHaloLook','uLut','uLutAmt','uTexV','uCirA','uCirB','uSun','uPolar','uAureole','uWhiten','uPurple','uCrep','uLit','uTintHi','uFloorZ','uFloorH','uDogs','uCorona','uAlpha']
    .forEach(n => { U[n] = gl.getUniformLocation(prog, n); });

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);   // crossfade compositing

  /* color LUT texture on unit 1 — identity until an owner grade lands.
     NPOT strip (1089×33): CLAMP_TO_EDGE + LINEAR, no mips (WebGL1 rule). */
  const lutTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, lutTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1089, 33, 0, gl.RGBA, gl.UNSIGNED_BYTE, identityLutPixels());
  gl.uniform1i(U.uLut, 1);
  gl.activeTexture(gl.TEXTURE0);
  if (LUT_PNG) loadLut(lutTex);
}

/* the identity 33³ strip: LUT(r,g,b) = (r,g,b) */
function identityLutPixels(){
  const px = new Uint8Array(1089 * 33 * 4);
  for (let b = 0; b < 33; b++)
    for (let g = 0; g < 33; g++)
      for (let r = 0; r < 33; r++){
        const i = ((g * 1089) + b * 33 + r) * 4;
        px[i] = Math.round(r / 32 * 255);
        px[i + 1] = Math.round(g / 32 * 255);
        px[i + 2] = Math.round(b / 32 * 255);
        px[i + 3] = 255;
      }
  return px;
}

/* the baked owner LUT: upload to the texture + keep the pixels so the
   CPU status mirror (pill dot, glass light/dark switching) sees the
   same grade the GPU shows */
let lutData = null;   // Uint8ClampedArray of the 1089×33 strip, or null
function loadLut(tex){
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = 1089; c.height = 33;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      lutData = ctx.getImageData(0, 0, 1089, 33).data;
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
      gl.activeTexture(gl.TEXTURE0);
      tick();
    } catch (e) { toast('LUT failed to load'); }
  };
  img.src = LUT_PNG;
}

/* CPU mirror of the FRAG's LUT lookup (bilinear in-slice + slice mix) */
function lutJS(col){
  if (!lutData || state.lutAmt <= 0.001) return col;
  const lc = col.map(v => clamp(v, 0, 1));
  const samp = (r, g, sl) => {
    const x = sl * 33 + r * 32, y = g * 32;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const x1 = Math.min(x0 + 1, sl * 33 + 32), y1 = Math.min(y0 + 1, 32);
    const fx = x - x0, fy = y - y0;
    const p = (xx, yy, ch) => lutData[(yy * 1089 + xx) * 4 + ch] / 255;
    return [0, 1, 2].map(ch =>
      (p(x0, y0, ch) * (1 - fx) + p(x1, y0, ch) * fx) * (1 - fy)
      + (p(x0, y1, ch) * (1 - fx) + p(x1, y1, ch) * fx) * fy);
  };
  const b33 = lc[2] * 32;
  const s0 = Math.floor(b33), s1 = Math.min(s0 + 1, 32);
  const a = samp(lc[0], lc[1], s0), b = samp(lc[0], lc[1], s1);
  const fb = b33 - s0;
  return col.map((v, i) => v + (a[i] + (b[i] - a[i]) * fb - v) * state.lutAmt);
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
/* the detail unit (device px) for a canvas of w×h — see state.scene:
   the tighter of the height and the width ÷ reference aspect */
function detUnit(w, h){
  const keep = w / Math.max(0.1, state.scene.aspect);          // the unit that keeps the composition in frame
  const unit = keep + (h - keep) * clamp(state.scene.crop, 0, 1);   // slide toward the height rule = crop a little
  return Math.max(1, Math.min(h, unit));
}

const MILKY = [0.88, 0.90, 0.93];
/* condition profiles per WMO weather code:
   sat, bright, gray, lift(toward milk), dens(cloud density delta),
   glow(sun visibility), tint(rgb multiplier) */
function condProfile(code){
  const P = (sat, bright, gray, lift, dens, glow, tint) =>
    ({ sat, bright, gray, lift, dens, glow, tint: tint || [1, 1, 1] });
  if (code === 0)                  return P(1.05, 1.02, 0.00, 0.00, -0.14, 1.20);
  if (code === 1)                  return P(1.00, 1.00, 0.03, 0.00,  0.00, 1.05);
  if (code === 2)                  return P(0.96, 1.00, 0.07, 0.00,  0.14, 0.90);
  if (code === 3)                  return P(0.62, 0.93, 0.32, 0.05,  0.34, 0.35);
  if (code === 45 || code === 48)  return P(0.55, 0.97, 0.30, 0.06,  0.30, 0.15);
  if (code >= 51 && code <= 57)    return P(0.62, 0.88, 0.30, 0.03,  0.28, 0.30, [0.96, 0.98, 1.03]);
  if (code >= 61 && code <= 67)    return P(0.55, 0.80, 0.34, 0.00,  0.38, 0.20, [0.93, 0.97, 1.06]);
  if ((code >= 71 && code <= 77) || code === 85 || code === 86)
                                   return P(0.50, 1.08, 0.30, 0.24,  0.30, 0.30, [0.98, 1.00, 1.04]);
  if (code >= 80 && code <= 82)    return P(0.55, 0.82, 0.32, 0.00,  0.36, 0.22, [0.94, 0.97, 1.05]);
  if (code >= 95)                  return P(0.55, 0.66, 0.30, 0.00,  0.52, 0.12, [0.92, 0.95, 1.05]);
  return P(1, 1, 0, 0, 0, 1);
}

/* condition simulator: chip label -> WMO code, plus a plausible cloud cover */
const SIMS = [

  ['Drizzle', 53], ['Rain', 63], ['Snow', 73], ['Storm', 95]

const SIM_CLOUD = { 0: 6, 1: 25, 2: 45, 3: 96, 45: 100, 53: 88, 63: 92, 73: 90, 95: 95 };
const SIM_WIND  = { 0: 6, 1: 8, 2: 10, 3: 12, 45: 3, 53: 12, 63: 18, 73: 14, 95: 38 };

   dismissed by pressing the Live chip (= "conditions really live now") */
/* CLOUD FLOOR (owner, 2026-09-22): the sky is never rendered dead clear —
   whatever the feed, chip or slider says, at least 7% cover so a few
   wisps always drift through. Applies to every consumer (deck, tint,
   godrays, halo gates, lighting rules) and to the status echo, so the
   panel shows what is rendered. */
const CLOUD_MIN = 7;
const effCloud = () => Math.max(CLOUD_MIN,
                       state.cloudSim !== null ? state.cloudSim
                     : state.sim !== null ? SIM_CLOUD[state.sim]
                     : (!state.live && state.stagedCloud) ? 42 : state.cloud);
const effWind  = () => state.windSim !== null ? state.windSim
                     : state.sim === null ? state.wind : SIM_WIND[state.sim];
const effAqi   = () => state.aqiSim !== null ? state.aqiSim : state.aqi;

/* aerosol optical depth feeding the V2 sky's haze axis. Simulated air
   (AQI slider / condition chips / scenes) must LOOK hazy in the
   gradient, not only in the AQI wash — so sims derive an AOD too.
   Typical per-condition aerosol loads: */
const SIM_AOD = { 0: 0.05, 1: 0.08, 2: 0.12, 3: 0.2, 45: 0.6, 53: 0.25, 63: 0.2, 73: 0.15, 95: 0.3 };
/* US AQI → AOD550 — LATE ONSET by design (owner: air quality shows up
   in the sky at forest-fire levels, not on an ordinary moderate day):
   flat 0.05 through AQI 100, then 150→0.13, 230→0.38, capped 0.55 —
   past the cap the AQI wash's ember carries the drama; an uncapped
   proxy tans the whole midday sky out (the vetoed brown-multiplier
   look). Genuinely measured AOD is not capped. */
const aodFromAqi = a => Math.min(0.55, 0.05 + 1.15 * Math.pow(clamp(a - 100, 0, 400) / 300, 1.5));
const effAod = () => {
  if (state.aodSim !== null) return state.aodSim;   // manual haze wins outright
  const simA = state.sim !== null ? (SIM_AOD[state.sim] != null ? SIM_AOD[state.sim] : 0.12) : null;
  const aqiA = state.aqiSim !== null ? aodFromAqi(state.aqiSim) : null;
  if (simA !== null || aqiA !== null) return Math.max(simA || 0, aqiA || 0);

    /* …but DEEP NIGHT gets its wisps back: the night gradient is the
       gentle floor ramp — banks are impossible there, and the drifting
       gray-blue night clouds are a beloved part of the design */
    densScale = Math.max(densScale, 0.8 * smooth01((-sunElevDeg - 12) / 6));
    /* night clouds are LIT clouds — an additive dim veil (the beloved
       navy wisps), fading in once the sun is truly down. Both puff and
       night scale with the grade's texture vibrancy. */
    const texV = SKY2.GRADE.textureVibrancy != null ? SKY2.GRADE.textureVibrancy : 1;
    puffU *= texV;
    nightU = 0.6 * smooth01((-sunElevDeg - 10) / 6) * wC * texV;
    /* atmospheric perspective (owner): the lower sky whitens/brightens
       with distance — a little even on a clear day, more under
       scattered/broken cover, damped once a full deck owns the scene
       (the CIE lid keeps zenith > horizon). Day only: the night floor
       stays dark. */
    hazeU = (0.12 + 0.30 * smooth01((cloud - 8) / 45) * (1 - 0.55 * deckU)
                  * (code <= 2 ? 0.5 : 1))   // the code says sun: less white wash
          * smooth01((sunElevDeg - 2) / 8) * wC;
    cols = SKY2.cloudDeck(cols, amt, dk);
    if (lift > 0.001) cols = cols.map(c => lerp3(c, MILKY, lift).map(v => clamp(v, 0, 1)));
  }

  /* 4 — air quality. V2: ordinary air is ALL physics — the AOD axis
     carries the haze and the wash contributes NOTHING below AQI 150.
     Genuinely smoky air (forest-fire territory) reads as LIGHT, not
     dirt: an ember warmth that lives where the sun is low — smoke
     sunrises and sunsets go red-gold — plus a slight dimming and blue
     loss at midday. The brown SMOKE lerp is gone from V2 (owner:
     "beautifying, not a brown multiplier"). Legacy keeps the original
     wash verbatim for the A/B. */
  const aq = smooth01(clamp((effAqi() - 150) / 250, 0, 1)) * wC;
  if (aq > 0.001){
    {
      /* the ember band: peaks at sunrise/sunset, gone by ~ +25° and
         below −9° (night smoke is just darkness; the mud guard owns
         it). SCREEN-blended so it GLOWS — red-gold light on the
         horizon, never a muddying lerp. Midday smoke is a pure
         neutral dim (the capped AOD axis already pales the blue). */
      const lowSun = Math.exp(-0.5 * Math.pow(sunElevDeg / 11, 2))
                   * smooth01((sunElevDeg + 9) / 7);
      const EMBER = [1.0, 0.40, 0.14];
      const ew = [0.05, 0.13, 0.30, 0.55];      // the ember hugs the horizon
      const dim = 1 - 0.10 * aq;
      cols = cols.map((c, i) => {
        const k = ew[i] * aq * lowSun;
        return c.map((v, j) => {
          const d = clamp(v * dim, 0, 1);
          return clamp(d + EMBER[j] * k * (1 - d), 0, 1);
        });
      });
    }
  }

  /* 4a — daytime warmth guard: with the sun well up, haze near the
     horizon reads WHITE (atmospheric perspective), never brown — the
     LUT's warm aerosol horizon is physically real but reads as dirt
     (owner rule: brown only in genuinely apocalyptic smoke, and even
     that is handled by the neutral noon dim + low-sun ember above).
     Any warm excess in a bright day stop becomes BRIGHTNESS: pulled to
     a slightly lifted neutral of its own luminance. Golden hour is
     exempt (the gate opens above ~10° sun); night belongs to the mud
     guard. V2 only. */
  {
    const highSun = smooth01((sunElevDeg - 10) / 12);
    if (highSun > 0.001){
      cols = cols.map(c => {
        const l = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
        const warm = Math.min(1, Math.max(0, c[0] - c[2] - 0.004) * 40);
        const t = highSun * warm;
        if (t < 0.001) return c;
        const w = Math.min(1, l * 1.04 + 0.02);
        return c.map(v => clamp(v + (w - v) * t, 0, 1));
      });
    }
  }

  /* 4b — skyglow: the place's own light scattered back down — why a
     Manhattan night horizon glows amber while a Wyoming one is ink.
     state.skyglow is measured per place from the Black Marble
     composite (fetchSkyglow); the strength dial scales the whole
     effect. Screen-blended POST-grade like the night floor — the mud
     guard kills warm night tones by design, and city glow is the one
     legitimately warm night light. A cloud lid AMPLIFIES it (the deck
     reflects the city back down), and lights ebb after midnight.
     V2 only; rides the crossfade through cols like everything else. */
  {
    const g = state.skyglow !== null ? state.skyglow : 0.35;  // unknown place: modest suburb
    const nightG = smooth01((-sunElevDeg - 6) / 8);           // civil dusk → full by −14°
    const hh = ((h % 24) + 24) % 24;
    const ebb = 1 - 0.25 * smooth01(Math.min((hh + 1) % 24, 12) / 3.5);  // lights out 23:00→02:30
    const glowN = g * state.skyglowStrength * nightG * (1 + 0.9 * deckU) * ebb;
    if (glowN > 0.001){
      const GC = [1.0, 0.80, 0.58];             // sodium-amber, slightly whitened
      const gw = [0, 0.10, 0.38, 1.0];          // a dome: horizon-weighted, zenith stays dark
      cols = cols.map((c, i) => {
        const k = glowN * gw[i] * 0.55;
        return c.map((v, j) => clamp(v + GC[j] * k * (1 - v), 0, 1));
      });
    }
  }

  /* cloud density: slider x (condition delta + real cloud cover), thickened by haze */
  const dens = clamp(state.density * (1 + wC * (cp.dens + 0.35 * cloud / 100)) * (1 + 0.35 * aq) * densScale, 0.05, 1.8);

  /* glow, faded by clouds & condition, gated by time influence;
     bad air dims the sun and turns it that eerie smoke-orange */
  const sg = skyGlow(h, geo);
  /* V2: the glow takes the sun's transmitted disk color from the same
     atmosphere bake as the gradient — white-gold high, ember at the
     horizon — so the blob and the sky behind it always agree */
  sg.col = SKY2.glowColor(sg.elevDeg, aodNow, sg.isMoon);
  /* §2.6 AEROSOL REDDENING (phenomena plan): the disk table reddens with
     the DISPLAY aerosol axis, which is compressed to keep the gradient
     blue — so a smoky or humid day's sun looked like a clean day's. The
     PHYSICAL excess over that axis, times the sun's air mass (Kasten–
     Young, capped), takes the blue out first (Ångström-like per-channel
     depths) and dims the disk: hazy sunsets go deep red earlier. Applied
     to the disk, the deck tint and the cirrus tint alike. Sun only. */
  let redF = [1, 1, 1];
  if (!sg.isMoon && state.cloudLit.red > 0){
    const e = Math.max(sg.elevDeg, 0.5);
    const amS = Math.min(8, 1 / (Math.sin(e * Math.PI / 180) + 0.15 * Math.pow(e + 3.885, -1.253)));
    const ex = Math.max(0, aodPhys - aodNow) * state.cloudLit.red;
    const K = [0.35, 0.5, 0.7];
    redF = K.map(k => Math.exp(-ex * amS * k));
    sg.col = sg.col.map((v, i) => v * redF[i]);
  }
  const glowMul = lerp(1, cp.glow, wC) * (1 - 0.65 * (cloud / 100) * wC);
  const glowStr = sg.str * glowMul * wT * 0.85 * (1 - 0.55 * aq);
  const glowCol = lerp3(sg.col, [1.0, 0.45, 0.20], 0.7 * aq);

  /* godrays: the beam fan wears the glow's gates (condition, clouds,
     air quality) but carries its OWN elevation shape — the glow's raw
     brightness collapses at low sun, exactly where rays read best.
     Full strength through the golden hour, about half at high noon,
     fading out as the disk crosses the horizon (the afterglow takes
     over). Some cloud gives the beams something to shine past — a
     dead-clear sky keeps a whisper. The moon throws quiet rays. */
  let raysU = 0;
  if (!sg.isMoon){   // godrays belong to the SUN only (owner) — the moon throws none
    const shape = smooth01((sg.elevDeg + 2) / 6)
                * (0.55 + 0.45 * Math.exp(-Math.pow(Math.max(0, sg.elevDeg - 6) / 26, 2)));
    const cloudB = 0.35 + 0.65 * smooth01((cloud - 8) / 30);
    raysU = state.rays.strength * shape * glowMul * wT * (1 - 0.55 * aq) * cloudB;
  }

  /* 5 — clumpy fog: shader mixes toward this milk, pooled in noise banks.
     Milk brightness follows ambient light so night fog is dim, not white */
  const fog = (code === 45 || code === 48 ? 0.72 : 0) * wC;
  const L1 = 0.299 * cols[1][0] + 0.587 * cols[1][1] + 0.114 * cols[1][2];
  const milkL = 0.30 + 0.80 * L1;
  let milk = MILKY.map(v => clamp(v * milkL, 0, 1));

  /* 5a — LOW-SUN CLOUD TINT: clouds are white — neutral, color-faithful
     projection screens — so at low sun they take the TRANSMITTED,
     Rayleigh-reddened beam while the sky beside them stays scattered
     blue. The tint color is the sun's transmitted disk color from the
     same atmosphere bake as the gradient (redder as the sun and the
     haze drop it); a luminance-preserving chromatic multiply keyed to
     the field's bright material. Fades in below ~+8°, hands off to the
     gray dip as the sun crosses the horizon; needs clouds to paint on. */
  let tintU = [1, 1, 1];
  {
    const amt = 0.35 * smooth01((8 - sunElevDeg) / 5)
              * (1 - smooth01(-sunElevDeg / 1.8))
              * smooth01((cloud - 10) / 30) * wC;
    if (amt > 0.001){
      const dc = SKY2.glowColor(sunElevDeg, aodNow, false).map((v, i) => v * redF[i]);
      const dl = Math.max(0.05, 0.299 * dc[0] + 0.587 * dc[1] + 0.114 * dc[2]);
      tintU = dc.map(v => 1 + (v / dl - 1) * amt);
    }
  }
  /* 5a′ — SPLIT TINT (phenomena plan — L&L §4.20): the earth's shadow
     rises after sunset, so low cloud goes gray while high cloud is still
     lit and colored. Shadow height at depression α is R(1 − cos α): a
     1.5 km deck is dark by ≈1.2° (the gray dip above), 10 km cirrus stays
     lit to ≈3.2°. The cirrus tint keeps the deck's ramp-in and holds on
     past the deck's hand-off; the strands wear it in their overlay color. */
  let tintHiU = [1, 1, 1];
  if (state.cloudLit.hiTint > 0){
    const amtH = 0.35 * state.cloudLit.hiTint * smooth01((8 - sunElevDeg) / 5)
               * (1 - smooth01((-sunElevDeg - 3.2) / 1.8)) * wC;
    if (amtH > 0.001){
      const dh = SKY2.glowColor(Math.max(sunElevDeg, -2), aodNow, false).map((v, i) => v * redF[i]);
      const dlh = Math.max(0.05, 0.299 * dh[0] + 0.587 * dh[1] + 0.114 * dh[2]);
      tintHiU = dh.map(v => 1 + (v / dlh - 1) * amtH);
    }
  }

  /* 5b — TWILIGHT AFTERGLOW (Lynch & Livingston): two acts keyed to
     solar depression, in reverse before sunrise for free.
     Act 1, the gray dip (≈0…−2.5°): sunset light reaches clouds by
     skimming the murky boundary layer — the cloud material goes dim,
     flat gray while the sky behind is still bright.
     Act 2, the re-illumination (≈−2.5…−5.5°, dead by −7°): the light
     path lifts above the murk — long, clean, strongly reddened — and
     the same clouds re-ignite in rose, MORE vivid than before sunset.
     Painted as an additive lift on the cloud field (the night veil's
     channel, rose-tinted milk), so it needs clouds to paint on; the
     veil's upward weighting sweeps it through the deck. All three
     carriers (milk, puff, night) are crossfade-wired frame params. */
  {
    const dep = -sunElevDeg;
    const dip = smooth01((dep + 0.5) / 1.5) * (1 - smooth01((dep - 2.0) / 1.0));
    const aglow = smooth01((dep - 2.2) / 1.3) * (1 - smooth01((dep - 5.5) / 1.7));
    if (dip > 0.001){
      const mL = 0.299 * milk[0] + 0.587 * milk[1] + 0.114 * milk[2];
      milk = milk.map(v => clamp((v + (mL - v) * 0.6 * dip) * (1 - 0.22 * dip), 0, 1));
      puffU *= 1 - 0.35 * dip;
    }
    if (aglow > 0.001){
      const k = aglow * smooth01((cloud - 5) / 35) * wC;   // needs clouds to paint on
      if (k > 0.001){
        /* the re-lit clouds wear a blend of rose and THE SKY'S OWN
           mid-horizon hue, at reduced strength — so they sit IN the
           dusk, tinted by it, instead of glowing white on top of it
           (owner: sunset clouds were a little too bright/white) */
        const h2 = cols[2];
        const hL = Math.max(0.05, 0.299 * h2[0] + 0.587 * h2[1] + 0.114 * h2[2]);
        const TINT = [1.0, 0.58, 0.52].map((v, i) =>
          clamp(v * 0.6 + (h2[i] / hL) * 0.9 * 0.4, 0, 1.0));
        milk = milk.map((v, i) => clamp(v * (1 - 0.45 * k) + TINT[i] * 0.50 * k, 0, 1));
        const tV = SKY2.GRADE.textureVibrancy != null ? SKY2.GRADE.textureVibrancy : 1;
        nightU = Math.max(nightU, 0.38 * k * tV * state.afterglow.lift);   // lift dial: owner tones the re-lit brightness
      }
    }
  }

  /* 6 — precipitation: rain veils, snow flecks, hail = fast bright flecks */
  let pRain = 0, pSnow = 0, pSpd = 1;
  if (code >= 51 && code <= 55){ pRain = 0.35; pSpd = 0.7; }
  else if (code === 56 || code === 57){ pRain = 0.30; pSnow = 0.25; pSpd = 0.7; }
  else if (code >= 61 && code <= 65){ pRain = 0.60; }
  else if (code === 66 || code === 67){ pRain = 0.50; pSnow = 0.30; }
  else if (code >= 71 && code <= 77){ pSnow = 0.70; }
  else if (code === 85 || code === 86){ pSnow = 0.85; pSpd = 1.3; }
  else if (code >= 80 && code <= 82){ pRain = 0.75; pSpd = 1.3; }
  else if (code >= 95){ pRain = 0.90; pSpd = 1.6; if (code >= 96) pSnow = 0.25; }
  const precip = [pRain * wC, pSnow * wC, pSpd];

  /* 22° solar halo — DEFAULT-ON by owner decree: the halo is present
     essentially whenever the sun is, and only dies when the sky is
     genuinely shut — near-solid overcast, a true lid, wet weather,
     dirty air, night. (The old "icy thin cloud character" gates scored
     a marine-layer SF partly at ~0.03 — invisible.) sunVis alone keeps
     it off at night and in the moon regime (moon halo: later). The
     aerosol gate reads the PHYSICAL estimate — the display axis is
     compressed and would never reach the threshold. Force pins to 100%
     for tuning: weather bypassed, the sun-up fade stays. */
  let haloU = 0, haloGate = 0;   // haloGate: the weather gate alone (the sundogs ride it too)
  {
    const sunVis = smooth01((sunElevDeg + 2) / 6);
    const band = 1 - smooth01((cloud - 75) / 20);          // full until 75% cover
    const deckG = 1 - smooth01((deckU - 0.30) / 0.30);     // sunny-code cap passes free
    const aodG = 1 - smooth01((aodPhys - 0.35) / 0.45);
    const wet = (fog > 0 || pRain + pSnow > 0) ? 0 : 1;
    haloGate = band * aodG * deckG * wet * wC * (1 - 0.55 * aq);
    haloU = state.halo.strength * sunVis * (state.halo.force ? 1 : haloGate);
  }

  /* SUNDOGS (phenomena plan — L&L §5.8): the plate-crystal separation
     D(h) = 2·asin(√(n² − sin²h) / (2 cos h)) − 60°, n = 1.31 — 21.8° at
     the horizon, ~25° at 20°, ~36° at 40°, impossible past ≈61° — mapped
     onto the halo's own angular scale (radius = 22°). Strongest at a low
     sun, fading as it climbs; the halo's weather gate, with a preference
     for real high cloud when the feed reports it. Sun only. */
  let dogsU = [0, 0, 0];
  if (!sg.isMoon && sunElevDeg > -1){
    const hD = Math.max(sunElevDeg, 0) * Math.PI / 180;
    const sh = Math.sin(hD), ch = Math.cos(hD);
    const arg = Math.sqrt(1.7161 - sh * sh) / (2 * ch);
    if (arg < 1){
      const D = 2 * Math.asin(arg) * 180 / Math.PI - 60;
      const perDeg = state.halo.radius / 22;
      const shape = smooth01((sunElevDeg + 1) / 3) * (1 - smooth01((sunElevDeg - 15) / 40));
      const ice = state.cloudHigh !== null ? 0.5 + 0.5 * smooth01((state.cloudHigh - 10) / 40) : 0.75;
      const gateD = state.dogs.force ? 1 : haloGate * ice;
      dogsU = [state.dogs.strength * shape * gateD, D * perDeg, state.dogs.tail * perDeg];
    }
  }

  /* CORONA (phenomena plan — L&L §4.13): needs a THIN cloud in front of
     the body — some cover but no lid, mid layer preferred when known,
     dry — and favors the moon (a brighter moon, a clearer corona); by
     day the sun's glare leaves a faint aureole. The ring's radius is the
     dial jittered ±25% by the day seed, standing in for drop size. */
  let coronaU = [0, state.corona.radius * state.halo.radius / 22, state.corona.purity];
  {
    const bodyUp = smooth01((sg.elevDeg - 2) / 5);
    const thinC = smooth01((cloud - 20) / 30) * (1 - smooth01((cloud - 78) / 12));   // some cloud, no lid
    const midC = state.cloudMid !== null ? 0.4 + 0.6 * smooth01((state.cloudMid - 10) / 40) : 0.7;
    const dryC = (fog > 0 || pRain + pSnow > 0) ? 0 : 1;
    const body = sg.isMoon ? (0.3 + 0.7 * moonIllum()) : 0.35;
    const gateC = state.corona.force ? 1 : thinC * (1 - deckU) * midC * dryC * wC;
    const rad = state.corona.radius * (0.75 + 0.5 * seed[3]) * state.halo.radius / 22;
    coronaU = [state.corona.strength * bodyUp * body * gateC, rad,
               state.corona.purity * (sg.isMoon ? 1 : 0.4)];
  }

  /* clear-sky plumbing (phenomena plan, step 0): turbidity + the day
     seed are computed for every frame and exposed in status; the
     POLARIZER BAND is their first consumer. The FRAG owns the geometry;
     the CPU owns the gates — daylight (a blue-sky effect: in by +2°,
     gone below −6°, where the LUT's own deep twilight zenith takes
     over), turbidity (haze depolarizes: a hazy day flattens the arc),
     no deck to polarize, the AQI wash, the weather influence. Force pins
     the dial value for tuning (the daylight fade stays). Sun only. */
  const turbU = turbidity(aodPhys);
  const sunU = sunScreenPos(h, geo, sunElevDeg).concat([sunElevDeg]);   // x, y, true altitude
  let polarU = 0;
  {
    const dayG = smooth01((sunElevDeg + 6) / 8);
    polarU = state.purity.force
      ? state.purity.polarizer * dayG
      : state.purity.polarizer * dayG * (1 - 0.85 * turbU) * (1 - deckU) * (1 - 0.5 * aq) * wC;
  }
  /* aureole (phenomena plan, step 1): the sun-side half of the purity
     map. Turbidity works the OTHER way here — haze feeds forward
     scattering, so a hazy day gets a stronger, WIDER aureole (base
     half-width = the dial, +22° at full turbidity, a little wider again
     at low sun where the beam crosses more air). Sun only; no deck to
     scatter in; the daylight fade shared with the band. Force pins the
     dial (pristine width). */
  let aureoleU = [0, state.purity.aureoleWidth];
  {
    const dayG = smooth01((sunElevDeg + 6) / 8);
    if (state.purity.force){
      aureoleU = [state.purity.aureole * dayG, state.purity.aureoleWidth];
    } else {
      const lowSun = 1 - smooth01(sunElevDeg / 30);
      aureoleU = [state.purity.aureole * dayG * (0.6 + 0.8 * turbU) * (1 - deckU) * wC,
                  state.purity.aureoleWidth + 22 * turbU + 6 * lowSun];
    }
  }
  /* horizon whitening (phenomena plan, step 1): uWhiten is the aerosol
     optical depth per air mass the FRAG saturates with. Turbidity IS the
     signal — a pristine day gets only a whisper (0.2 floor, so the dial
     reads on an ordinary day too), full haze the whole 0.29/air mass
     (the FRAG's soft horizon reads the air-mass curve at ~2°, ≈19.5
     air masses, so 0.29 there ≈ the old 0.15 × 38: saturated at the
     horizon line, ~30% at 30° up). Shares the daylight fade; no deck to
     whiten under. Force = dial at full turbidity. */
  let whitenU = 0;
  {
    const dayG = smooth01((sunElevDeg + 6) / 8);
    whitenU = state.purity.force
      ? 0.29 * state.purity.horizon * dayG
      : 0.29 * state.purity.horizon * (0.2 + 0.8 * turbU) * dayG * (1 - deckU) * wC;
  }
  /* clear-sky twilight (phenomena plan, step 2). PURPLE LIGHT: timed on
     the REAL sun (the book's clock: rises past −2.5°, full −4.5…−6°,
     gone by −8.5°), scaled by the month's stratospheric dust (monthSeed:
     ~a quarter of months have none, the rest graded), wanting an open
     twilight sky (cover, deck). CREPUSCULAR FAN: rides the purple gate
     (structural pairing) × the clouds that could be casting — real
     low/total cover as a hint plus the day seed for the ones beyond the
     horizon nobody can see. Force pins both dials (dust 1, casting 1). */
  const dep = -sunElevDeg;
  const purpW = smooth01((dep - 2.5) / 2.0) * (1 - smooth01((dep - 6.0) / 2.5));
  const dust = smooth01((monthSeed() - 0.25) / 0.55);
  let purpleU = [0, state.purity.purpleHeight, state.purity.purpleWidth];
  let crepU = 0;
  if (purpW > 0.001){
    const open = (1 - deckU) * (1 - 0.7 * smooth01((cloud - 30) / 50)) * wC;
    const casting = 0.5 * smooth01((seed[0] - 0.3) / 0.5) + 0.5 * smooth01((cloud - 15) / 45);
    if (state.purity.force){
      purpleU[0] = state.purity.purple * purpW;
      crepU = state.purity.crep * purpW;
    } else {
      purpleU[0] = state.purity.purple * purpW * dust * open;
      crepU = state.purity.crep * purpW * dust * open * casting;
    }
  }

  /* CLOUD LIGHTING gates (phenomena plan — §4.18–4.19, §2.6 airlight):
     thin/back-light are daylight rules that need cloud to act on; the
     airlight bias belongs to the low sun and shares the daylight fade. */
  let litU = [0, 0, 0];
  {
    const cl = state.cloudLit;
    const cloudy = 0.3 + 0.7 * smooth01((cloud - 10) / 40);
    const dayL = smooth01((sunElevDeg + 1) / 4);
    const lowSunL = 1 - smooth01(sunElevDeg / 12);
    litU = [cl.thin * dayL * cloudy * wC,
            cl.back * dayL * cloudy * wC,
            cl.airlight * lowSunL * smooth01((sunElevDeg + 6) / 8)];
  }

  /* NIGHT FLOOR colors (display sRGB) × the night gate: in from −6°, full
     by −12°, so twilight keeps its own colors and the floor owns the
     moonless small hours. Zenith darker than horizon, blue-leaning. */
  const nightG = smooth01((-sunElevDeg - 6) / 6);
  const ft = clamp(state.night.floor, 0, 1);
  const floorZ = lerp3([0.020, 0.028, 0.060], [0.090, 0.120, 0.290], ft).map(v => v * nightG);
  const floorH = lerp3([0.030, 0.042, 0.085], [0.125, 0.165, 0.340], ft).map(v => v * nightG);

  /* wind: clouds advect downwind; stronger wind = faster drift.
     Gated by the Weather influence; at 0 it keeps a fixed gentle heading. */
  const th = (state.windDir + 180) * Math.PI / 180;     // blowing toward (compass)
  let dx = lerp(0.86, Math.sin(th), wC);
  let dy = lerp(0.50, Math.cos(th), wC);
  const dn = Math.hypot(dx, dy) || 1;
  const wMag = lerp(1, 0.55 + 1.25 * smooth01(effWind() / 45), wC);
  const drift = [dx / dn * wMag, dy / dn * wMag];

  return { cols, dens, glowPos: sg.pos, glowCol, glowStr, glowSize: sg.size || 1,
           drift, precip, fog, milk,
           deck: deckU, puff: puffU, night: nightU, haze: hazeU, squash: squashU,
           tint: tintU, rays: raysU, halo: haloU,
           sun: sunU, polar: polarU, aureole: aureoleU, whiten: whitenU,
           purple: purpleU, crep: crepU, dust, turb: turbU, seed,
           lit: litU, tintHi: tintHiU, redF, floorZ, floorH, dogs: dogsU, corona: coronaU };
}

/* ============================================================
   Render loop
   ============================================================ */
let slowT = Math.random() * 100;
let last = performance.now();

/* ============================================================
   Crossfade transitions: when the sky's target changes by more
   than a whisper (new location, chip, weather refresh), the old
   scene is frozen as-is and the new one dissolves in over it —
   a straight image crossfade, nothing slides or scrolls.
   Ambient evolution (time creeping forward) stays continuous.
   ============================================================ */
const FADE_DUR = 2.5;      // seconds for a full dissolve
const FADE_EPS = 0.02;     // change threshold that triggers a fade
let fadePrev = null, fadeP = 0, lastTarget = null;
/* skies frozen part-way in, each at the opacity it had reached, drawn
   between fadePrev and the incoming sky (see rebaseFade) */
let fadeHeld = [];
const FADE_HELD_MAX = 3;   // layers kept; a deeper stack folds its oldest into fadePrev

/* A jump that lands mid-dissolve restarts from what is on screen: the
   half-arrived sky is frozen as a layer at its current opacity, and the
   new sky dissolves in over the whole composite from zero. */
function rebaseFade(){
  if (!fadePrev || !lastTarget) return;
  fadeHeld.push({ f: lastTarget, a: smooth01(fadeP) });
  if (fadeHeld.length > FADE_HELD_MAX) fadePrev = fadeHeld.shift().f;
  fadeP = 0;
}

const cloneFrame = f => ({
  cols: f.cols.map(c => c.slice()), dens: f.dens,
  glowPos: f.glowPos.slice(), glowCol: f.glowCol.slice(), glowStr: f.glowStr,
  glowSize: f.glowSize,
  drift: f.drift.slice(), precip: f.precip.slice(),
  fog: f.fog, milk: f.milk.slice(), deck: f.deck, puff: f.puff, night: f.night,
  haze: f.haze, squash: f.squash, tint: f.tint.slice(), rays: f.rays, halo: f.halo,
  sun: f.sun.slice(), polar: f.polar, aureole: f.aureole.slice(), whiten: f.whiten,
  purple: f.purple.slice(), crep: f.crep, dust: f.dust, turb: f.turb, seed: f.seed.slice(),
  lit: f.lit.slice(), tintHi: f.tintHi.slice(), redF: f.redF.slice(),
  floorZ: f.floorZ.slice(), floorH: f.floorH.slice(), dogs: f.dogs.slice(), corona: f.corona.slice()
});
function frameDist(a, b){
  let d = 0;
  for (let i = 0; i < 4; i++)
    for (let j = 0; j < 3; j++) d += Math.abs(a.cols[i][j] - b.cols[i][j]);
  for (let j = 0; j < 3; j++)
    d += Math.abs(a.glowCol[j] - b.glowCol[j]) * 0.5 + Math.abs(a.precip[j] - b.precip[j]);
  for (let j = 0; j < 2; j++)
    d += Math.abs(a.glowPos[j] - b.glowPos[j]) * 2 + Math.abs(a.drift[j] - b.drift[j]);
  for (let j = 0; j < 3; j++) d += Math.abs(a.milk[j] - b.milk[j]) * 0.3
                                 + Math.abs(a.tint[j] - b.tint[j]) * 0.4;
  return d + Math.abs(a.dens - b.dens) + Math.abs(a.glowStr - b.glowStr) * 1.5
       + Math.abs(a.glowSize - b.glowSize) * 0.3
       + Math.abs(a.fog - b.fog) * 2 + Math.abs(a.deck - b.deck) * 0.8
       + Math.abs(a.puff - b.puff) * 0.8 + Math.abs(a.night - b.night) * 0.8
       + Math.abs(a.haze - b.haze) * 0.8 + Math.abs(a.squash - b.squash) * 0.5
       + Math.abs(a.rays - b.rays) * 0.5 + Math.abs(a.halo - b.halo) * 0.5
       + Math.abs(a.polar - b.polar) * 0.5 + Math.abs(a.aureole[0] - b.aureole[0]) * 0.5
       + Math.abs(a.whiten - b.whiten) * 3
       + Math.abs(a.purple[0] - b.purple[0]) * 0.8 + Math.abs(a.crep - b.crep) * 0.5
       + Math.abs(a.lit[0] - b.lit[0]) * 0.5 + Math.abs(a.lit[1] - b.lit[1]) * 0.5
       + Math.abs(a.tintHi[0] - b.tintHi[0]) * 0.4 + Math.abs(a.tintHi[2] - b.tintHi[2]) * 0.4
       + Math.abs(a.floorZ[2] - b.floorZ[2]) * 2
       + Math.abs(a.dogs[0] - b.dogs[0]) * 0.5 + Math.abs(a.corona[0] - b.corona[0]) * 0.5;
}

function drawParams(f, alpha){
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uDet, detUnit(canvas.width, canvas.height));
  gl.uniform1f(U.uTime, slowT);
  gl.uniform1f(U.uAlpha, alpha);
  gl.uniform3f(U.uC0, f.cols[0][0], f.cols[0][1], f.cols[0][2]);
  gl.uniform3f(U.uC1, f.cols[1][0], f.cols[1][1], f.cols[1][2]);
  gl.uniform3f(U.uC2, f.cols[2][0], f.cols[2][1], f.cols[2][2]);
  gl.uniform3f(U.uC3, f.cols[3][0], f.cols[3][1], f.cols[3][2]);
  gl.uniform2f(U.uGlowPos, f.glowPos[0], f.glowPos[1]);
  gl.uniform3f(U.uGlowCol, f.glowCol[0], f.glowCol[1], f.glowCol[2]);
  gl.uniform1f(U.uGlow, f.glowStr);
  gl.uniform1f(U.uGlowSize, f.glowSize);
  gl.uniform1f(U.uDensity, f.dens);
  gl.uniform1f(U.uWarp, state.flow);
  gl.uniform1f(U.uGrain, state.grain);
  gl.uniform2f(U.uDrift, f.drift[0], f.drift[1]);
  gl.uniform3f(U.uPrecip, f.precip[0], f.precip[1], f.precip[2]);
  gl.uniform3f(U.uShaft, state.shaftStr, state.shaftCov, state.shaftReach);
  gl.uniform1f(U.uFog, f.fog);
  gl.uniform3f(U.uMilk, f.milk[0], f.milk[1], f.milk[2]);
  gl.uniform1f(U.uDeck, f.deck);
  gl.uniform1f(U.uPuff, f.puff);
  gl.uniform1f(U.uNight, f.night);
  gl.uniform1f(U.uHaze, f.haze);
  gl.uniform1f(U.uSquash, f.squash);
  gl.uniform3f(U.uTint, f.tint[0], f.tint[1], f.tint[2]);
  gl.uniform1f(U.uRays, f.rays);
  gl.uniform2f(U.uRayLook, state.rays.scale, state.rays.falloff);
  gl.uniform1f(U.uHalo, f.halo);
  gl.uniform3f(U.uHaloLook, state.halo.radius, state.halo.dispersion, 1.0);
  gl.uniform1f(U.uLutAmt, state.lutAmt);
  /* grade-shipped texture vibrancy + cirrus look (state-driven, no fade) */
  gl.uniform1f(U.uTexV, SKY2.GRADE.textureVibrancy != null ? SKY2.GRADE.textureVibrancy : 1);
  const ci = state.cirrus;
  gl.uniform4f(U.uCirA, ci.angle * Math.PI / 180, ci.variance * Math.PI / 180, ci.fiber, ci.opacity);
  gl.uniform4f(U.uCirB, ci.cover, ci.evolve, ci.breakDepth, ci.grain);
  /* sun-relative sky geometry + the polarizer band (frame params) */
  gl.uniform3f(U.uSun, f.sun[0], f.sun[1], f.sun[2]);
  gl.uniform1f(U.uPolar, f.polar);
  gl.uniform2f(U.uAureole, f.aureole[0], f.aureole[1]);
  gl.uniform1f(U.uWhiten, f.whiten);
  gl.uniform3f(U.uPurple, f.purple[0], f.purple[1], f.purple[2]);
  gl.uniform2f(U.uCrep, f.crep, state.purity.crepScale);
  gl.uniform3f(U.uLit, f.lit[0], f.lit[1], f.lit[2]);
  gl.uniform3f(U.uTintHi, f.tintHi[0], f.tintHi[1], f.tintHi[2]);
  gl.uniform3f(U.uFloorZ, f.floorZ[0], f.floorZ[1], f.floorZ[2]);
  gl.uniform3f(U.uFloorH, f.floorH[0], f.floorH[1], f.floorH[2]);
  gl.uniform3f(U.uDogs, f.dogs[0], f.dogs[1], f.dogs[2]);
  gl.uniform3f(U.uCorona, f.corona[0], f.corona[1], f.corona[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function drawScene(dt){
  const target = buildFrame();
  if (fadePrev === null && lastTarget && frameDist(target, lastTarget) > FADE_EPS){
    fadePrev = lastTarget;                 // freeze the outgoing sky
    fadeP = 0;
  }
  if (fadePrev){
    fadeP = Math.min(1, fadeP + (dt || 0) / FADE_DUR);
    drawParams(fadePrev, 1.0);             // old sky, still breathing
    for (const h of fadeHeld) drawParams(h.f, h.a);
    drawParams(target, smooth01(fadeP));   // new sky dissolving in over it
    if (fadeP >= 1){ fadePrev = null; fadeHeld = []; }
  } else {
    drawParams(target, 1.0);
  }
  lastTarget = cloneFrame(target);
}

/* The sky drifts at ~one cloud-length per 80 seconds, so repainting it at
   display rate buys nothing the eye can see. What each repaint DOES buy is
   a bill for everything composited above the canvas: every glass surface
   with a backdrop-filter re-resolves whenever its backdrop changes, and
   each pass syncs on this canvas's shared IOSurface (traced as
   WaitForCommandsToBeScheduled stalls dominating rich-content interaction
   frames). Pacing the shader to ~30fps halves that tax at 60Hz and
   quarters it on ProMotion, for the whole app at once. All sky time below
   is dt-based, so skipped frames change pacing only, never the clock; 31ms
   rather than 33 so the gate never beats against a 16.7ms vsync and lands
   on 30fps exactly. */
const FRAME_MIN_MS = 31;
function frame(now){
  if (now - last < FRAME_MIN_MS){ requestAnimationFrame(frame); return; }
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  slowT += dt * state.speed;                       // "1x" ~= one cloud-length per 80s
  /* custom time is not frozen: it keeps flowing at timeFlow × real
     time, so a chosen golden hour actually unfolds (agency request) */
  if (!state.live){
    state.hourOverride = ((state.hourOverride + dt * state.timeFlow / 3600) % 24 + 24) % 24;
  }
  drawScene(dt);
  requestAnimationFrame(frame);
}

  { label: 'MacBook Pro 14\u2033 \u2014 3024\u00D71964', w: 3024, h: 1964, slug: 'macbook-pro-14' },
  { label: 'Studio Display \u2014 5120\u00D72880', w: 5120, h: 2880, slug: 'studio-display' }

function exportPNG(p){
  try {
    const maxRB = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
    if (p.w > maxRB || p.h > maxRB) throw new Error('resolution exceeds this GPU\u2019s limit');

    /* render one frame into a resized backbuffer, read it, restore */
    const pw = canvas.width, ph = canvas.height;
    canvas.width = p.w; canvas.height = p.h;
    gl.viewport(0, 0, p.w, p.h);
    drawScene(0);
    const px = new Uint8Array(p.w * p.h * 4);
    gl.readPixels(0, 0, p.w, p.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    canvas.width = pw; canvas.height = ph;
    gl.viewport(0, 0, pw, ph);

    for (let i = 3; i < px.length; i += 4) px[i] = 255;   // force opaque

    /* GL reads bottom-up; flip rows while packing into a 2D canvas */
    const c2 = document.createElement('canvas');
    c2.width = p.w; c2.height = p.h;
    const ctx = c2.getContext('2d');
    const img = ctx.createImageData(p.w, p.h);
    const row = p.w * 4;
    for (let y = 0; y < p.h; y++){
      img.data.set(px.subarray((p.h - 1 - y) * row, (p.h - y) * row), y * row);
    }
    ctx.putImageData(img, 0, 0);

    const slugify = t => t.toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
    const who = slugify(activeScene ? activeScene.label : state.place);
    const name = 'hark-' + who + '-' + p.slug + '-' + p.w + 'x' + p.h + '.png';
    post({ type: 'png', name, data: c2.toDataURL('image/png').split(',')[1] });
  } catch (e) {
    post({ type: 'pngfail' });
    toast('Export failed \u2014 ' + (e.message || e));
  }
}
