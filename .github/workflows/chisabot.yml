name: ChisaBot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chisabot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-models:
    name: Web, model settings and Magpie catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Hoisted, like the image (Dockerfile): shared/ is not a workspace and imports zod / @json-render
      # from the app and server trees; under the isolated linker those don't resolve from shared/.
      - run: bun install --frozen-lockfile --linker hoisted
      - run: cp .env.example .env
      - run: node scripts/check-zh-localization.cjs
      - run: bun run --cwd server typecheck
      # build first: it regenerates app/src/routeTree.gen.ts, which typecheck reads (the committed copy
      # lags behind new routes because parallel PRs each add their own).
      # Same as the image build (Dockerfile): with the hoisted tree vite sits at the root, and app's own
      # build script names app/node_modules/vite.
      - run: bun run generate:app-config && cd app && bun --bun ../node_modules/vite/bin/vite.js build
      - run: bun run --cwd app typecheck
      - name: Server model, permission and runtime checks
        run: >-
          bun test
          server/tests/config.test.ts
          server/tests/agent-model-policy.test.ts
          server/tests/agent-model-runtime.test.ts
          server/tests/agent-profile-policy.test.ts
          server/tests/agent-resolver.test.ts
          server/tests/agent-routes.test.ts
          server/tests/dynamic-model-runtime.test.ts
          server/tests/model-catalog.test.ts
          server/tests/model-connection-context.test.ts
          server/tests/model-selection-routes.test.ts
          server/tests/model-settings-routes.test.ts
          server/tests/model-settings.test.ts
          server/tests/computer-tool-outcome.test.ts
          server/tests/agent-runtime-connection-refused.test.ts
          server/tests/admin-smoke.test.ts
      # The chat regression set every ChisaBot PR runs on the server (the older model-chooser DOM tests
      # need a live API and never ran here while typecheck was failing; see docs/slimming.md P3).
      - name: Chat UI checks
        working-directory: app
        run: bun test tests/no-group-has.test.ts tests/stopped-turn.test.ts tests/bot-message-list.test.tsx tests/link-cards.test.tsx tests/rich-previews-extract.test.ts tests/ui-align.test.ts tests/connection-drop.test.ts tests/fold-narration.test.ts tests/chat-unify.test.ts tests/turn-unfinished.test.tsx tests/workspace-links.test.ts tests/agent-runtime-unreachable.test.ts
      - name: Request, message identity and persistent queue checks
        working-directory: app
        env:
          NODE_ENV: test
        # Separate test processes keep SDK module registrations and DOM globals isolated.
        run: |
          bun test tests/client-deadline.test.ts tests/computer-tool-refusals.test.ts
          bun test tests/message-node-identity.test.tsx tests/message-blank-release.test.ts
          bun test tests/tail-first-paint.test.ts
          bun test tests/message-scroll-reduced-motion.test.tsx
          bun test tests/thread-inbox-paused.test.tsx tests/thread-inbox-concurrency.test.tsx tests/conversation-sync.test.ts
      - name: Install actual computer service dependencies
        working-directory: agent-computer
        run: bun install --frozen-lockfile
      - name: Durable inbox and database recovery checks
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/openbot_test
          CHISABOT_COMPUTER_STOP_HTTP: "1"
        run: |
          bun test server/tests/database-deadline.integration.test.ts server/tests/database-recovery.test.ts
          bun test server/tests/local-conversations-inbox.integration.test.ts server/tests/thread-inbox-paused.integration.test.ts server/tests/thread-inbox.test.ts
          bun test server/tests/computer-stop.test.ts
      - name: Cloud browser native select (DESIGN.md §100)
        working-directory: agent-computer
        run: bun install --frozen-lockfile && bun test tests/native-select.test.ts tests/aria-snapshot.test.ts
      - name: SSRF red-line (PRD-P1-06)
        run: bun test server/tests/ssrf-redline.test.ts server/tests/guarded-fetch-ssrf.test.ts shared/ops-counters.test.ts shared/ops-codes.test.ts
      - name: Trust-boundary network isolation red-line
        run: bun test shared/trust-boundary.test.ts server/tests/trust-boundary-redline.test.ts
      - name: Log-scrub red-line (PRD-P0-05)
        run: bun test server/tests/log-scrub-redline.test.ts
      - name: Nginx template sync check (apply-or-fail process)
        run: sh scripts/ops/sync-nginx.sh --check-repo
      - name: Schedule honesty / partition (non-tram re-verify)
        run: bun test shared/schedules.test.ts shared/activity-labels.test.ts
      - name: Login gateway checks
        run: bun test deploy/public/auth/server.test.ts deploy/public/auth/startup-report.test.ts
      - name: Claude upstream proxy share-link parser
        run: bun test shared/proxy-links.test.ts
      # Private host info guard. The deny list lives in the repository variable
      # PRIVATE_HOST_DENY (Settings → Secrets and variables → Actions → Variables),
      # deliberately NOT in this file: a guard that spelled out the address would
      # leak the very thing it is meant to keep out, and CI logs for a public repo
      # are public. Semicolon-separated extended-regex alternatives; the variable is
      # never echoed. See CONTRIBUTING.md §2.
      - name: Private host info guard
        env:
          DENY: ${{ vars.PRIVATE_HOST_DENY }}
        run: |
          if [ -z "$(printf '%s' "$DENY" | tr -d '[:space:]')" ]; then
            echo "::warning::PRIVATE_HOST_DENY is not set, so the private host info guard was skipped."
            echo "Set it to a semicolon-separated list of the host identifiers that must never be committed."
            exit 0
          fi
          pattern=$(printf '%s' "$DENY" | tr ';' '|')
          if git grep -nIE "$pattern" -- . ; then
            echo "::error::Tracked files contain private host information. See CONTRIBUTING.md §2."
            exit 1
          fi
          echo "OK: no private host identifiers in tracked files."
