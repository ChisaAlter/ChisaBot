name: ChisaBot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chisabot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-models:
    name: Web, model settings and Magpie catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Match production's PostgreSQL 16 + pgvector (Dockerfile & dsh-runtime): the full
        # migration chain needs `CREATE EXTENSION vector` (drizzle/0000_schema.sql).
        image: pgvector/pgvector:pg16-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chisabot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d chisabot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'agent-computer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # Hoisted, like the image (Dockerfile): shared/ is not a workspace and imports zod / @json-render
      # from the app and server trees; under the isolated linker those don't resolve from shared/.
      - run: bun install --frozen-lockfile --omit=peer --linker hoisted
      - run: cp .env.example .env
      - run: node scripts/check-zh-localization.cjs
      - run: bun run generate:app-config
      - run: bun run --cwd server typecheck
      - name: Architecture, truth and release script guards
        run: >-
          bun test
          app/tests/no-raw-fetch.test.ts
          app/tests/no-group-has.test.ts
          app/tests/no-container-has.test.ts
          app/tests/no-mock-module.test.ts
          app/tests/no-raw-use-effect.test.ts
          server/tests/no-raw-fetch.test.ts
          server/tests/no-raw-env.test.ts
          server/tests/no-unapproved-schema-drop.test.ts
          server/tests/biome-ignore-hygiene.test.ts
          server/tests/docs-truth-guards.test.ts
          server/tests/formal-conversation-locks.test.ts
          server/tests/formal-plugin-grants.test.ts
          server/tests/formal-approval-gate.test.ts
          server/tests/formal-quota-keypool.test.ts
          server/tests/formal-computer-takeover.test.ts
          server/tests/formal-group-relays.test.ts
          server/tests/formal-memory-visibility.test.ts
          server/tests/no-cross-surface-imports.test.ts
          app/tests/formal-chat-ledger.test.ts
          server/tests/verify-ui-driver.test.ts
          scripts/check-release-assets.test.ts
          scripts/test-ci.test.ts
      - name: ChisaBench hot-path budget baseline
        run: bun run bench
      # The DSH → AG-UI projection imports runtime/dsh (its own Node project), so install it first.
      # dsh-* tests are excluded from `bun run test:server`, so these projection suites stay explicit here.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-dsh-${{ hashFiles('runtime/dsh/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-dsh-
      - name: DSH projection checks
        run: |
          npm ci --prefix runtime/dsh --no-audit --no-fund
          bun test server/tests/dsh-loop-stop-projection.test.ts server/tests/dsh-reasoning-projection.test.ts
      - name: Install actual computer service dependencies
        working-directory: agent-computer
        run: bun install --frozen-lockfile --omit=peer
      - run: bun run --cwd agent-computer typecheck
      # Must run before every step that touches chisabot_test: integration tests create
      # their own tables via ensure() (CREATE TABLE IF NOT EXISTS), which would otherwise
      # partially populate the DB and break 0000_schema.sql's bare CREATE TABLEs.
      - name: Migrate test database
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/chisabot_test
        run: bun server/scripts/migrate.ts
      - name: Cloud browser native select (DESIGN.md §100)
        working-directory: agent-computer
        run: bun test tests/native-select.test.ts tests/aria-snapshot.test.ts
      - name: Computer egress floor and screencast
        working-directory: agent-computer
        run: bun test tests/egress-auth.test.ts tests/egress-policy.test.ts tests/egress.test.ts tests/screencast.test.ts tests/webrtc-proxy.test.ts
      # 补齐 agent-computer 无浏览器依赖的单元与隔离防线测试（27 个文件）：
      # 含 23 个跨平台纯单测与 4 个 Linux/POSIX 隔离单测（identity Unix socket、shell /bin/bash、workspace* symlink）。
      # action-barrier.test.ts 与 with-deadline.test.ts 暂不纳入：其源码对唯一定时器调用 timer.unref()，
      # 在 Bun 1.3.14 测试进程无其他 ref 句柄时会永久挂死。
      - name: Computer unit and confinement checks
        working-directory: agent-computer
        run: >-
          bun test
          tests/authorisation.test.ts
          tests/bot-id.test.ts
          tests/browser-eviction.test.ts
          tests/browser-mode.test.ts
          tests/browser-runtime.test.ts
          tests/capture-gate.test.ts
          tests/challenge.test.ts
          tests/control.test.ts
          tests/control-store.test.ts
          tests/demonstration.test.ts
          tests/identity.test.ts
          tests/live-page.test.ts
          tests/local-chrome-startup.test.ts
          tests/navigation-recovery.test.ts
          tests/number-from-env.test.ts
          tests/profile-listing.test.ts
          tests/request-validation.test.ts
          tests/runtime-hardening.test.ts
          tests/sessions.test.ts
          tests/shell.test.ts
          tests/site-block.test.ts
          tests/stream-keepalive.test.ts
          tests/viewer.test.ts
          tests/virtual-display.test.ts
          tests/workspace.test.ts
          tests/workspace-download.test.ts
          tests/workspace-origin.test.ts
      - name: Nginx template sync check (apply-or-fail process)
        run: sh scripts/ops/sync-nginx.sh --check-repo
      - name: Login gateway and nginx render checks
        run: >-
          bun test
          deploy/public/auth/server.test.ts
          deploy/public/auth/accounts.test.ts
          deploy/public/auth/startup-report.test.ts
          deploy/public/render-nginx.test.ts
      - name: Updater, backup and resource pinning checks (CB-100b)
        run: |
          for f in deploy/updater/*.sh; do bash -n "$f"; done
          for f in scripts/ops/*.sh deploy/pin-resources.sh deploy/install-updater.sh; do sh -n "$f"; done
          bash deploy/updater/test-shell.sh
          bash deploy/updater/test-dsh-release.sh
          bash deploy/updater/test-complete-backup.sh
          (
            mkdir -p work
            trap 'rmdir work 2>/dev/null || true' EXIT
            bash deploy/updater/test-host-monitor.sh
            bash deploy/updater/test-host-monitor.sh --signals
          )
          node --test deploy/pin-resources.test.mjs deploy/updater/accounts-release.test.mjs deploy/updater/backup-config.test.mjs deploy/updater/backup-state.test.mjs
          python3 -m unittest discover -s deploy/updater -p "test_*.py"
      # Full server/shared suite (runs every server/tests/*.test.ts & shared/**/*.test.ts
      # minus dsh-* which runs in dsh-runtime and scripts/test-quarantine.ts).
      - name: Full server suite (minus quarantine)
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/chisabot_test
          CHISABOT_COMPUTER_STOP_HTTP: "1"
        run: bun run test:server
      # Private host info guard. The deny list lives in the repository variable
      # PRIVATE_HOST_DENY (Settings → Secrets and variables → Actions → Variables),
      # deliberately NOT in this file: a guard that spelled out the address would
      # leak the very thing it is meant to keep out, and CI logs for a public repo
      # are public. Semicolon-separated extended-regex alternatives; the variable is
      # never echoed. See CONTRIBUTING.md §2.
      - name: Private host info guard
        env:
          DENY: ${{ vars.PRIVATE_HOST_DENY }}
        run: |
          if [ -z "$(printf '%s' "$DENY" | tr -d '[:space:]')" ]; then
            echo "::warning::PRIVATE_HOST_DENY is not set, so the private host info guard was skipped."
            echo "Set it to a semicolon-separated list of the host identifiers that must never be committed."
            exit 0
          fi
          pattern=$(printf '%s' "$DENY" | tr ';' '|')
          if git grep -nIE "$pattern" -- . ; then
            echo "::error::Tracked files contain private host information. See CONTRIBUTING.md §2."
            exit 1
          fi
          echo "OK: no private host identifiers in tracked files."

  # 全仓 Biome 零容忍门禁：强制 0 error 0 warning（生产代码禁 `!` 非空断言、冗余 Fragment 等）。
  biome:
    name: Biome (zero errors & warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'agent-computer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --omit=peer --linker hoisted
      - name: Whole-repo Biome lint (0 error 0 warning)
        run: bun run lint

  # 完整的 app 测试（scripts/run-app-tests.ts：共享进程跑全部文件，名单里的文件各自单独进程跑）。
  app-tests:
    name: App tests (bun run test:app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'agent-computer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --omit=peer --linker hoisted
      - run: cp .env.example .env
      - run: bun run test:app
      # CB-111 P3：两个文件同进程、反序也要过（模块级提示状态不串）。
      - name: Memory undo toast order independence (CB-111 P3)
        working-directory: app
        run: bun test tests/memory-undo-toast-limit.test.tsx tests/memory-delete-undo.test.tsx

  # DSH 运行时（runtime/dsh）：独立的 Node 项目。真 Host + 假上游：模型回退、改绑、行动承诺催办、工具循环上限。
  dsh-runtime:
    name: DSH Host and PostgreSQL recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Full product migrations require vector; match production's PostgreSQL 16 + pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chisabot_dsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d chisabot_dsh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: runtime/dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/dsh/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'agent-computer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install product dependencies
        working-directory: .
        run: bun install --frozen-lockfile --omit=peer --linker hoisted
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: DSH long-history compaction and source durability checks
        working-directory: .
        run: bun test runtime/dsh/tests/long-history.test.ts runtime/dsh/tests/source-durability.test.ts
      - name: Durable commands, approval gaps and process recovery
        working-directory: .
        env:
          CHISABOT_DSH_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/chisabot_dsh_test
        run: bun run test:dsh

  # PC 客户端（pc/）的 node 测试；和 release.yml 的 pc-test 同一套（CB-113：以前只有发版时才跑）。
  pc-test:
    name: PC client tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  # PC 客户端（pc/）的安装 + 构建。pc/ 是独立的 npm 项目，不进 workspaces，也不进主构建；
  # 这里用它自己的 lock 安装，再按 app/vite.config.ts 里 chisabotNodeBundle 的同一组参数把
  # src/headless.js 打成 chisabot-node.cjs，跑一下 --version 确认包能加载、版本号注入正确。
  # 带 Electron 的安装包（electron-builder --win）只能在 Windows 上打，仍由 release.yml 负责。
  pc-build:
    name: PC client install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build the headless node bundle
        run: |
          version="$(node -p 'require("./package.json").version')"
          npx --yes esbuild@0.28.2 src/headless.js --bundle --platform=node --target=node18 --format=cjs \
            --external:bufferutil --external:utf-8-validate --external:electron \
            --define:__CHISABOT_NODE_VERSION__="\"$version\"" \
            --outfile="$RUNNER_TEMP/chisabot-node.cjs"
          node --check "$RUNNER_TEMP/chisabot-node.cjs"
          printed="$(node "$RUNNER_TEMP/chisabot-node.cjs" --version)"
          if [ "$printed" != "$version" ]; then
            echo "::error::chisabot-node --version printed '$printed', expected '$version'"
            exit 1
          fi
          echo "chisabot-node $printed built."

  # vite 分块守卫（DESIGN.md §41.5）与前端 typecheck：
  # 普通构建先重新生成 app/src/routeTree.gen.ts，紧接着做 app typecheck（避免 web-and-models 重复打 vite build）；
  # 再以 NODE_ENV=test 打一次复核 chunkGuard，最后用 chunk-graph 测试对 dist 复核一遍。
  chunk-guard:
    name: App chunk guard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'agent-computer/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --omit=peer --linker hoisted
      - run: cp .env.example .env
      - run: bun run generate:app-config
      - run: cd app && bun --bun ../node_modules/vite/bin/vite.js build
      - run: bun run --cwd app typecheck
      - run: cd app && NODE_ENV=test bun --bun ../node_modules/vite/bin/vite.js build
      - run: cd app && bun test tests/chunk-graph.test.ts

  # Android 单元测试（NativeLogicTest / ShapeAvatarTest）：
  # 平时仅做秒级路径检测，只有改动 android/** 或 ShapeAvatarTest 交叉校验的前端色板/样式文件
  # （或手动 workflow_dispatch）时才安装 JDK 17 / Gradle 8.9 并运行 testDebugUnitTest，
  # 避免拖慢无关 PR，同时避免把 Android 单测回归留到发版标签（release.yml）才暴露。
  android-test:
    name: Android unit tests (on android/** changes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Android-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running Android unit tests."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            if ! changed="$(git diff --name-only "$BASE_SHA...HEAD" 2>/dev/null)"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! changed="$(git diff --name-only "$BEFORE_SHA..HEAD" 2>/dev/null)"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No base commit available: running Android unit tests."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(android/|app/src/lib/agents/avatar-shapes\.ts$|app/src/styles\.css$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Android-relevant changes detected:"
            printf '%s\n' "$changed" | grep -E '^(android/|app/src/lib/agents/avatar-shapes\.ts$|app/src/styles\.css$)'
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Android-relevant changes; skipping Gradle unit tests."
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.run == 'true'
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
