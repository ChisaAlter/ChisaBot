name: ChisaBot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chisabot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-models:
    name: Web, model settings and Magpie catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Hoisted, like the image (Dockerfile): shared/ is not a workspace and imports zod / @json-render
      # from the app and server trees; under the isolated linker those don't resolve from shared/.
      - run: bun install --frozen-lockfile --linker hoisted
      - run: cp .env.example .env
      - run: node scripts/check-zh-localization.cjs
      - run: bun run --cwd server typecheck
      # build first: it regenerates app/src/routeTree.gen.ts, which typecheck reads (the committed copy
      # lags behind new routes because parallel PRs each add their own).
      # Same as the image build (Dockerfile): with the hoisted tree vite sits at the root, and app's own
      # build script names app/node_modules/vite.
      - run: bun run generate:app-config && cd app && bun --bun ../node_modules/vite/bin/vite.js build
      - run: bun run --cwd app typecheck
      - name: Server model, permission and runtime checks
        run: >-
          bun test
          server/tests/config.test.ts
          server/tests/agent-model-policy.test.ts
          server/tests/agent-model-runtime.test.ts
          server/tests/agent-profile-policy.test.ts
          server/tests/agent-resolver.test.ts
          server/tests/agent-routes.test.ts
          server/tests/dynamic-model-runtime.test.ts
          server/tests/model-catalog.test.ts
          server/tests/model-connection-context.test.ts
          server/tests/model-selection-routes.test.ts
          server/tests/model-settings-routes.test.ts
          server/tests/model-settings.test.ts
          server/tests/computer-tool-outcome.test.ts
          server/tests/agent-runtime-connection-refused.test.ts
          server/tests/agent-runtime-connect-timeout.test.ts
          server/tests/compose-network-drift.test.ts
          server/tests/admin-smoke.test.ts
      # The chat regression set every ChisaBot PR runs on the server (the older model-chooser DOM tests
      # need a live API and never ran here while typecheck was failing; see docs/slimming.md P3).
      - name: Chat UI checks
        working-directory: app
        run: bun test tests/no-group-has.test.ts tests/stopped-turn.test.ts tests/bot-message-list.test.tsx tests/link-cards.test.tsx tests/rich-previews-extract.test.ts tests/ui-align.test.ts tests/connection-drop.test.ts tests/fold-narration.test.ts tests/chat-unify.test.ts tests/turn-unfinished.test.tsx tests/workspace-links.test.ts tests/agent-runtime-unreachable.test.ts
      - name: Request, message identity and persistent queue checks
        working-directory: app
        env:
          NODE_ENV: test
        # Separate test processes keep SDK module registrations and DOM globals isolated.
        run: |
          bun test tests/client-deadline.test.ts tests/computer-tool-refusals.test.ts
          bun test tests/message-node-identity.test.tsx tests/message-blank-release.test.ts
          bun test tests/tail-first-paint.test.ts
          bun test tests/message-scroll-reduced-motion.test.tsx
          bun test tests/thread-inbox-paused.test.tsx tests/thread-inbox-concurrency.test.tsx tests/conversation-sync.test.ts
          bun test tests/schedule-fired.test.tsx
          bun test tests/schedule-edit.test.tsx
          bun test tests/schedule-runs-query.test.ts
          bun test tests/stop-queue.test.tsx
          bun test tests/computer-activity-log.test.tsx tests/computer-activity.test.ts
          bun test tests/computer-control-status.test.ts tests/browser-presence.test.ts
          bun test tests/control-poll-single-source.test.tsx tests/control-backoff-timing.test.ts
          bun test tests/control-tabs-leader.test.ts
          bun test tests/keep-alive.test.tsx
          bun test tests/computer-preview-visibility.test.tsx
          bun test tests/sidebar-search-nav.test.ts tests/channel-pagination.test.tsx tests/channel-search.test.ts tests/focus-message.test.ts tests/scroll-within.test.ts tests/sidebar-shortcut-layouts.test.tsx
          # CB-106：app/bunfig.toml 已自动加载 ./tests/preload.ts（DOM 下先求值 Base UI），无需再显式 --preload（CB-110）。
          bun test tests/memory-delete-undo.test.tsx
          bun test tests/memory-undo-toast-limit.test.tsx
          # CB-111 P3：两个文件同进程、两种顺序都要过（模块级提示状态不串）。
          bun test ../app/tests/memory-delete-undo.test.tsx ../app/tests/memory-undo-toast-limit.test.tsx
          bun test ../app/tests/memory-undo-toast-limit.test.tsx ../app/tests/memory-delete-undo.test.tsx
          # DF-30：电脑卡片外框不再 button 套「重试」button。
          bun test tests/computer-frame-nested-button.test.tsx
          # DF-13：service worker 导航失败区分离线 / 服务器慢（超时、502/503）并自动重试。
          bun test tests/sw-navigation.test.ts
          bun test tests/channel-avatar-mood.test.tsx
          bun test tests/shape-avatar.test.tsx
      - name: Install actual computer service dependencies
        working-directory: agent-computer
        run: bun install --frozen-lockfile
      - name: Durable inbox and database recovery checks
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/openbot_test
          CHISABOT_COMPUTER_STOP_HTTP: "1"
        run: |
          bun test server/tests/database-deadline.integration.test.ts server/tests/database-recovery.test.ts
          bun test server/tests/local-conversations-inbox.integration.test.ts server/tests/thread-inbox-paused.integration.test.ts server/tests/thread-inbox.test.ts
          bun test server/tests/stop-queue.integration.test.ts
          bun test server/tests/computer-stop.test.ts
          bun test server/tests/agent-runtime-unreachable.integration.test.ts
          bun test server/tests/schedules-paused-next.integration.test.ts
          bun test server/tests/schedules-runs-param.test.ts
          bun test server/tests/schedules.test.ts
          bun test server/tests/channel-search-hit-meta.test.ts
          bun test server/tests/computer-activity-redact.test.ts server/tests/computer-activity-gateway.test.ts server/tests/computer-activity-store.integration.test.ts
          bun test server/tests/multi-user-unified-admin.test.ts server/tests/bot-avatars.test.ts
      # CB-103：GET /control 一律 200 + state，截图让路回 409 user_control，接管中的拒绝记进活动记录。
      - name: Computer control state checks (CB-103)
        run: bun test server/tests/computer-routes.test.ts server/tests/computer-client.test.ts
      - name: Cloud browser native select (DESIGN.md §100)
        working-directory: agent-computer
        run: bun test tests/native-select.test.ts tests/aria-snapshot.test.ts
      - name: SSRF red-line (PRD-P1-06)
        run: bun test server/tests/ssrf-redline.test.ts server/tests/guarded-fetch-ssrf.test.ts shared/ops-counters.test.ts shared/ops-codes.test.ts
      - name: Trust-boundary network isolation red-line
        run: bun test shared/trust-boundary.test.ts server/tests/trust-boundary-redline.test.ts
      - name: Log-scrub red-line (PRD-P0-05)
        run: bun test server/tests/log-scrub-redline.test.ts
      - name: Nginx template sync check (apply-or-fail process)
        run: sh scripts/ops/sync-nginx.sh --check-repo
      - name: Schedule honesty / partition (non-tram re-verify)
        run: bun test shared/schedules.test.ts shared/activity-labels.test.ts
      - name: Login gateway checks
        run: bun test deploy/public/auth/server.test.ts deploy/public/auth/accounts.test.ts deploy/public/auth/startup-report.test.ts
      - name: Updater shell script checks (CB-100b)
        run: |
          for f in deploy/updater/*.sh; do bash -n "$f"; done
          bash deploy/updater/test-shell.sh
          python3 -m unittest discover -s deploy/updater -p "test_*.py"
      # Private host info guard. The deny list lives in the repository variable
      # PRIVATE_HOST_DENY (Settings → Secrets and variables → Actions → Variables),
      # deliberately NOT in this file: a guard that spelled out the address would
      # leak the very thing it is meant to keep out, and CI logs for a public repo
      # are public. Semicolon-separated extended-regex alternatives; the variable is
      # never echoed. See CONTRIBUTING.md §2.
      - name: Private host info guard
        env:
          DENY: ${{ vars.PRIVATE_HOST_DENY }}
        run: |
          if [ -z "$(printf '%s' "$DENY" | tr -d '[:space:]')" ]; then
            echo "::warning::PRIVATE_HOST_DENY is not set, so the private host info guard was skipped."
            echo "Set it to a semicolon-separated list of the host identifiers that must never be committed."
            exit 0
          fi
          pattern=$(printf '%s' "$DENY" | tr ';' '|')
          if git grep -nIE "$pattern" -- . ; then
            echo "::error::Tracked files contain private host information. See CONTRIBUTING.md §2."
            exit 1
          fi
          echo "OK: no private host identifiers in tracked files."

  # Biome 只拦本次改动新增的问题：全仓还有上千个存量问题，一次改完风险太大。
  # scripts/biome-new-issues.ts 把改动文件在基线（PR 的目标分支 / push 前的 main）与当前版本各查一遍，
  # 按「文件 + 规则」比较诊断数，变多就失败；存量问题不拦，顺手修掉的只会让数变少。
  biome:
    name: Biome (new issues only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 要能读到基线提交的文件内容。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker hoisted
      - name: No new Biome diagnostics in changed files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # 新建分支的 push / 手动触发没有基线，退回到上一个提交。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^1"
          fi
          bun scripts/biome-new-issues.ts "$base"

  # 完整的 app 测试（scripts/run-app-tests.ts：共享进程跑全部文件，名单里的文件各自单独进程跑）。
  # 上面 web-and-models 里挑出来的那些子集照旧保留，这里是兜住其余文件的全量。
  app-tests:
    name: App tests (bun run test:app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker hoisted
      - run: cp .env.example .env
      - run: bun run test:app

  # PC 客户端（pc/）的 node 测试；和 release.yml 的 pc-test 同一套（CB-113：以前只有发版时才跑）。
  pc-test:
    name: PC client tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  # PC 客户端（pc/）的安装 + 构建。pc/ 是独立的 npm 项目，不进 workspaces，也不进主构建；
  # 这里用它自己的 lock 安装，再按 app/vite.config.ts 里 chisabotNodeBundle 的同一组参数把
  # src/headless.js 打成 chisabot-node.cjs，跑一下 --version 确认包能加载、版本号注入正确。
  # 带 Electron 的安装包（electron-builder --win）只能在 Windows 上打，仍由 release.yml 负责。
  pc-build:
    name: PC client install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build the headless node bundle
        run: |
          version="$(node -p 'require("./package.json").version')"
          npx --yes esbuild@0.28.2 src/headless.js --bundle --platform=node --target=node18 --format=cjs \
            --external:bufferutil --external:utf-8-validate --external:electron \
            --define:__CHISABOT_NODE_VERSION__="\"$version\"" \
            --outfile="$RUNNER_TEMP/chisabot-node.cjs"
          node --check "$RUNNER_TEMP/chisabot-node.cjs"
          printed="$(node "$RUNNER_TEMP/chisabot-node.cjs" --version)"
          if [ "$printed" != "$version" ]; then
            echo "::error::chisabot-node --version printed '$printed', expected '$version'"
            exit 1
          fi
          echo "chisabot-node $printed built."
