name: Perf (jank harness, non-blocking)

# Builds the PR head and its base, runs perf/jank.mjs on both (headless Chrome, 1024×673, DPR 1.25,
# 4x CPU, mock /api) and writes the before/after table to the job summary. Informational only:
# CI runners are noisy, so this never fails the PR (see perf/README.md; the blocking guard is P2-4).

on:
  pull_request:
    paths:
      - "app/**"
      - "shared/**"
      - "perf/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jank:
    name: Jank harness (before/after)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      SCENARIOS: idle,sidebar,panel,switch,scroll,stream,settings,orb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build head
        run: |
          bun install --frozen-lockfile --linker hoisted
          cp .env.example .env
          bun run generate:app-config
          (cd app && bun --bun ../node_modules/vite/bin/vite.js build)
      - name: Build base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          bun install --frozen-lockfile --linker hoisted
          cp .env.example .env
          bun run generate:app-config
          (cd app && bun --bun ../node_modules/vite/bin/vite.js build)
      - name: Run harness
        run: |
          if [ -d "$RUNNER_TEMP/base/app/dist" ]; then
            node perf/jank.mjs --dist="$RUNNER_TEMP/base/app/dist" --scenario="$SCENARIOS" --runs=1 --out=perf/out/base
          fi
          node perf/jank.mjs --dist=app/dist --scenario="$SCENARIOS" --runs=1 --out=perf/out/head
      - name: Summary
        if: always()
        run: |
          {
            echo "## Jank harness (4x CPU, 1 run, informational)"
            if [ -f perf/out/base/summary.json ] && [ -f perf/out/head/summary.json ]; then
              node perf/compare.mjs perf/out/base perf/out/head --label-before=base --label-after=head --interactions
            elif [ -f perf/out/head/summary.json ]; then
              node perf/compare.mjs perf/out/head perf/out/head --label-before=head --label-after=head
            else
              echo "harness did not produce a summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-jank
          path: perf/out
          if-no-files-found: ignore
          retention-days: 14
