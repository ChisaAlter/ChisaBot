name: Client release

# 推 v* 标签（或在 Actions 页手动运行并填标签）时构建 ChisaBot 客户端安装包，并发布到该标签的 GitHub Release：
#   - PC（pc/，Electron，windows-latest）：NSIS 安装包、免安装 zip、latest.yml、.blockmap
#   - Android（android/，Kotlin + Jetpack Compose 原生，ubuntu-latest）：APK + chisabot-android.json（含 sha256）
# Release 里放的是「通用版」：不内置任何服务器，首次运行由用户填写自己的服务器地址，在线更新读本仓库的 Releases。
# 仓库变量 CHISABOT_SERVER_URL / CHISABOT_UPDATE_FEED / CHISABOT_ANDROID_UPDATE_FEED（或手动运行时的同名输入）
# 存在时，再多打一份「自建版」作为工作流产物（pc-custom、android-custom），由发布者放到自己的更新目录。
# Android 签名：Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD；
# 没有配置时产出 -unsigned.apk。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建 / 更新的 Release 标签（如 v0.1.0；留空只构建不发布）"
        required: false
        default: ""
      server_url:
        description: "自建版：预填的服务器地址（留空用仓库变量 CHISABOT_SERVER_URL）"
        required: false
        default: ""
      update_feed:
        description: "自建版：PC 更新目录（留空用 CHISABOT_UPDATE_FEED）"
        required: false
        default: ""
      android_update_feed:
        description: "自建版：Android latest.json 地址（留空用 CHISABOT_ANDROID_UPDATE_FEED）"
        required: false
        default: ""
      signed_apk_url:
        description: "没有配置签名 Secrets 时：离线签好的通用版 APK 地址（https），Release 用它代替 -unsigned.apk"
        required: false
        default: ""
      signed_apk_sha256:
        description: "上面 APK 的 sha256（必填，不一致就失败）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.c.outputs.tag }}
      version: ${{ steps.c.outputs.version }}
      version_code: ${{ steps.c.outputs.version_code }}
      flavors: ${{ steps.c.outputs.flavors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SERVER_URL: ${{ inputs.server_url || vars.CHISABOT_SERVER_URL }}
          PC_FEED: ${{ inputs.update_feed || vars.CHISABOT_UPDATE_FEED }}
          ANDROID_FEED: ${{ inputs.android_update_feed || vars.CHISABOT_ANDROID_UPDATE_FEED }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          version=$(node -p "require('./pc/package.json').version")
          aver=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          if [ "$version" != "$aver" ]; then echo "::error::版本不一致：pc=$version android=$aver"; exit 1; fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then echo "::error::标签 $tag 与版本 v$version 不一致"; exit 1; fi
          flavors='["generic"]'
          if [ -n "$SERVER_URL$PC_FEED$ANDROID_FEED" ]; then flavors='["generic","custom"]'; fi
          { echo "tag=$tag"; echo "version=$version"; echo "version_code=$code"; echo "flavors=$flavors"; } >> "$GITHUB_OUTPUT"
          echo "版本 $version（$code），标签 ${tag:-（不发布）}，构建 $flavors"

  # PC 单元测试是 POSIX 的（本机操作的 shell 测试用 /bin/sh），在 Linux 上跑；Windows 只负责打包。
  pc-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  pc:
    needs: [config, pc-test]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.config.outputs.flavors) }}
    defaults:
      run:
        shell: bash
        working-directory: pc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build config
        env:
          FLAVOR: ${{ matrix.flavor }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ inputs.server_url || vars.CHISABOT_SERVER_URL }}
          PC_FEED: ${{ inputs.update_feed || vars.CHISABOT_UPDATE_FEED }}
        run: |
          if [ "$FLAVOR" = custom ]; then server="$SERVER_URL"; feed="$PC_FEED"; else server=""; feed=""; fi
          node -e 'const [s,f,r]=process.argv.slice(1);require("fs").writeFileSync("src/build-config.json",JSON.stringify({serverUrl:s,updateFeed:f,githubRepo:r},null,2)+"\n")' "$server" "$feed" "$REPO"
          if [ -n "$feed" ]; then url="${feed%/}/"; else url="https://github.com/$REPO/releases/latest/download/"; fi
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("package.json","utf8"));p.build.publish=[{provider:"generic",url:process.argv[1],channel:"latest"}];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$url"
          cat src/build-config.json; echo "publish.url=$url"
      - name: Shell fingerprint
        # 外壳指纹（图标 / 安装脚本 / Electron 版本…）打进 asar；客户端拿它和 latest.yml 的 chisabotShell 比，
        # 不同就走「重新安装」而不是 --updated 覆盖更新（docs/online-update.md §2.1）。
        run: node scripts/shell-fingerprint.js --write
      - name: electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Stamp latest.yml
        run: node scripts/shell-fingerprint.js --stamp dist/latest.yml
      - name: Check latest.yml sha512
        run: |
          cat dist/latest.yml
          exe=$(ls dist/*-setup.exe)
          want=$(sed -n 's/^sha512: //p' dist/latest.yml)
          got=$(node -e 'const c=require("crypto"),fs=require("fs");process.stdout.write(c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$exe")
          [ "$want" = "$got" ] || { echo "::error::latest.yml sha512 与安装包不符"; exit 1; }
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-${{ matrix.flavor }}
          if-no-files-found: error
          path: |
            pc/dist/*-setup.exe
            pc/dist/*-setup.exe.blockmap
            pc/dist/*-portable.zip
            pc/dist/latest.yml

  android:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.config.outputs.flavors) }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "签名：仓库 Secrets"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，产出未签名 APK"
          fi
      - name: assembleRelease
        env:
          FLAVOR: ${{ matrix.flavor }}
          SERVER_URL: ${{ inputs.server_url || vars.CHISABOT_SERVER_URL }}
          ANDROID_FEED: ${{ inputs.android_update_feed || vars.CHISABOT_ANDROID_UPDATE_FEED }}
          CHISABOT_GITHUB_REPO: ${{ github.repository }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$FLAVOR" = custom ]; then
            export CHISABOT_SERVER_URL="$SERVER_URL" CHISABOT_ANDROID_UPDATE_FEED="$ANDROID_FEED"
          fi
          gradle --no-daemon testDebugUnitTest assembleRelease
          ls -la app/build/outputs/apk/release/
      - name: APK + feed json
        env:
          FLAVOR: ${{ matrix.flavor }}
          VERSION: ${{ needs.config.outputs.version }}
          VERSION_CODE: ${{ needs.config.outputs.version_code }}
          TAG: ${{ needs.config.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          dir=app/build/outputs/apk/release
          if [ -f "$dir/app-release.apk" ]; then
            apk="ChisaBot-Android-$VERSION.apk"; cp "$dir/app-release.apk" "out/$apk"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            "$SDK_ROOT"/build-tools/$(ls "$SDK_ROOT/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "out/$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          else
            apk="ChisaBot-Android-$VERSION-unsigned.apk"; cp "$dir/app-release-unsigned.apk" "out/$apk"
          fi
          sha=$(sha256sum "out/$apk" | cut -d' ' -f1)
          if [ "$FLAVOR" = custom ]; then url="$apk"; json=latest.json
          else url="https://github.com/$REPO/releases/download/${TAG:-v$VERSION}/$apk"; json=chisabot-android.json; fi
          notes="ChisaBot $VERSION"
          if [ -f "../.github/release-notes/v$VERSION.android.txt" ]; then notes=$(cat "../.github/release-notes/v$VERSION.android.txt"); fi
          python3 -c 'import json,sys;v,c,u,s,n=sys.argv[1:];print(json.dumps({"version":v,"versionCode":int(c),"url":u,"sha256":s,"notes":n},ensure_ascii=False,indent=2))' \
            "$VERSION" "$VERSION_CODE" "$url" "$sha" "$notes" > "out/$json"
          cat "out/$json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.flavor }}
          if-no-files-found: error
          path: android/out/*

  release:
    needs: [config, pc, android]
    if: needs.config.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-generic"
          path: release-assets
          merge-multiple: true
      - name: Externally signed APK
        if: inputs.signed_apk_url != ''
        env:
          APK_URL: ${{ inputs.signed_apk_url }}
          APK_SHA: ${{ inputs.signed_apk_sha256 }}
          VERSION: ${{ needs.config.outputs.version }}
          VERSION_CODE: ${{ needs.config.outputs.version_code }}
          TAG: ${{ needs.config.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          case "$APK_URL" in https://*) ;; *) echo "::error::signed_apk_url 必须是 https"; exit 1 ;; esac
          apk="ChisaBot-Android-$VERSION.apk"
          curl -fsSL -o "/tmp/$apk" "$APK_URL"
          echo "$APK_SHA  /tmp/$apk" | sha256sum -c -
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$sdk/build-tools/$(ls "$sdk/build-tools" | sort -V | tail -n 1)"
          echo "build-tools: $bt"
          "$bt/apksigner" verify --print-certs "/tmp/$apk" > /tmp/sig 2>&1 || { cat /tmp/sig; echo "::error::APK 签名校验失败"; exit 1; }
          cat /tmp/sig
          grep -qE "certificate (DN|SHA-256)" /tmp/sig
          "$bt/aapt2" dump badging "/tmp/$apk" > /tmp/badging 2>&1 || { cat /tmp/badging; exit 1; }
          grep -m1 "^package:" /tmp/badging
          grep -q "versionCode='$VERSION_CODE'" /tmp/badging && grep -q "versionName='$VERSION'" /tmp/badging
          rm -f release-assets/*-unsigned.apk
          mv "/tmp/$apk" release-assets/
          python3 - "$VERSION" "$VERSION_CODE" "https://github.com/$REPO/releases/download/$TAG/$apk" "$APK_SHA" <<'PY'
          import json, sys
          v, c, u, s = sys.argv[1:]
          p = "release-assets/chisabot-android.json"
          d = json.load(open(p))
          d.update(version=v, versionCode=int(c), url=u, sha256=s.lower())
          json.dump(d, open(p, "w"), ensure_ascii=False, indent=2)
          print(json.dumps(d, ensure_ascii=False))
          PY
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.config.outputs.tag }}
          VERSION: ${{ needs.config.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          ls -la release-assets
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || { printf 'ChisaBot %s\n' "$VERSION" > /tmp/notes.md; notes=/tmp/notes.md; }
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "ChisaBot $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "ChisaBot $TAG" --notes-file "$notes"
          fi
          # 已签名的 APK 上线后，删掉旧的未签名 APK
          if ls release-assets/*.apk | grep -vq unsigned; then
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -- '-unsigned\.apk$' | while read -r n; do gh release delete-asset "$TAG" "$n" --repo "$REPO" --yes; done
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber release-assets/*
          gh release view "$TAG" --repo "$REPO" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
